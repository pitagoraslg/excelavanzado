<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Automatización con macros y VBA · Módulo 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Material de estudio: escenario fijo 1280×720 escalado a la pantalla. Fondo crema; burdeos y turquesa solo como acentos. */
:root{
  --bg:#f1ebdf; --paper:#fbf7ef; --card:#ffffff; --ink:#6e1f3a; --text:#231b20; --muted:#665a55; --line:#ebe3d4; --grid:#d9cdb8;
  --acc:#159a8c; --acc-d:#0b6b61; --acc-soft:#dcf2ef; --pos:#3b7a2e; --pos-soft:#e5f1df; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#f5ead9;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(80,60,30,.14);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:54px 72px 68px;display:none;flex-direction:column;gap:12px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:26px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.12;text-wrap:balance}
h2{font-size:34px}
h3{font-size:20px;margin-bottom:4px}
p{margin:0}
b{font-weight:600}
.eyebrow{font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d)}
.intro{font-size:18px;line-height:1.5;color:var(--text);text-wrap:pretty}

/* Cuerpo de estudio en dos columnas */
.g{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1;min-height:0;align-items:start}
.g.a{grid-template-columns:1.15fr .85fr}
.g.b{grid-template-columns:.9fr 1.1fr}
.col{display:flex;flex-direction:column;gap:11px;min-width:0}
.tx{font-size:16.5px;line-height:1.5}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:16.5px;line-height:1.45}
.ul li{padding-left:20px;position:relative}
.ul li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;background:var(--acc);border-radius:50%}
.ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:16.5px;line-height:1.45;counter-reset:n}
.ol li{display:grid;grid-template-columns:26px 1fr;gap:8px;counter-increment:n}
.ol li::before{content:counter(n);display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:1px}
.ruta{font-family:"Segoe UI",Arial,sans-serif;font-size:14.5px;display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.ruta span{background:#fff;border:1px solid var(--grid);padding:0 7px;font-weight:600}
.ruta i{font-style:normal;color:var(--acc-d);font-weight:700}
code{font-family:var(--mono);font-size:.9em;background:var(--ink-soft);color:var(--ink);padding:0 5px;font-weight:600;white-space:nowrap}

.box{border-left:4px solid var(--acc);background:var(--acc-soft);padding:9px 14px;font-size:15.5px;line-height:1.45}
.box b.t{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d);margin-bottom:2px}
.box.imp{border-color:var(--neg);background:var(--neg-soft)}
.box.imp b.t{color:var(--neg)}
.box.ej{border-color:var(--ink);background:var(--ink-soft)}
.box.ej b.t{color:var(--ink)}

.tb{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
.tb th{background:var(--ink);color:#fff;text-align:left;padding:6px 10px;font-weight:600}
.tb td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top;line-height:1.38}
.tb td:first-child{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}
.tb.n td:first-child{font-family:var(--sans);color:var(--text);white-space:normal}

/* Código VBA con los colores del editor */
.code{margin:0;font-family:var(--mono);font-size:14.5px;line-height:1.5;background:#fff;border:1px solid var(--grid);border-left:5px solid var(--ink);padding:11px 16px;white-space:pre;color:#1b1b1b;overflow:hidden}
.code.s{font-size:13.5px}
.code .k{color:#1d47b8;font-weight:600}
.code .t{color:#a31515}
.code .c{color:#2e7d32;font-style:italic}

/* Mensaje y barra de seguridad */
.msgbox{background:#fff;border:1px solid #9aa3a6;box-shadow:0 8px 20px rgba(0,0,0,.12);font-family:"Segoe UI",Arial,sans-serif;width:100%}
.msgbox .tt{padding:5px 10px;border-bottom:1px solid #ddd;font-size:13.5px}
.msgbox .bd{display:flex;gap:12px;padding:12px 14px 6px;font-size:15px;align-items:flex-start}
.msgbox .bd i{font-style:normal;display:inline-flex;width:28px;height:28px;border-radius:50%;background:#1d6fd6;color:#fff;align-items:center;justify-content:center;font-weight:700;flex:none}
.msgbox .bt{display:flex;justify-content:flex-end;gap:8px;padding:6px 12px 10px;background:#f0f0f0}
.msgbox .bt span{border:1px solid #1d6fd6;padding:2px 16px;font-size:13.5px;background:#fff}
.seg{display:flex;align-items:center;gap:12px;background:#fff4ce;border:1px solid #e5c76b;padding:8px 12px;font-family:"Segoe UI",Arial,sans-serif;font-size:14.5px}
.seg span.b{margin-left:auto;border:1px solid #888;background:#fff;padding:3px 10px;font-size:13px;white-space:nowrap}
.seg.rojo{background:#fde7e9;border-color:#e3a2a8}

.sv{width:100%;height:auto;display:block;font-family:var(--sans);overflow:visible}
.sv .c{fill:var(--card);stroke:var(--grid);stroke-width:1.5}
.sv .c.i{fill:var(--ink);stroke:var(--ink)}
.sv .c.a{fill:var(--acc-soft);stroke:var(--acc)}
.sv .c.v{fill:var(--pos-soft);stroke:var(--pos)}
.sv text{fill:var(--text)}
.sv text.i{fill:#fff;font-weight:600}
.sv .f{stroke:var(--acc);stroke-width:3;fill:none}
.sv .p{fill:var(--acc)}

/* Portada sin fondo especial */
.cover{justify-content:center;gap:20px;padding:70px 110px}
.cover-logo{position:absolute;top:50px;right:72px;height:86px;width:auto}
.cover .mod{font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-d)}
.cover h1{font-size:72px;color:var(--ink)}
.cover .sub{font-size:24px;color:var(--muted);line-height:1.4;max-width:900px}
.cover .by{font-size:22px}.cover .by b{color:var(--acc-d)}
.cover .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cover .meta span{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);padding:4px 10px;color:var(--muted);background:#fff}
.indice{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-top:6px}
.indice div{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;font-size:18px;line-height:1.35;border-bottom:1px solid var(--line);padding-bottom:8px}
.indice b{font-family:var(--serif);font-size:24px;color:var(--acc)}
.indice span small{display:block;font-size:14px;color:var(--muted)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;font-size:16px;line-height:1.38}
.refs li{padding-left:28px;text-indent:-28px}
.refs a{color:var(--ink);word-break:break-all;text-decoration:none}
#giroTel{display:none;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.4}
@media (max-width:640px) and (orientation:portrait){#giroTel{display:flex}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none!important}}
</style>
</head>
<body>
<div id="giroTel"><p>📱 Gire su teléfono para ver la presentación en horizontal.</p></div>
<div id="stage">
  <div class="top"><span id="topL">MACROS Y VBA.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Ayudas de dibujo y texto ---------- */
const C = (x,y,w,h,txt,cl="",t=24) => { const L=[].concat(txt), y0=y+h/2-(L.length-1)*t*.62; return `<rect class="c ${cl}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>${L.map((l,i)=>`<text class="${cl}" x="${x+w/2}" y="${y0+i*t*1.24+t*.34}" text-anchor="middle" font-size="${t}">${l}</text>`).join("")}`; };
const F = (x1,y1,x2,y2) => { const a=Math.atan2(y2-y1,x2-x1), p=(d,b)=>`${x2-d*Math.cos(a-b)},${y2-d*Math.sin(a-b)}`; return `<line class="f" x1="${x1}" y1="${y1}" x2="${x2-10*Math.cos(a)}" y2="${y2-10*Math.sin(a)}"/><polygon class="p" points="${x2},${y2} ${p(16,.42)} ${p(16,-.42)}"/>`; };
const svg = (w,h,body,alt) => `<svg class="sv" viewBox="0 0 ${w} ${h}" role="img" aria-label="${alt}">${body}</svg>`;
const ul = a => `<ul class="ul">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const ol = a => `<ol class="ol">${a.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>`;
const box = (t,h,cl="") => `<div class="box ${cl}"><b class="t">${t}</b>${h}</div>`;
const tb = (enc,filas,cl="") => `<table class="tb ${cl}"><tr>${enc.map(e=>`<th>${e}</th>`).join("")}</tr>${filas.map(f=>`<tr>${f.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const ruta = (...p) => `<span class="ruta">${p.map(x=>`<span>${x}</span>`).join("<i>›</i>")}</span>`;
const KW = ["Sub","End","Dim","As","Set","If","Then","Else","ElseIf","For","Each","In","Next","To","Step","With","Integer","Long","Double","String","Boolean","Date","Variant","True","False","Nothing","And","Or","Not","Select","Case","Option","Explicit","Exit","Do","Loop","While"];
function vb(src,cl=""){ const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const pal=s=>esc(s).replace(/\b([A-Za-z]+)\b/g,m=>KW.includes(m)?`<span class="k">${m}</span>`:m);
  return `<pre class="code ${cl}">${src.split("\n").map(l=>{ let out="",buf="",tx=false; for(let i=0;i<l.length;i++){ const ch=l[i];
      if(ch==='"'){ if(!tx){out+=pal(buf);buf='"';tx=true;} else {buf+='"';out+=`<span class="t">${esc(buf)}</span>`;buf="";tx=false;} continue; }
      if(ch==="'"&&!tx){ return out+pal(buf)+`<span class="c">${esc(l.slice(i))}</span>`; } buf+=ch; }
    return out+(tx?`<span class="t">${esc(buf)}</span>`:pal(buf)); }).join("\n")}</pre>`; }

/* ---------- Láminas de estudio ---------- */
const S=[]; const SECC=["Inicio","Automatizar","Primeros pasos","Grabar","El editor","Objetos","El lenguaje","Interacción","Botón y pruebas","Cierre"];
const lam=(t,h,cl="")=>S.push({t,h:`<div class="slide ${cl}">${h}</div>`});
const est=(t,ey,tit,intro,izq,der,g="")=>lam(t,`<p class="eyebrow">${ey}.</p><h2>${tit}</h2>${intro?`<p class="intro">${intro}</p>`:""}<div class="g ${g}"><div class="col">${izq}</div><div class="col">${der}</div></div>`);

/* 1 · Portada */
lam(0,`<img class="cover-logo" src="img/icadep-isologo.png" alt="ICADEP-XXI · Instituto de Capacitación y Desarrollo Profesional Siglo XXI">
  <p class="mod">Módulo 7 · Material de estudio</p><h1>Automatización con macros y VBA.</h1>
  <p class="sub">Cómo convertir tareas repetitivas de Excel en procesos rápidos, confiables y de un solo clic.</p>
  <p class="by">Por: <b>Jarlin Figueroa, MA</b></p>
  <div class="meta"><span>Excel de escritorio para Windows (2021 o Microsoft 365)</span><span>Incluye ejemplos de código comentados</span></div>`,"cover");

/* 2 · Contenido */
lam(0,`<p class="eyebrow">Contenido.</p><h2>Lo que aprenderá en este módulo.</h2><div class="indice">${[
  ["¿Qué es automatizar?","Beneficios y cuándo conviene"],["Macros y VBA","Definiciones y formas de crearlas"],["Preparar Excel","Programador, archivos .xlsm y seguridad"],["Grabar macros","El grabador y las referencias"],
  ["El editor de VBA","Ventanas, módulos y procedimientos"],["Objetos de Excel","Libros, hojas, rangos, propiedades y métodos"],["El lenguaje","Variables, decisiones y repeticiones"],["Hojas, fórmulas e interacción","MsgBox, InputBox y funciones"],
  ["Botones y depuración","Ejecutar, probar y corregir"],["Buenas prácticas","Integrador y aplicación en una institución"]].map(([a,b],i)=>`<div><b>${String(i+1).padStart(2,"0")}</b><span>${a}<small>${b}</small></span></div>`).join("")}</div>`);

/* 3 · El caso */
est(1,"Caso del módulo","El informe mensual de un analista del sector salud.",
 "En una institución del sector salud, un analista prepara cada mes un informe de reclamaciones. El proceso siempre es el mismo y consume horas de trabajo manual.",
 `<h3>Las tareas que se repiten cada mes</h3>${ol(["<b>Organizar</b> la información que llega de las ARS.","<b>Aplicar formatos</b>: títulos, colores, moneda y bordes.","<b>Actualizar cálculos</b>: cantidad y monto por ARS.","<b>Preparar la hoja de resumen</b> para la dirección."])}
  ${box("El problema","Cuando una tarea se hace a mano muchas veces, aparecen errores: una fila que no se suma, un formato distinto, un dato copiado en la celda equivocada.","imp")}`,
 `<h3>La solución que estudiará</h3><p class="tx">Una <b>macro</b> guarda esos pasos y los ejecuta en segundos, siempre en el mismo orden. Con un <b>botón</b>, cualquier persona del equipo puede generar el informe sin conocer el código.</p>
  ${svg(500,210,`${C(0,0,230,56,"Proceso a mano","",19)}${C(0,64,230,140,["≈ 2 horas","pasos manuales","riesgo de error"],"",19)}${F(236,130,262,130)}${C(270,0,230,56,"Con una macro","i",19)}${C(270,64,230,140,["≈ 1 minuto","un clic","siempre igual"],"a",19)}`,"Comparación entre el proceso a mano y con una macro")}
  <p class="tx" style="font-size:14px;color:var(--muted)">Tiempos ilustrativos: dependen del tamaño del informe.</p>`);

/* 4 · Automatizar */
est(1,"¿Qué es automatizar?","Convertir una tarea repetitiva en un proceso automático.",
 "Automatizar en Excel significa que el programa ejecute por usted una serie de pasos que antes hacía manualmente. Usted define el procedimiento una vez y luego lo reutiliza todas las veces que lo necesite.",
 `<h3>Beneficios</h3>${ul(["<b>Ahorro de tiempo</b>: lo que tomaba horas se hace en segundos.","<b>Menos errores</b>: los pasos no se olvidan ni se alteran.","<b>Estandarización</b>: todos los informes salen con el mismo formato.","<b>Más tiempo para analizar</b> los resultados en vez de prepararlos."])}`,
 `<h3>¿Cuándo conviene automatizar?</h3>${tb(["Conviene","No conviene"],[["Tareas que se repiten (diarias, semanales, mensuales)","Tareas que se hacen una sola vez"],["Pasos claros y siempre iguales","Decisiones que dependen del criterio de una persona"],["Mucho volumen de datos","Procesos que cambian cada vez"]],"n")}
  ${box("Recuerde","Una macro hace exactamente lo que se le indica. Si el procedimiento está mal pensado, repetirá el error muy rápido: primero se diseña, luego se automatiza.")}`);

/* 5 · Macros y VBA */
est(2,"Macros y VBA","Una macro es una secuencia de instrucciones guardada.",
 "",
 `<h3>Definiciones clave</h3>${tb(["Término","Significado"],[["Macro","Conjunto de instrucciones que Excel ejecuta de forma automática."],["VBA","<i>Visual Basic para Aplicaciones</i>: el lenguaje de programación en que se escriben las macros de Office."],["Módulo","Contenedor dentro del libro donde se guarda el código."],["Procedimiento","Cada macro, escrita entre <code>Sub</code> y <code>End Sub</code>."]],"n")}`,
 `<h3>Dos formas de crear una macro</h3>${tb(["Grabada","Escrita en VBA"],[["Excel anota sus clics y teclas","Usted escribe las instrucciones"],["No requiere programar","Requiere conocer el lenguaje"],["Repite siempre lo mismo","Puede decidir (If) y repetir (For)"],["Útil para empezar","Más flexible y fácil de mantener"]],"n")}
  ${box("En la práctica","Lo habitual es <b>grabar</b> una macro para obtener el código básico y luego <b>mejorarlo</b> en el editor de VBA.","ej")}`);

/* 6 · Preparar Excel */
est(2,"Primeros pasos","Preparar Excel: Programador, archivos .xlsm y seguridad.","",
 `<h3>1. Mostrar la pestaña Programador</h3><p class="tx">${ruta("Archivo","Opciones","Personalizar cinta de opciones")} y marque <b>Programador</b>. Allí están <i>Grabar macro</i>, <i>Macros</i>, <i>Visual Basic</i> e <i>Insertar</i>. Se hace una sola vez por computadora.</p>
  <h3>2. Guardar como libro habilitado para macros</h3>${tb(["Extensión","¿Guarda macros?"],[[".xlsx","No: al guardar, Excel elimina el código."],[".xlsm","Sí: libro habilitado para macros."],[".xlsb","Sí: libro binario, útil para archivos grandes."]])}`,
 `<h3>3. Seguridad de las macros</h3><p class="tx">Una macro puede modificar o borrar información, por eso Excel las bloquea hasta que usted lo autoriza.</p>
  <div class="seg"><b>ADVERTENCIA DE SEGURIDAD</b> Las macros se han deshabilitado. <span class="b">Habilitar contenido</span></div>
  <div class="seg rojo"><b>RIESGO DE SEGURIDAD</b> Microsoft ha bloqueado la ejecución de macros porque el origen de este archivo no es de confianza.</div>
  ${ul(["Pulse <b>Habilitar contenido</b> solo si conoce el origen del archivo.","Si el archivo llegó por internet o correo: clic derecho en el archivo › <b>Propiedades</b> › marque <b>Desbloquear</b>.","Configuración: "+ruta("Archivo","Opciones","Centro de confianza","Configuración de macros")+"."])}`);

/* 7 · Grabar */
est(3,"Grabar macros","El grabador convierte sus acciones en código.","",
 `<h3>Pasos para grabar</h3>${ol([ruta("Programador","Grabar macro")+".","Escriba el <b>nombre</b>, elija <b>Guardar macro en: Este libro</b> y pulse Aceptar.","Haga las acciones (seleccionar, dar formato, escribir…).",ruta("Programador","Detener grabación")+".","Para usarla: "+ruta("Programador","Macros")+" › elija la macro › <b>Ejecutar</b>."])}
  ${box("Importante","Mientras graba, todo queda anotado, incluso los errores y los clics de más. Planifique los pasos antes de empezar.","imp")}`,
 `<h3>El cuadro «Grabar macro»</h3>${tb(["Campo","Qué indica"],[["Nombre","Debe empezar con letra, sin espacios. Ej.: <code>FormatoEncabezado</code>."],["Método abreviado","Combinación Ctrl + letra para ejecutarla (opcional)."],["Guardar en","<b>Este libro</b>, <b>Libro nuevo</b> o <b>Libro de macros personal</b> (disponible en todos sus libros)."],["Descripción","Para qué sirve la macro."]],"n")}
  <h3>Referencias absolutas y relativas</h3><p class="tx"><b>Absolutas</b> (por defecto): la macro actúa siempre sobre las mismas celdas, por ejemplo <code>B2</code>. <b>Relativas</b> (${ruta("Programador","Usar referencias relativas")}): actúa en relación con la celda activa.</p>`);

/* 8 · El editor */
est(4,"El editor de VBA","El lugar donde se lee, escribe y corrige el código.",

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children], $=id=>document.getElementById(id);
const INI=SECC.map((_,i)=>S.findIndex(s=>s.t===i));
const dots=$("dots");
dots.innerHTML=SECC.map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));
const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m7sonido")!=="0"; }catch(e){}
function sonar(d){ if(!SND.on||!SND.ready) return; try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+.01; o.frequency.value=d>0?880:587; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.22); }catch(e){} }
const pintarSnd=()=>{ $("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
$("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m7sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();
let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  $("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  $("topL").textContent="MACROS Y VBA · "+SECC[tp].toUpperCase()+".";
  $("prev").disabled=cur===0; $("next").disabled=cur===els.length-1;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){} }
$("prev").onclick=()=>go(cur-1); $("next").onclick=()=>go(cur+1);
$("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ const enB=e.target.closest&&e.target.closest("button,a");
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!enB)){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") $("fs").click(); else if(e.key==="m"||e.key==="M") $("snd").click(); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; },{passive:true});
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); $("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
