<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Módulo 4 · Visualización de datos y dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: escenario fijo 1280×720 escalado a la pantalla (proyector). Mismo motor de los Módulos 2 y 3, solo teoría con ejemplos de ARS; paleta azul oscuro + azul cielo. */
:root{
  --bg:#e4e9f0;        /* fondo fuera del escenario */
  --paper:#f5f7fa;     /* lámina (gris azulado muy claro) */
  --card:#ffffff;
  --ink:#13315c;       /* azul oscuro */
  --muted:#5c6677;
  --line:#e1e6ee;
  --grid:#c9d1dd;
  --xl:#2a78c2;        /* azul cielo (texto) */
  --sky:#2f86d6;       /* azul cielo (gráficos) */
  --plum:#8a3f8f;      /* ciruela (gráficos) */
  --xl-soft:#e8f1fb;
  --green:#2a78c2;
  --green-soft:#e8f1fb;
  --mark:#e6edf7;      /* resaltado */
  --warn:#a3364f;
  --warn-soft:#f8e6eb;
  --ok:#1f7a55;
  --ok-soft:#e3f3ec;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(19,49,92,.16);border-top:3px solid var(--ink);flex:none}
.slide{position:absolute;inset:0;padding:64px 72px 70px;display:none;flex-direction:column;gap:22px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

/* chrome */
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}
.dots button.cur{background:var(--sky)}
.bottom{position:absolute;bottom:18px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* type */
.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--xl);display:flex;gap:14px;align-items:center}
.eyebrow .n{font-family:var(--serif);font-size:30px;letter-spacing:0;text-transform:none}
.eyebrow .tag{border:1px solid var(--xl);padding:2px 8px;font-size:12px}
h1{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.02;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.08;margin:0;text-wrap:balance}
h3{font-size:20px;margin:0;font-weight:600}
p{margin:0}
.lead{font-size:24px;line-height:1.45;max-width:30em;color:var(--ink)}
.muted{color:var(--muted)}
code,.code{font-family:var(--mono)}

/* cover */
.cover{justify-content:center;gap:28px}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--xl)}
.cover h1{font-size:92px;max-width:12em}
.cover .by{font-size:24px;color:var(--muted)}
.cover .by b{color:var(--ink);font-weight:600}
.cover .kpis{display:flex;gap:12px}
.cover .kpis div{background:var(--card);border:1px solid var(--grid);border-top:3px solid var(--sky);padding:10px 18px;min-width:150px}
.cover .kpis small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cover .kpis b{font-family:var(--serif);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.cover .hint{font-family:var(--mono);font-size:14px;color:var(--muted)}

/* index */
.idx{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.idx button{all:unset;cursor:pointer;padding:16px 22px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.idx button:nth-child(4n){border-right:0}
.idx button:hover{background:var(--card)}
.idx .n{font-family:var(--serif);font-size:40px;color:var(--xl);line-height:1}
.idx .k{font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500}
.idx .d{font-size:16px;color:var(--ink)}
.idx button.res{background:var(--ink);color:#fff}
.idx button.res .n,.idx button.res .k,.idx button.res .d{color:#fff}
.note{font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center}
.note b{color:var(--ink)}

/* concept */
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;flex:1;min-height:0}
.analogy{border-left:3px solid var(--sky);padding:6px 0 6px 18px;font-family:var(--serif);font-size:22px;font-style:italic;line-height:1.4;color:var(--ink)}
.args{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);margin:0;padding:0}
.args li{list-style:none;display:grid;grid-template-columns:200px 1fr;gap:16px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;line-height:1.4}
.args li code{font-size:15px;color:var(--ink);font-weight:500}
.args li.on{background:var(--mark)}

/* uses */
.uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.use{min-width:0;background:var(--card);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.use h3{font-size:19px}
.use p{font-size:16.5px;line-height:1.45;color:var(--muted)}
.use code{font-size:14px;color:var(--xl);background:var(--xl-soft);padding:3px 6px;display:inline-block;margin-top:2px;white-space:normal;word-break:break-word;max-width:100%}
.pit{display:flex;gap:16px;align-items:flex-start;background:var(--warn-soft);padding:14px 18px;font-size:17px;line-height:1.45}
.pit b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);padding-top:3px;white-space:nowrap}

/* practice */
.prac{display:grid;grid-template-columns:430px 1fr;gap:36px;flex:1;min-height:0}
.steps{margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:16px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:22px;color:var(--xl);line-height:1}
.steps code{font-size:13.5px;background:var(--card);border:1px solid var(--line);padding:1px 5px}
.fbar{display:flex;border:1px solid var(--grid);background:var(--card);font-family:var(--mono);font-size:13.5px;align-items:stretch}
.fbar .lbl{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--xl);padding:9px 10px;border-right:1px solid var(--grid);display:flex;align-items:center}
.fbar .f{padding:9px 12px;flex:1;min-width:0;word-break:break-word;line-height:1.45}
.sim{background:var(--card);border:1px solid var(--grid);display:flex;flex-direction:column;min-height:0;min-width:0}
.sim-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
.sim-h .live{color:var(--xl)}
.sim-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.ctrls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
select{font-family:var(--sans);font-size:15px;padding:6px 9px;border:1px solid var(--grid);background:var(--card);color:var(--ink);min-width:150px}
.dlbtn{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--ink);color:#fff;padding:12px 16px;border:1px solid var(--ink)}
.dlbtn:hover{background:#0d2445}
.dlbtn .ic{font-size:22px;line-height:1}
.dlbtn b{display:block;font-size:16px;font-weight:600}
.dlbtn small{display:block;font-family:var(--mono);font-size:11.5px;opacity:.9;margin-top:2px}

/* botones tipo píldora (preguntas, tipos de gráfico) */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{all:unset;cursor:pointer;font-size:14px;padding:6px 12px;border:1px solid var(--grid);background:var(--paper);color:var(--ink)}
.pills button:hover{border-color:var(--ink)}
.pills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qbtns{display:flex;flex-direction:column;gap:6px}
.qbtns button{all:unset;cursor:pointer;font-size:14.5px;padding:7px 12px;border:1px solid var(--line);background:var(--paper);line-height:1.35}
.qbtns button.on{border-color:var(--sky);background:var(--xl-soft);font-weight:600}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 14px;font-size:15px;line-height:1.4;border-left:4px solid var(--grid);background:var(--paper)}
.verdict b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;white-space:nowrap}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)} .verdict.ok b{color:var(--ok)}
.verdict.mid{border-color:#b7791f;background:#fbf3e4} .verdict.mid b{color:#8a5a12}
.verdict.no{border-color:var(--warn);background:var(--warn-soft)} .verdict.no b{color:var(--warn)}

/* gráficos */
.chart{border:1px solid var(--grid);background:var(--card);padding:8px 10px 6px;display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0}
.chart .ct{font-size:14px;font-weight:600;line-height:1.3}
.chart .cs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
svg text{font-family:var(--sans)}

/* tarjetas de indicadores */
.kcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kcard{background:var(--card);border:1px solid var(--grid);border-top:4px solid var(--sky);padding:10px 14px;position:relative;min-width:0}
.kcard small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kcard b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.kcard em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.sim .kcard b{font-size:25px}
.kcard.bad{border-top-color:var(--warn)}
.flag{font-family:var(--mono);font-size:11px;color:var(--warn);font-weight:600}

/* segmentaciones */
.slicer{border:1px solid var(--grid);background:var(--card)}
.slicer .sh{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--grid)}
.slicer .sh button{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--xl)}
.slicer .sb{display:flex;flex-wrap:wrap;gap:5px;padding:7px}
.slicer .sb button{all:unset;cursor:pointer;font-size:13px;padding:4px 9px;border:1px solid var(--grid);background:var(--card);color:var(--muted)}
.slicer .sb button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.slicer.col .sb{flex-direction:column}
.conn{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;border:1px dashed var(--grid);padding:7px 10px;align-items:center}
.conn label{display:flex;gap:6px;align-items:center;cursor:pointer;font-family:var(--mono);font-size:13px}

/* tabla dinámica estilo Excel */
.pv{overflow:auto;border:1px solid var(--grid);min-height:0}
.pv table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
.pv th,.pv td{padding:3px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.pv thead th{background:var(--xl-soft);color:var(--ink);font-weight:600;text-align:right;border-bottom:1px solid var(--sky)}
.pv thead th:first-child{text-align:left}
.pv td{text-align:right}
.pv td:first-child{text-align:left}
.pv tr.tot td{font-weight:700;border-top:1px solid var(--sky);border-bottom:0;background:var(--xl-soft)}

/* antes y después */
.ad{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0}
.ad>div{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.ad .lab{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.ad .lab.no{color:var(--warn)} .ad .lab.ok{color:var(--ok)}
.ugly{background:#fffbe0;border:3px double #e0421b;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:hidden;font-family:"Comic Sans MS","Segoe UI",sans-serif}
.ugly table{border-collapse:collapse;font-size:11px;width:100%}
.ugly td,.ugly th{border:1px solid #888;padding:2px 4px;text-align:center}
.why{display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.35}
.why span::before{content:"✗ ";color:var(--warn);font-weight:700}
.why.ok span::before{content:"✓ ";color:var(--ok)}

/* ejemplo resuelto */
.brief{display:grid;grid-template-columns:1fr 1.05fr;gap:36px;flex:1;min-height:0}
.qlist{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink)}
.qlist div{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.35;align-items:baseline}
.qlist .n{font-family:var(--serif);font-size:22px;color:var(--xl)}
.qlist code{font-size:12.5px;background:var(--xl-soft);color:var(--xl);padding:2px 6px;white-space:nowrap}
.plano{display:grid;grid-template-columns:repeat(3,1fr) 104px 84px;grid-template-rows:38px 70px 1fr 1fr 46px;gap:6px;background:var(--card);border:1px solid var(--grid);padding:10px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:0}
.plano div{border:1.5px dashed var(--grid);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.3}
.plano .t{grid-column:1/6;background:var(--ink);color:#fff;border:0;font-weight:600}
.plano .k{background:var(--mark);color:var(--ink);font-weight:600}
.plano .g{background:var(--xl-soft);color:var(--xl);font-weight:600}
.plano .s{grid-column:4;grid-row:2/5;background:var(--mark)}
.plano .c{grid-column:1/5}
.plano .m{grid-column:5;grid-row:2/6;background:repeating-linear-gradient(135deg,#fff 0 6px,var(--line) 6px 7px);font-size:11px}
.ptab{border-collapse:collapse;width:100%;font-size:15px}
.ptab th{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:2px solid var(--ink)}
.ptab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.ptab td:first-child{font-family:var(--mono);font-weight:600;white-space:nowrap}
.ptab code{font-size:13px}
.ptab .n{font-family:var(--serif);font-size:20px;color:var(--xl);width:30px}
.dash{display:grid;grid-template-columns:1fr 176px;gap:12px;flex:1;min-height:0}
.dash-main{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.dash-charts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;flex:1;min-height:0}
.dash-side{display:flex;flex-direction:column;gap:10px}
.dtitle{background:var(--ink);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:baseline}
.dtitle b{font-family:var(--serif);font-size:22px;font-weight:600}
.dtitle span{font-family:var(--mono);font-size:12px;opacity:.85}
.concl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;min-height:0}
.cc{background:var(--card);border:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.cc h3{font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:baseline}
.cc h3 i{font-style:normal;font-family:var(--serif);font-size:22px;color:var(--xl)}
.cc p{font-size:14px;line-height:1.38;color:var(--ink)}
.cc .dec{font-size:13.5px;color:var(--ok);background:var(--ok-soft);padding:6px 9px;line-height:1.35}
.cc .dec b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.cc.hid p,.cc.hid .dec{filter:blur(6px);user-select:none}
.cc.wide{grid-column:auto}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:2px solid var(--ink)}
.sum>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.sum .n{font-family:var(--serif);font-size:26px;color:var(--xl)}
.sum code{font-size:14px;display:block;color:var(--ink);margin-top:3px;font-weight:500}
.sum p{font-size:16px;color:var(--muted)}
.sum>div>div{min-width:0}
/* conceptos + ejemplo ARS */
.cols2{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;flex:1;min-height:0}
.exl{font-size:15px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:12px}
.exl b{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--xl);margin-bottom:3px}
.ex{background:var(--card);border:1px solid var(--grid);display:flex;flex-direction:column;min-height:0;min-width:0}
.ex-h{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
.ex-h span:first-child{color:var(--xl);font-weight:600}
.ex-b{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.ex-c{padding:0 14px 14px;font-size:15px;line-height:1.45;color:var(--ink)}
.map{border-collapse:collapse;width:100%;font-size:15.5px}
.map td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.map td:first-child{width:52%;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:center}
.duo .pv table{font-size:12.5px}
.arrow{font-size:24px;color:var(--xl);text-align:center}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo2>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.sbtn{font-size:13px;padding:4px 9px;border:1px solid var(--grid);background:var(--card);color:var(--muted)}
.sbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.anat{display:flex;flex-direction:column;gap:8px}
.anat div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px;background:var(--paper);border-left:4px solid var(--sky);font-size:16px;line-height:1.4}
.anat b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--xl);padding-top:2px}
.anat .bad{border-left-color:var(--warn);background:var(--warn-soft)}

function group(rows,k){ const o={}; rows.forEach(r=>{ const g=o[r[k]]||(o[r[k]]={k:r[k],n:0,s:0}); g.n++; g.s+=r.monto; }); return Object.values(o); }
const tot = rows => ({n:rows.length, s:rows.reduce((a,r)=>a+r.monto,0)});

/* ---------- Gráficos (SVG). Colores validados: 2024 = naranja, 2025 = azul cielo ---------- */
const C24="#c7741f", C25="#2f86d6", C1="#2a9d8f", CAT=["#2f86d6","#c7741f","#2a9d8f","#8a3f8f","#7f8a1f"];
const INK="#13315c", MUT="#5c6677", GRD="#e1e6ee";
function ticks(mx){ if(mx<=0) return {step:1,n:1,top:1}; const mag=Math.pow(10,Math.floor(Math.log10(mx))); const step=Math.max(1,[1,2,4,10].map(f=>f*mag/2).find(s=>mx/s<=5)||mag); const n=Math.ceil(mx/step); return {step,n,top:n*step}; }
function bar(x,y,w,h,r){ if(h<=0.5) return ""; r=Math.min(r,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
const kfmt = v => v>=1e6? (v/1e6).toFixed(v%1e6?1:0)+" M" : v>=1000? num0(v/1000)+"k" : num0(v);
/* Columnas: series=[{name,color,vals}] */
function colSVG(cats,series,o={}){
  const W=o.W||600,H=o.H||260,pl=o.pl||48,pb=o.pb||(o.twoLine?36:24),pt=18,pr=8;
  let mx=0; series.forEach(s=>s.vals.forEach(v=>mx=Math.max(mx,v)));
  const t=ticks(mx), y=v=>pt+(H-pt-pb)*(1-v/t.top), n=cats.length, gw=(W-pl-pr)/n, ns=series.length;
  const bw=Math.min(o.bmax||46,(gw*0.7-(ns-1)*2)/ns);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Gráfico de columnas")}">`;
  for(let k=0;k<=t.n;k++){ const v=t.step*k; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${k?GRD:"#c9d1dd"}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${MUT}">${(o.fmtAxis||kfmt)(v)}</text>`; }
  let best=null; series.forEach((se,j)=>se.vals.forEach((v,i)=>{ if(!best||v>best.v) best={v,i,j}; }));
  cats.forEach((c,i)=>{ const x0=pl+i*gw+gw/2-(ns*bw+(ns-1)*2)/2;
    series.forEach((se,j)=>{ const v=se.vals[i], x=x0+j*(bw+2);
      s+=`<path d="${bar(x,y(v),bw,y(0)-y(v),4)}" fill="${se.color}"><title>${esc(c)}${ns>1?" · "+esc(se.name):""}: ${(o.fmt||num0)(v)}</title></path>`;
      if(o.labelAll || (best&&best.i===i&&best.j===j)) s+=`<text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${INK}">${(o.fmtLabel||o.fmt||num0)(v)}</text>`; });
    const lab=o.short?sh(c):String(c);
    if(o.twoLine && lab.includes(" ")){ const p=lab.split(" "); s+=`<text x="${pl+i*gw+gw/2}" y="${H-20}" text-anchor="middle" font-size="11" fill="${INK}">${esc(p[0])}</text><text x="${pl+i*gw+gw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="${INK}">${esc(p.slice(1).join(" "))}</text>`; }
    else s+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${INK}">${esc(lab)}</text>`; });
  return s+"</svg>";
}
/* Líneas: cats en el eje X, series=[{name,color,vals}] */
function lineSVG(cats,series,o={}){
  const W=o.W||600,H=o.H||260,pl=o.pl||40,pb=24,pt=16,pr=o.pr||44;
  let mx=0; series.forEach(s=>s.vals.forEach(v=>mx=Math.max(mx,v)));
  const t=ticks(mx), y=v=>pt+(H-pt-pb)*(1-v/t.top), n=cats.length, x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Gráfico de líneas")}">`;
  for(let k=0;k<=t.n;k++){ const v=t.step*k; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${k?GRD:"#c9d1dd"}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${MUT}">${(o.fmtAxis||kfmt)(v)}</text>`; }
  cats.forEach((c,i)=>{ if(n<=12||i%2===0) s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="${INK}">${esc(o.short?sh(c):c)}</text>`; });
  series.forEach(se=>{
    s+=`<polyline points="${se.vals.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    se.vals.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${se.color}" stroke="#fff" stroke-width="2"><title>${esc(cats[i])}${se.name?" · "+esc(se.name):""}: ${(o.fmt||num0)(v)}</title></circle>`; });
    const L=se.vals.length-1; s+=`<text x="${x(L)+8}" y="${y(se.vals[L])+4}" font-size="11.5" font-weight="600" fill="${INK}">${esc(se.name||"")} ${(o.fmt||num0)(se.vals[L])}</text>`;
  });
  return s+"</svg>";
}
/* Circular: una sola serie */
function pieSVG(cats,vals,o={}){
  const W=o.W||600,H=o.H||260, cx=H/2+10, cy=H/2, R=H/2-12, total=vals.reduce((a,b)=>a+b,0);
  let a0=-Math.PI/2, s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico circular">`;
  const colors=o.colors||cats.map((_,i)=>CAT[i%CAT.length]);
  vals.forEach((v,i)=>{ const a1=a0+v/total*2*Math.PI, big=a1-a0>Math.PI?1:0;
    const p= vals.length===1||v===total ? `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${colors[i]}"` :
      `<path d="M${cx},${cy}L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)}A${R},${R} 0 ${big} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)}Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"`;
    s+=`${p}><title>${esc(cats[i])}: ${(o.fmt||num0)(v)} (${pct(v/total)})</title>${p.startsWith("<circle")?"</circle>":"</path>"}`; a0=a1; });
  const ly0=Math.max(14,cy-cats.length*11), lh=Math.min(22,(H-20)/cats.length);
  cats.forEach((c,i)=>{ const ly=ly0+i*lh; s+=`<rect x="${cx+R+24}" y="${ly-9}" width="11" height="11" rx="2" fill="${colors[i]}"/><text x="${cx+R+41}" y="${ly}" font-size="${cats.length>8?10.5:12}" fill="${INK}">${esc(c)} · ${pct(vals[i]/total)}</text>`; });
  return s+"</svg>";
}
const chartBox = (title,sub,svg,legend) => `<div class="chart"><div class="ct">${esc(title)}</div>${sub?`<div class="cs">${esc(sub)}</div>`:""}${svg}${legend?`<div class="legend">${legend}</div>`:""}</div>`;

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides");
wrap.innerHTML=S.map(s=>s.html).join("");
const els=[...wrap.children];
els.forEach((el,i)=>S[i].init&&S[i].init(el));
wrap.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
const dots=document.getElementById("dots");
dots.innerHTML=TOPICS.map(t=>t.k).concat(["Tablero de ARS"]).map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INICIO[b.dataset.t]));
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(els.length-1,i));
  els.forEach((e,j)=>e.classList.toggle("on",j===cur));
  const tp=S[cur].topic;
  dots.querySelectorAll("button").forEach((b,j)=>{b.classList.toggle("cur",j===tp);b.classList.toggle("done",tp>j||(tp<0&&cur>2));});
  document.getElementById("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  document.getElementById("topL").textContent = tp<0?"MÓDULO 4 · VISUALIZACIÓN DE DATOS Y DASHBOARDS": tp===T_EJ?"MÓDULO 4 · EJEMPLO INTEGRADOR · TABLERO DE ARS":`MÓDULO 4 · CONCEPTO 0${tp+1} DE 0${TOPICS.length} · ${TOPICS[tp].k.toUpperCase()}`;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===els.length-1;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("fs").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select") return;
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&tag!=="button")){e.preventDefault();go(cur+1);}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1);
  else if(e.key==="f"||e.key==="F") document.getElementById("fs").click();
});
function fit(){ const st=document.getElementById("stage"); const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); st.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1);
</script>

<script>
(function(){
  var btn = document.getElementById('btnPresentar'), d = document, raiz = d.documentElement;
  if(!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) return;   // iPhone y navegadores sin pantalla completa: no se muestra
  var AMPLIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var REDUCIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  btn.hidden = false;
  function activo(){ return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  function pintar(){
    var full = activo(), tip = full ? 'Salir de pantalla completa' : 'Pantalla completa';
    btn.innerHTML = full ? REDUCIR : AMPLIAR;
    btn.setAttribute('aria-label', tip);
    btn.setAttribute('data-tip', tip);
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(activo()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);

    btn.blur();                            // para que las flechas sigan moviendo las láminas
  });
  d.addEventListener('fullscreenchange', pintar);
  d.addEventListener('webkitfullscreenchange', pintar);
  pintar();
})();
