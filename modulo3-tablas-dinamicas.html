<style>
/* Layout: escenario fijo 1280×720 escalado a la pantalla (proyector). Mismo motor del Módulo 2; paleta verde bosque + coral. */
:root{
  --bg:#ebe7de;        /* fondo fuera del escenario */
  --paper:#f7f4ee;     /* lámina (crema) */
  --card:#ffffff;
  --ink:#1f3d33;       /* verde bosque */
  --muted:#5f6b64;
  --line:#e2ddd2;
  --grid:#cdc6b8;
  --xl:#c9573f;        /* coral */
  --xl-soft:#f9e8e2;
  --green:#2f6b52;
  --green-soft:#e4efe8;
  --mark:#e4efe8;      /* resaltado */
  --mark-line:#2f6b52;
  --warn:#9a3b2b;
  --warn-soft:#f6e4de;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(31,61,51,.16);border-top:3px solid var(--ink);flex:none}
.slide{position:absolute;inset:0;padding:64px 72px 70px;display:none;flex-direction:column;gap:22px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

/* chrome */
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}
.dots button.cur{background:var(--xl)}
.bottom{position:absolute;bottom:18px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--xl);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* type */
.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--xl);display:flex;gap:14px;align-items:center}
.eyebrow .n{font-family:var(--serif);font-size:30px;letter-spacing:0;text-transform:none}
.eyebrow .tag{border:1px solid var(--xl);padding:2px 8px;font-size:12px}
h1{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.02;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.08;margin:0;text-wrap:balance}
h3{font-size:20px;margin:0;font-weight:600}
p{margin:0}
.lead{font-size:24px;line-height:1.45;max-width:30em;color:var(--ink)}
.muted{color:var(--muted)}
code,.code{font-family:var(--mono)}

/* cover */
.cover{justify-content:center;gap:28px}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--xl)}
.cover h1{font-size:96px;max-width:11em}
.cover .by{font-size:24px;color:var(--muted)}
.cover .by b{color:var(--ink);font-weight:600}
.cover .fx{font-family:var(--mono);font-size:20px;display:flex;align-items:stretch;border:1px solid var(--grid);background:var(--card);width:max-content;max-width:100%}
.cover .fx span{padding:10px 14px}
.cover .fx .lbl{border-right:1px solid var(--grid);color:var(--muted);font-style:italic;font-family:var(--serif)}
.cover .fx .caret{border-left:2px solid var(--xl);animation:blink 1s steps(1) infinite;padding:0;margin:8px 0}
@keyframes blink{50%{opacity:0}}
.cover .hint{font-family:var(--mono);font-size:14px;color:var(--muted)}

/* index */
.idx{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.idx button{all:unset;cursor:pointer;padding:22px 22px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.idx button:nth-child(4n){border-right:0}
.idx button:hover{background:var(--card)}
.idx .n{font-family:var(--serif);font-size:40px;color:var(--xl);line-height:1}
.idx .k{font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500}
.idx .d{font-size:16px;color:var(--ink)}
.note{font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center}
.note b{color:var(--ink)}

/* concept */
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;flex:1;min-height:0}
.analogy{border-left:3px solid var(--xl);padding:6px 0 6px 18px;font-family:var(--serif);font-size:22px;font-style:italic;line-height:1.4;color:var(--ink)}
.args{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);margin:0;padding:0}
.args li{list-style:none;display:grid;grid-template-columns:200px 1fr;gap:16px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;line-height:1.4}
.args li code{font-size:15px;color:var(--ink);font-weight:500}
.args li.on{background:var(--mark)}

/* uses */
.uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.use{min-width:0;background:var(--card);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.use h3{font-size:19px}
.use p{font-size:16.5px;line-height:1.45;color:var(--muted)}
.use code{font-size:14px;color:var(--green);background:var(--green-soft);padding:3px 6px;display:inline-block;margin-top:2px;white-space:normal;word-break:break-word;max-width:100%}
.pit{display:flex;gap:16px;align-items:flex-start;background:var(--warn-soft);padding:14px 18px;font-size:17px;line-height:1.45}
.pit b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);padding-top:3px;white-space:nowrap}

/* practice */
.prac{display:grid;grid-template-columns:430px 1fr;gap:36px;flex:1;min-height:0}
.steps{margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:16.5px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:22px;color:var(--xl);line-height:1}
.steps code{font-size:14px;background:var(--card);border:1px solid var(--line);padding:1px 5px}
.fbar{display:flex;border:1px solid var(--grid);background:var(--card);font-family:var(--mono);font-size:14px;align-items:stretch}
.fbar .lbl{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--xl);padding:9px 10px;border-right:1px solid var(--grid);display:flex;align-items:center}
.fbar .f{padding:9px 12px;flex:1;min-width:0;word-break:break-word;line-height:1.45}
.sim{background:var(--card);border:1px solid var(--grid);display:flex;flex-direction:column;min-height:0;min-width:0}
.sim-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
.sim-h .live{color:var(--xl)}
.sim-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.ctrls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
select{font-family:var(--sans);font-size:15px;padding:6px 9px;border:1px solid var(--grid);background:var(--card);color:var(--ink);min-width:150px}
.res{display:flex;align-items:center;gap:16px;border:2px solid var(--xl);padding:10px 16px;position:relative;cursor:pointer}
.res .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--xl)}
.res .val{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.res.hide .val{filter:blur(12px);user-select:none}
.res .rev{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.res.hide .rev{color:var(--xl);font-weight:600}
.dlbtn{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--ink);color:#fff;padding:12px 16px;border:1px solid var(--ink)}
.dlbtn:hover{background:#163027}
.dlbtn .ic{font-size:22px;line-height:1}
.dlbtn b{display:block;font-size:16px;font-weight:600}
.dlbtn small{display:block;font-family:var(--mono);font-size:11.5px;opacity:.9;margin-top:2px}

/* lista de campos (simulador 1) */
.flist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.flist label{display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid var(--line);padding:6px 8px;cursor:pointer;background:var(--paper)}
.flist label.on{border-color:var(--green);background:var(--green-soft)}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:13px}
.areas div{border:1px dashed var(--grid);padding:6px 8px;min-height:44px}
.areas small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.areas span{display:inline-block;background:var(--green-soft);color:var(--green);padding:1px 6px;margin:1px 2px 1px 0;font-size:12.5px}

/* tabla dinámica estilo Excel */
.pv{overflow:auto;border:1px solid var(--grid);min-height:0;flex:1}
.pv table{border-collapse:collapse;font-size:13.5px;width:100%;font-variant-numeric:tabular-nums}
.pv th,.pv td{padding:3px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.pv thead th{background:var(--green-soft);color:var(--ink);font-weight:600;text-align:right;border-bottom:1px solid var(--green);position:sticky;top:0}
.pv thead th:first-child{text-align:left}
.pv td{text-align:right}
.pv td:first-child{text-align:left}
.pv tr.tot td{font-weight:700;border-top:1px solid var(--green);border-bottom:0;background:var(--green-soft)}
.pv td.tc,.pv th.tc{font-weight:700}
.pv tr.first td{background:#fbefe9}
.pv .empty{padding:16px;color:var(--muted);font-size:14px}

/* segmentación */
.slicers{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.slicer{border:1px solid var(--grid);background:var(--paper)}
.slicer .sh{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--grid)}
.slicer .sh button{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--xl)}
.slicer .sb{display:flex;flex-wrap:wrap;gap:5px;padding:7px}
.slicer .sb button{all:unset;cursor:pointer;font-size:13px;padding:4px 9px;border:1px solid var(--grid);background:var(--card);color:var(--muted)}
.slicer .sb button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* gráfico */
.chart{border:1px solid var(--grid);background:var(--card);padding:8px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:2px 6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.concl{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0;flex:1}
.concl div{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;line-height:1.35;padding:6px 8px;border:1px solid var(--line);cursor:pointer}
.concl div b{font-family:var(--serif);color:var(--xl)}
.concl div.hid span{filter:blur(6px);user-select:none}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:2px solid var(--ink)}
.sum>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.sum .n{font-family:var(--serif);font-size:26px;color:var(--xl)}
.sum code{font-size:14px;display:block;color:var(--ink);margin-top:3px;font-weight:500}
.sum p{font-size:16px;color:var(--muted)}
.sum>div>div{min-width:0}

/* acceso con clave (temporal) */
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
#gate form{background:var(--paper);border-top:3px solid var(--ink);box-shadow:0 10px 40px rgba(31,61,51,.16);padding:34px 36px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
#gate .mod{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--xl)}
#gate h1{font-size:34px}
#gate p{color:var(--muted);font-size:15px;line-height:1.45}
#gate input{font-family:var(--mono);font-size:20px;padding:10px 12px;border:1px solid var(--grid);background:var(--card);color:var(--ink);letter-spacing:.3em}
#gate .err{color:var(--warn);font-size:14px;min-height:1.2em}
#gate button{font-family:var(--mono);font-size:14px;padding:11px;border:0;background:var(--ink);color:#fff;cursor:pointer}
</style>

<div id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <div class="mod">Módulo 3</div>
    <h1>Tablas dinámicas avanzadas</h1>
    <p>Este contenido está protegido. Escribe la clave de acceso para continuar.</p>
    <input id="gateIn" type="password" inputmode="numeric" maxlength="12" aria-label="Clave de acceso" placeholder="Clave">
    <div class="err" id="gateErr" role="alert"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="viewport"><div id="stage">
  <div class="top"><span id="topL">MÓDULO 3 · TABLAS DINÁMICAS AVANZADAS</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev" aria-label="Anterior">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next" aria-label="Siguiente">Siguiente →</button>
    </div>
  </div>
</div></div>

<script>
/* ---------- Acceso con clave (temporal; se quitará cuando el facilitador lo indique) ---------- */
const CLAVE = "1827", KEY = "m3-acceso";
const gate = document.getElementById("gate");
function accesoValido(){ try{ const t=+localStorage.getItem(KEY); return t && Date.now()-t < 12*3600e3; }catch(e){ return false; } }
let locked = !accesoValido();
if(locked){ gate.hidden=false; setTimeout(()=>document.getElementById("gateIn").focus(),50); }
document.getElementById("gateForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=document.getElementById("gateIn").value.trim();
  if(v===CLAVE){ try{ localStorage.setItem(KEY,String(Date.now())); }catch(err){} locked=false; gate.hidden=true; }
  else { document.getElementById("gateErr").textContent="Clave incorrecta. Inténtalo de nuevo."; document.getElementById("gateIn").select(); }
});

/* Motor de tabla dinámica: agrupa por fila (y columna opcional) y calcula */
function pivot(rows, rk, ck, agg){
  const acc = {}, keyR = new Set(), keyC = new Set();
  const add = (a,r)=>{ a.n++; a.s+=r.monto; a.m=Math.max(a.m,r.monto); };
  const cell = (r,c)=>{ const k=r+"\u0001"+c; return acc[k]||(acc[k]={n:0,s:0,m:0}); };
  rows.forEach(x=>{ const r=x[rk], c=ck?x[ck]:"·"; keyR.add(r); keyC.add(c);
    add(cell(r,c),x); add(cell(r,"\u0002"),x); add(cell("\u0002",c),x); add(cell("\u0002","\u0002"),x); });
  const val = a => !a||!a.n ? null : agg==="count"?a.n : agg==="sum"?a.s : agg==="avg"?a.s/a.n : a.m;
  const sortK = (k,set)=>[...set].sort((a,b)=> (k==="mes"||k==="anio")? a-b : String(a).localeCompare(String(b),"es"));
  return { rk, ck, agg, rows:sortK(rk,keyR), cols:ck?sortK(ck,keyC):["·"],
    v:(r,c)=>val(acc[r+"\u0001"+c]), rt:r=>val(acc[r+"\u0001\u0002"]), ct:c=>val(acc["\u0002\u0001"+c]), g:()=>val(acc["\u0002\u0001\u0002"]) };
}
/* Dibuja la tabla dinámica como en Excel (Etiquetas de fila · … · Total general) */
function pivotHtml(p, o={}){
  if(!p.rows.length) return `<div class="empty">No hay datos con los filtros elegidos.</div>`;
  const fmt = v => v===null?"":o.pct? pct(v/p.g()) : p.agg==="count"? num0(v) : num2(v);
  let rows = p.rows.slice();
  if(o.order==="desc") rows.sort((a,b)=>p.rt(b)-p.rt(a)); else if(o.order==="asc") rows.sort((a,b)=>p.rt(a)-p.rt(b));
  if(o.top) rows = rows.slice(0,o.top);
  const multi = !!p.ck;
  const head = `<tr><th>Etiquetas de fila</th>${multi?p.cols.map(c=>`<th>${esc(lab(p.ck,c))}</th>`).join("")+`<th class="tc">Total general</th>`:`<th>${esc(o.vlabel||"")}</th>`}</tr>`;
  const body = rows.map((r,i)=>`<tr class="${o.mark&&i===0?"first":""}"><td>${esc(lab(p.rk,r))}</td>${multi?p.cols.map(c=>`<td>${fmt(p.v(r,c))}</td>`).join("")+`<td class="tc">${fmt(p.rt(r))}</td>`:`<td>${fmt(p.rt(r))}</td>`}</tr>`).join("");
  const tot = `<tr class="tot"><td>Total general</td>${multi?p.cols.map(c=>`<td>${fmt(p.ct(c))}</td>`).join("")+`<td>${fmt(p.g())}</td>`:`<td>${fmt(o.top?rows.reduce((s,r)=>s+(p.agg==="count"||p.agg==="sum"?p.rt(r):0),0)||p.g():p.g())}</td>`}</tr>`;
  return `<table><thead>${head}</thead><tbody>${body}${tot}</tbody></table>`;
}
const top1 = (p,dir="desc") => p.rows.slice().sort((a,b)=>dir==="desc"?p.rt(b)-p.rt(a):p.rt(a)-p.rt(b))[0];

    <div class="flist">${CAMPOS.map(c=>`<label data-c="${c[1]}"><input type="checkbox" value="${c[1]}"${c[1]==="ars"?" checked":""}>${c[0]}</label>`).join("")}</div>
    <div class="areas"><div><small>Filtros</small></div><div><small>Columnas</small></div><div data-ar><small>Filas</small></div><div data-av><small>Valores</small></div></div>
    <div class="pv" data-p></div></div>`;
  const run=()=>{
    const on=[...box.querySelectorAll("input:checked")].map(x=>x.value);
    box.querySelectorAll(".flist label").forEach(l=>l.classList.toggle("on",on.includes(l.dataset.c)));
    const rowF=["ars","tipo","prov","pss"].find(k=>on.includes(k)) || (on.includes("fecha")?"anio":null);
    const vals=[]; if(on.includes("id")) vals.push(["count","Cuenta de ID Servicio"]); if(on.includes("monto")) vals.push(["sum","Suma de Monto"]);
    const nombre={ars:"ARS",tipo:"Tipo de Servicio",prov:"Provincia",pss:"PSS",anio:"Fecha (Años)"};
    box.querySelector("[data-ar]").innerHTML=`<small>Filas</small>${rowF?`<span>${nombre[rowF]}</span>`:""}`;
    box.querySelector("[data-av]").innerHTML=`<small>Valores</small>${vals.map(v=>`<span>${v[1]}</span>`).join("")}`;
    const pv=box.querySelector("[data-p]");
    if(!rowF && !vals.length){ pv.innerHTML=`<div class="empty">Marca al menos un campo para construir el informe.</div>`; return; }
    if(!rowF){ pv.innerHTML=`<table><thead><tr>${vals.map(v=>`<th>${v[1]}</th>`).join("")}</tr></thead><tbody><tr class="tot">${vals.map(v=>{const p=pivot(rec,"anio",null,v[0]);return `<td>${fmtAgg(v[0],p.g())}</td>`;}).join("")}</tr></tbody></table>`; return; }
    const ps=vals.map(v=>pivot(rec,rowF,null,v[0])), base=pivot(rec,rowF,null,"count");
    pv.innerHTML=`<table><thead><tr><th>Etiquetas de fila</th>${vals.map(v=>`<th>${v[1]}</th>`).join("")}</tr></thead><tbody>${base.rows.map(r=>`<tr><td>${esc(r)}</td>${ps.map((p,j)=>`<td>${fmtAgg(vals[j][0],p.rt(r))}</td>`).join("")}</tr>`).join("")}<tr class="tot"><td>Total general</td>${ps.map((p,j)=>`<td>${fmtAgg(vals[j][0],p.g())}</td>`).join("")}</tr></tbody></table>`;
  };
  box.querySelectorAll("input").forEach(x=>x.onchange=run); run();
},
areas(box){
  const NONE="(ninguno)", PROVS=[...new Set(rec.map(r=>r.prov))].sort((a,b)=>a.localeCompare(b,"es"));
  box.innerHTML = head("Simulador · las 4 áreas")+`<div class="sim-b">
    <div class="ctrls">
      <label class="ctrl">Filtros · Provincia<select data-f>${opts(["(Todas)"].concat(PROVS),"(Todas)")}</select></label>
      <label class="ctrl">Filas<select data-r>${opts(["ARS","PSS","Tipo de Servicio","Provincia"],"ARS")}</select></label>
      <label class="ctrl">Columnas<select data-c>${opts([NONE,"Años","Tipo de Servicio"],NONE)}</select></label>
      <label class="ctrl">Valores<select data-v>${opts(["Cuenta de ID Servicio","Suma de Monto"],"Cuenta de ID Servicio")}</select></label>
    </div>${resBox("Primer lugar en Filas")}<div class="pv" data-p></div></div>`;
  const out=wireRes(box), q=s=>box.querySelector(s);
  const run=()=>{
    const rows=q("[data-f]").value==="(Todas)"?rec:rec.filter(r=>r.prov===q("[data-f]").value);
    const ck=q("[data-c]").value===NONE?null:F[q("[data-c]").value];
    const p=pivot(rows,F[q("[data-r]").value],ck===F[q("[data-r]").value]?null:ck,AGG[q("[data-v]").value]);
    q("[data-p]").innerHTML=pivotHtml(p,{order:"desc",vlabel:q("[data-v]").value,mark:true});
    const t=top1(p); out(t?`${t} · ${fmtAgg(p.agg,p.rt(t))}`:"—");
  };
  box.querySelectorAll("select").forEach(s=>s.onchange=run); run();
},
resumir(box){
  box.innerHTML = head("Simulador · resumir y mostrar valores")+`<div class="sim-b">
    <div class="ctrls">
      <label class="ctrl">Filas<select data-r>${opts(["Tipo de Servicio","Provincia","ARS","PSS"],"Tipo de Servicio")}</select></label>
      <label class="ctrl">Resumir valores por<select data-a>${opts(["Cuenta","Suma","Promedio","Máx."],"Cuenta")}</select></label>
      <label class="ctrl">Mostrar valores como<select data-m>${opts(["Sin cálculo","% del total general"],"Sin cálculo")}</select></label>
    </div>${resBox("Primer lugar")}<div class="pv" data-p></div></div>`;
  const out=wireRes(box), q=s=>box.querySelector(s), A={"Cuenta":"count","Suma":"sum","Promedio":"avg","Máx.":"max"}, L={"Cuenta":"Cuenta de ID Servicio","Suma":"Suma de Monto","Promedio":"Promedio de Monto","Máx.":"Máx. de Monto"};
  const run=()=>{
    const agg=A[q("[data-a]").value], usePct=q("[data-m]").value!=="Sin cálculo"&&(agg==="count"||agg==="sum");
    q("[data-m]").disabled=!(agg==="count"||agg==="sum"); if(q("[data-m]").disabled) q("[data-m]").value="Sin cálculo";
    const p=pivot(rec,F[q("[data-r]").value],null,agg);
    q("[data-p]").innerHTML=pivotHtml(p,{order:"desc",pct:usePct,vlabel:L[q("[data-a]").value]+(usePct?" (%)":""),mark:true});
    const t=top1(p); out(`${t} · ${usePct?pct(p.rt(t)/p.g()):fmtAgg(agg,p.rt(t))}`);
  };
  box.querySelectorAll("select").forEach(s=>s.onchange=run); run();
},
top(box){
  box.innerHTML = head("Simulador · ordenar y Diez mejores")+`<div class="sim-b">
    <div class="ctrls">
      <label class="ctrl">Filas (entidad)<select data-r>${opts(["PSS","ARS","Provincia"],"PSS")}</select></label>
      <label class="ctrl">Valores<select data-v>${opts(["Suma de Monto","Cuenta de ID Servicio"],"Suma de Monto")}</select></label>
      <label class="ctrl">Ordenar<select data-o>${opts(["De mayor a menor","De menor a mayor"],"De mayor a menor")}</select></label>
      <label class="ctrl">Diez mejores<select data-t>${opts(["Todos","3 mejores","5 mejores"],"3 mejores")}</select></label>
    </div>${resBox("Primer lugar")}<div class="pv" data-p></div></div>`;
  const out=wireRes(box), q=s=>box.querySelector(s);
  const run=()=>{
    const agg=AGG[q("[data-v]").value], p=pivot(rec,F[q("[data-r]").value],null,agg);
    const tsel=q("[data-t]").value, topN=tsel==="Todos"?0:parseInt(tsel,10);
    // «Diez mejores» siempre toma los N más altos; el orden solo cambia cómo se muestran
    let keep=p.rows.slice().sort((a,b)=>p.rt(b)-p.rt(a)); if(topN) keep=keep.slice(0,topN);
    const p2=Object.assign({},p,{rows:keep});
    q("[data-p]").innerHTML=pivotHtml(p2,{order:q("[data-o]").value==="De mayor a menor"?"desc":"asc",vlabel:q("[data-v]").value,mark:true});
    if(topN){ const sub=keep.reduce((s,r)=>s+p.rt(r),0); q("[data-p]").querySelector(".tot td:last-child").textContent=fmtAgg(agg,sub); }
    const t=top1(p); out(`${t} · ${fmtAgg(agg,p.rt(t))}`);
  };
  box.querySelectorAll("select").forEach(s=>s.onchange=run); run();
},
fechas(box){
  box.innerHTML = head("Simulador · agrupar fechas")+`<div class="sim-b">
    <div class="ctrls">
      <label class="ctrl">Agrupar Filas por<select data-g>${opts(["Meses","Trimestres","Años"],"Meses")}</select></label>
      <label class="ctrl">Columnas<select data-c>${opts(["Años","(ninguno)"],"Años")}</select></label>
      <label class="ctrl">Valores<select data-v>${opts(["Cuenta de ID Servicio","Suma de Monto"],"Cuenta de ID Servicio")}</select></label>
    </div>${resBox("Cambio de 2024 a 2025")}<div class="pv" data-p></div></div>`;
  const out=wireRes(box), q=s=>box.querySelector(s);
  const run=()=>{
    const g=F[q("[data-g]").value], agg=AGG[q("[data-v]").value];
    const ck=q("[data-c]").value==="Años"&&g!=="anio"?"anio":null;
    const p=pivot(rec,g,ck,agg);
    q("[data-p]").innerHTML=pivotHtml(p,{vlabel:q("[data-v]").value});
    const y=pivot(rec,"anio",null,agg), a=y.rt("2024"), b=y.rt("2025");
    out(`${fmtAgg(agg,a)} → ${fmtAgg(agg,b)} (${b>=a?"+":""}${((b-a)/a*100).toFixed(2)} %)`);
  };
  box.querySelectorAll("select").forEach(s=>s.onchange=run); run();
},
segmentacion(box){
  const ARS=[...new Set(rec.map(r=>r.ars))].sort((a,b)=>a.localeCompare(b,"es"));
  const selA=new Set(ARS); let anio="Todo";
  box.innerHTML = head("Simulador · segmentación y escala de tiempo")+`<div class="sim-b">
    <div class="slicers">
      <div class="slicer"><div class="sh">ARS <button data-clr title="Borrar filtro">✕ Borrar filtro</button></div><div class="sb" data-a>${ARS.map(a=>`<button data-v="${esc(a)}" class="on">${esc(a)}</button>`).join("")}</div></div>
      <div class="slicer"><div class="sh">Fecha · AÑOS</div><div class="sb" data-y>${["Todo","2024","2025"].map(y=>`<button data-v="${y}" class="${y==="Todo"?"on":""}">${y}</button>`).join("")}</div></div>
    </div>
    <div class="ctrl">Clic = solo esa ARS · Ctrl + clic = agregar o quitar varias</div>
    ${resBox("Registros que muestra el informe")}<div class="pv" data-p></div></div>`;
  const out=wireRes(box);
  const paint=()=>{ box.querySelectorAll("[data-a] button").forEach(b=>b.classList.toggle("on",selA.has(b.dataset.v))); box.querySelectorAll("[data-y] button").forEach(b=>b.classList.toggle("on",b.dataset.v===anio)); };
  const run=()=>{
    paint();
    const rows=rec.filter(r=>selA.has(r.ars)&&(anio==="Todo"||r.anio===anio));
    const p=pivot(rows,"tipo",null,"count");
    box.querySelector("[data-p]").innerHTML=pivotHtml(p,{order:"desc",vlabel:"Cuenta de ID Servicio"});
    out(`${rows.length} de ${rec.length}`);
  };
  box.querySelectorAll("[data-a] button").forEach(b=>b.onclick=e=>{
    const v=b.dataset.v;
    if(e.ctrlKey||e.metaKey){ if(selA.has(v)&&selA.size>1) selA.delete(v); else selA.add(v); }
    else { selA.clear(); selA.add(v); }
    run();
  });
  box.querySelector("[data-clr]").onclick=()=>{ ARS.forEach(a=>selA.add(a)); run(); };
  box.querySelectorAll("[data-y] button").forEach(b=>b.onclick=()=>{ anio=b.dataset.v; run(); });
  run();
},
grafico(box){
  const CON=[
    "SeNaSa es la ARS con mayor volumen: 107 de 360 registros (29.72 %), seguida de ARS Humano con 89.",
    "Consulta es el servicio más frecuente (121 servicios, 33.61 %); Hospitalización es el menos frecuente (42), pero suma RD$ 4,889,250, el 73.07 % del monto total.",
    "Distrito Nacional concentra 112 operaciones (31.11 %), muy por encima de Santo Domingo (69) y Santiago (63), las provincias que le siguen.",
    "Centro Médico Las Américas es el PSS con mayor monto: RD$ 3,020,300 (45.14 % del total), por las hospitalizaciones que atiende.",
    "Los registros crecieron de 150 en 2024 a 210 en 2025 (+40 %); en ambos años el cuarto trimestre es el más alto (47 y 65) y febrero el mes más bajo (9 y 13)."
  ];
  box.innerHTML = head("Simulador · gráfico dinámico")+`<div class="sim-b">
    <div class="ctrls">
      <label class="ctrl">Eje (Filas)<select data-r>${opts(["Meses","ARS","Tipo de Servicio","Provincia"],"Meses")}</select></label>
      <label class="ctrl">Valores<select data-v>${opts(["Cuenta de ID Servicio","Suma de Monto"],"Cuenta de ID Servicio")}</select></label>
    </div>
    <div class="chart"><div data-svg></div><div class="legend"><span><i style="background:#2f6b52"></i>2024</span><span><i style="background:#c9573f"></i>2025</span></div></div>
    <div class="ctrl">Conclusiones del análisis · clic en cada una para revelarla</div>
    <div class="concl">${CON.map((c,i)=>`<div class="hid"><b>${i+1}</b><span>${esc(c)}</span></div>`).join("")}</div></div>`;
  const q=s=>box.querySelector(s);
  box.querySelectorAll(".concl div").forEach(d=>d.onclick=()=>d.classList.toggle("hid"));
  const run=()=>{
    const rk=F[q("[data-r]").value], agg=AGG[q("[data-v]").value], p=pivot(rec,rk,"anio",agg);
    const W=760,H=200,pl=58,pb=26,pt=10, n=p.rows.length, gw=(W-pl-10)/n, bw=Math.min(22,gw*0.38);
    let mx=0; p.rows.forEach(r=>p.cols.forEach(c=>mx=Math.max(mx,p.v(r,c)||0)));
    const mag=Math.pow(10,Math.floor(Math.log10(mx))); const step=[1,2,5,10].map(f=>f*mag/2).find(st=>mx/st<=6); const nt=Math.ceil(mx/step), top=nt*step;
    const y=v=>pt+(H-pt-pb)*(1-v/top);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de columnas">`;
    for(let k=0;k<=nt;k++){ const v=step*k; s+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#e2ddd2"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5f6b64" font-family="IBM Plex Mono">${agg==="count"?num0(v):num0(v/1000)+"k"}</text>`; }
    p.rows.forEach((r,i)=>{ const x0=pl+i*gw+gw/2;
      p.cols.forEach((c,j)=>{ const v=p.v(r,c)||0; s+=`<rect x="${x0+(j?2:-bw-2)}" y="${y(v)}" width="${bw}" height="${H-pb-y(v)}" fill="${j?"#c9573f":"#2f6b52"}"><title>${lab(rk,r)} ${c}: ${fmtAgg(agg,v)}</title></rect>`; });
      const t=lab(rk,r); s+=`<text x="${x0}" y="${H-8}" text-anchor="middle" font-size="${n>8?11:10.5}" fill="#1f3d33" font-family="IBM Plex Sans">${esc(t.length>16?t.slice(0,15)+"…":t)}</text>`; });
    q("[data-svg]").innerHTML=s+"</svg>";
  };
  box.querySelectorAll("select").forEach(s=>s.onchange=run); run();
}
};

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides");
wrap.innerHTML=S.map(s=>s.html).join("");
const els=[...wrap.children];
els.forEach((el,i)=>S[i].init&&S[i].init(el));
wrap.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
const dots=document.getElementById("dots");
dots.innerHTML=TOPICS.map((t,i)=>`<button title="${t.k}" aria-label="Ir a ${t.k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(2+3*b.dataset.t));
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(els.length-1,i));
  els.forEach((e,j)=>e.classList.toggle("on",j===cur));
  const tp=S[cur].topic;
  dots.querySelectorAll("button").forEach((b,j)=>{b.classList.toggle("cur",j===tp);b.classList.toggle("done",tp>j||(tp<0&&cur>1));});
  document.getElementById("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  document.getElementById("topL").textContent = tp<0?"MÓDULO 3 · TABLAS DINÁMICAS AVANZADAS":`MÓDULO 3 · TEMA 0${tp+1} DE 07 · ${TOPICS[tp].k.toUpperCase()}`;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===els.length-1;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("fs").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener("keydown",e=>{
  if(locked) return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select") return;
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&tag!=="button")){e.preventDefault();go(cur+1);}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1);
  else if(e.key==="f"||e.key==="F") document.getElementById("fs").click();
});
function fit(){ const st=document.getElementById("stage"); const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); st.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1);
</script>
