<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Práctica guiada · Módulo 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Láminas de 1280×720. Cada paso = «Haga esto» + «Compruebe». Paleta del Módulo 7: burdeos + turquesa. */
:root{
  --bg:#ece6e9; --paper:#f8f6f4; --card:#ffffff; --ink:#6e1f3a; --text:#231b20; --muted:#6a5c63; --line:#e6dee2; --grid:#d2c6cc;
  --acc:#159a8c; --acc-d:#0b6b61; --acc-soft:#dcf2ef; --pos:#3b7a2e; --pos-soft:#e5f1df; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#f3e3e9;
  --xl:#217346; --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace; --win:"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(110,31,58,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:56px 72px 66px;display:none;flex-direction:column;gap:13px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none!important}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:24px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.08;text-wrap:balance}
h2{font-size:33px}
p{margin:0}
b{font-weight:600}
code{font-family:var(--mono);font-size:.92em;background:var(--ink-soft);color:var(--ink);padding:1px 6px;font-weight:600;white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;gap:12px;align-items:center}
.eyebrow .tag{background:var(--ink);color:#fff;padding:3px 10px;font-size:12.5px}
.eyebrow .tag.ok{background:var(--pos)}
.lead{font-size:19px;line-height:1.5}
.why{display:flex;gap:12px;align-items:baseline;font-size:16px;color:var(--ink);background:var(--ink-soft);padding:7px 14px}
.why b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.cols{display:grid;grid-template-columns:470px 1fr;grid-template-rows:minmax(0,1fr);gap:30px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:11px;min-width:0;min-height:0}
.tip{border-left:4px solid var(--acc);background:var(--acc-soft);padding:8px 13px;font-size:15px;line-height:1.42}
.warn{border-left:4px solid var(--neg);background:var(--neg-soft);padding:8px 13px;font-size:15px;line-height:1.42}
.do{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:n}
.do li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:16.5px;line-height:1.4;counter-increment:n}
.do li::before{content:counter(n);display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:var(--acc);color:#fff;font-family:var(--mono);font-size:13px;font-weight:700}
.do li .h{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.path{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--win);font-size:14px}
.path span{background:var(--card);border:1px solid var(--grid);padding:1px 8px;font-weight:600}
.path i{font-style:normal;color:var(--acc-d);font-weight:700}

/* Código para copiar */
.codebox{flex:1;display:flex;flex-direction:column;border:1px solid #cdbfa7;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.08);min-height:0}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;background:#f3ecdf;border-bottom:1px solid #ddd0bb;padding:6px 10px;font-family:var(--win);font-size:13px}
.codebox .bar b{color:var(--ink)}
.codebox pre{flex:1;min-height:0;margin:0;padding:10px 14px;font-family:var(--mono);font-size:12px;line-height:1.33;white-space:pre;overflow:auto;color:#1b1b1b}
.codebox .k{color:#1d47b8;font-weight:600}.codebox .t{color:#a31515}.codebox .c{color:#2e7d32}
.copiar{border:1px solid var(--acc);background:var(--acc);color:#fff;font-family:var(--mono);font-size:12.5px;padding:5px 12px;cursor:pointer}
.copiar.ok{background:var(--pos);border-color:var(--pos)}

/* Cuadros de diálogo y hoja de Excel */
.dlg{border:1px solid #9aa3a6;background:#f0f0f0;font-family:var(--win);font-size:14px;box-shadow:0 10px 26px rgba(0,0,0,.16);width:100%;align-self:start}
.dlg .t{background:#fff;padding:7px 12px;border-bottom:1px solid #d0d0d0;font-weight:600}
.dlg .b{padding:11px 14px 13px;display:flex;flex-direction:column;gap:8px}
.dlg .f{background:#fff;border:1px solid #8f979a;padding:4px 8px;min-height:28px}
.dlg .f.on{border:2px solid var(--acc);background:#f2fbfa;font-weight:600}
.dlg .k{display:flex;justify-content:flex-end;gap:8px;margin-top:3px}
.dlg .k span{border:1px solid #8f979a;background:#fdfdfd;padding:3px 15px}
.dlg .k span.on{border:2px solid var(--acc);background:var(--acc-soft);font-weight:600}
.dlg .lst{background:#fff;border:1px solid #8f979a;padding:4px;display:flex;flex-direction:column;gap:2px}
.dlg .lst span{padding:2px 6px}.dlg .lst span.on{background:#cce4f7;outline:2px solid var(--acc);outline-offset:-2px;font-weight:600}
.sheet{border:1px solid #c6c6c6;background:#fff;font-family:var(--win);font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.1);align-self:start;width:100%}
.sheet table{border-collapse:collapse;width:100%}
.sheet th{background:#f3f3f3;color:#555;font-weight:400;border:1px solid #dadada;padding:3px 6px;font-size:12px}
.sheet td{border:1px solid #e3e3e3;padding:4px 8px;white-space:nowrap}
.sheet td.n{text-align:right}
.sheet td.h{background:#6e1f3a;color:#fff;font-weight:700;border-color:#555}
.sheet td.b{font-weight:700}
.sheet td.big{font-weight:700;font-size:17px}
.sheet .tabs{display:flex;gap:2px;background:#f3f3f3;border-top:1px solid #dadada;padding:3px 8px;font-size:12.5px}
.sheet .tabs span{padding:2px 12px;color:#555}.sheet .tabs span.on{background:#fff;color:var(--xl);font-weight:700;border-bottom:2px solid var(--xl)}
.vbe{border:1px solid #9aa3a6;background:#fff;font-family:var(--win);font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.12);display:grid;grid-template-columns:190px 1fr;min-height:0}
.vbe .ex{background:#f6f6f6;border-right:1px solid #ccc;padding:8px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.vbe .ex b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#555}
.vbe .ex span.on{background:#cce4f7;outline:2px solid var(--acc);outline-offset:-2px;font-weight:600}
.vbe pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre}
.msgw{background:#fff;border:1px solid #9aa3a6;box-shadow:0 10px 26px rgba(0,0,0,.16);font-family:var(--win);width:380px;align-self:center}
.msgw .tt{padding:7px 12px;border-bottom:1px solid #ddd;font-size:14px}
.msgw .bd{display:flex;gap:14px;padding:18px 18px 10px;font-size:16px;align-items:flex-start;line-height:1.45}
.msgw .bd i{font-style:normal;display:inline-flex;width:32px;height:32px;border-radius:50%;background:#1d6fd6;color:#fff;align-items:center;justify-content:center;font-weight:700;flex:none}
.msgw .bt{display:flex;justify-content:flex-end;padding:8px 14px 12px;background:#f0f0f0}
.msgw .bt span{border:1px solid #1d6fd6;padding:4px 22px;font-size:14px;background:#fff}
.boton-xl{display:inline-flex;align-items:center;justify-content:center;background:#6e1f3a;color:#fff;font-family:var(--win);font-weight:600;font-size:15px;border-radius:10px;padding:10px 22px;box-shadow:0 3px 0 #4a1427}

/* «Compruebe» */
.okbox{border:2px solid var(--pos);background:var(--pos-soft);padding:13px 17px;display:flex;flex-direction:column;gap:8px;align-self:start;width:100%}
.okbox .t{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--pos);font-weight:700;display:flex;align-items:center;gap:10px}
.okbox .t i{font-style:normal;display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--pos);color:#fff;align-items:center;justify-content:center;font-size:16px}
.okbox p{font-size:16.5px;line-height:1.42}
.fixbox{align-self:start;width:100%;border:1px solid var(--grid);background:var(--card);padding:13px 17px;display:flex;flex-direction:column;gap:8px}
.fixbox .t{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--neg);font-weight:700}
.fixbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.fixbox li{display:grid;grid-template-columns:18px 1fr;gap:7px;font-size:14.5px;line-height:1.4}
.fixbox li::before{content:"→";color:var(--neg);font-weight:700}

/* Portada, misión y cierre */
.cover{background:var(--ink);color:#fff;justify-content:center;gap:20px;padding:70px 110px}
.cover-logo{position:absolute;top:50px;right:72px;height:84px;background:#fff;padding:8px 12px}
.cover .mod{font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#8fe0d6}
.cover h1{font-size:66px;color:#fff}
.cover .sub{font-size:25px;color:#f1dbe3;line-height:1.4}
.cover .by{font-size:22px}.cover .by b{color:#8fe0d6}
.big-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.big-steps div{background:#fff;border:1px solid var(--grid);border-top:4px solid var(--acc);padding:12px 14px;font-size:15.5px;line-height:1.4}
.big-steps b{display:block;font-family:var(--mono);font-size:12px;color:var(--acc-d);letter-spacing:.08em;margin-bottom:4px}
.dl{display:flex;align-items:center;gap:16px;background:#fff;border:2px dashed var(--acc);padding:14px 18px}
.dl .ic{font-size:34px}
.dl b{font-size:18px;color:var(--ink)}
.q{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink);border-left:4px solid var(--acc);padding-left:16px}
#stage.oscuro .top,#stage.oscuro .bottom{color:#f1dbe3}
#stage.oscuro .btn.primary{background:var(--acc);border-color:var(--acc)}
#giroTel{display:none;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.4}
@media (max-width:640px) and (orientation:portrait){#giroTel{display:flex}}
#aviso{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--pos);color:#fff;font-family:var(--mono);font-size:14px;padding:9px 16px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none}
#aviso.on{opacity:1}

/* Fondo crema claro en todas las láminas (pedido del facilitador) */
:root{--bg:#f1ebdf;--paper:#fbf7ef;--line:#ebe3d4;--grid:#d9cdb8;--ink-soft:#f5ead9}
.cover,.cierre{background:var(--paper)!important;color:var(--text)}
.cover{border-left:14px solid var(--ink)}
.cover h1,.cierre h2{color:var(--ink)!important}
.cover .mod{color:var(--acc-d)!important}
.cover .sub,.cierre .apoyo{color:var(--muted)!important}
.cover .by{color:var(--text)}.cover .by b{color:var(--acc-d)!important}
.cover-logo{border:1px solid var(--line)}
#stage.oscuro .top,#stage.oscuro .bottom{color:var(--muted)!important}
#stage.oscuro .btn.primary{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
</style>
</head>
<body>
<div id="giroTel"><p>📱 Gire su teléfono para ver la práctica en horizontal.</p></div>
<div id="stage">
  <div class="top"><span id="topL">PRÁCTICA GUIADA.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<div id="aviso">✔ Código copiado. Péguelo en el módulo con Ctrl + V.</div>
<script>
const CODIGO = {
 "preparar": "' PASO 4 · Crea (o vuelve a crear) la hoja Reporte con sus títulos\nSub PrepararReporte()\n    Dim hoja As Worksheet                     ' variable que guarda una hoja\n\n    ' 1. Si ya existe una hoja llamada Reporte, se borra\n    Application.DisplayAlerts = False         ' no pedir confirmación al borrar\n    For Each hoja In ThisWorkbook.Worksheets  ' recorre todas las hojas del libro\n        If hoja.Name = \"Reporte\" Then hoja.Delete\n    Next hoja\n    Application.DisplayAlerts = True          ' vuelve a mostrar los avisos\n\n    ' 2. Agrega una hoja nueva al final y le pone nombre\n    Set hoja = ThisWorkbook.Worksheets.Add( _\n        After:=ThisWorkbook.Worksheets(ThisWorkbook.Worksheets.Count))\n    hoja.Name = \"Reporte\"\n\n    ' 3. Escribe el título, la fecha y los encabezados\n    hoja.Range(\"A1\").Value = \"Informe mensual de reclamaciones\"\n    hoja.Range(\"A2\").Value = \"Generado el \" & Format(Date, \"dd/mm/yyyy\")\n    hoja.Range(\"A4\").Value = \"ARS\"\n    hoja.Range(\"B4\").Value = \"Reclamaciones\"\n    hoja.Range(\"C4\").Value = \"Monto\"\nEnd Sub",
 "resumen": "' PASO 5 · Calcula cuántas reclamaciones y cuánto monto tiene cada ARS\nSub GenerarResumen()\n    Dim datos As Worksheet, rep As Worksheet  ' hoja de origen y hoja de reporte\n    Dim listaARS As Variant                   ' lista con los nombres de las ARS\n    Dim i As Integer, fila As Integer         ' contador y fila donde se escribe\n\n    Set datos = ThisWorkbook.Worksheets(\"Datos\")\n    Set rep = ThisWorkbook.Worksheets(\"Reporte\")\n    listaARS = Array(\"ARS Humano\", \"ARS Primera\", \"ARS Senasa\", \"ARS Universal\")\n\n    fila = 5                                  ' los resultados empiezan en la fila 5\n    For i = 0 To UBound(listaARS)             ' repite una vez por cada ARS\n        rep.Cells(fila, 1).Value = listaARS(i)\n        rep.Cells(fila, 2).Value = Application.WorksheetFunction.CountIf( _\n            datos.Range(\"C:C\"), listaARS(i))                 ' CONTAR.SI\n        rep.Cells(fila, 3).Value = Application.WorksheetFunction.SumIf( _\n            datos.Range(\"C:C\"), listaARS(i), datos.Range(\"F:F\")) ' SUMAR.SI\n        fila = fila + 1                       ' baja a la fila siguiente\n    Next i\n\n    ' Fila de total (fila 9): en VBA las fórmulas se escriben en inglés\n    rep.Range(\"A9\").Value = \"Total\"\n    rep.Range(\"B9\").Formula = \"=SUM(B5:B8)\"\n    rep.Range(\"C9\").Formula = \"=SUM(C5:C8)\"\nEnd Sub",
 "formato": "' PASO 6 · Da formato al reporte\nSub DarFormato()\n    With ThisWorkbook.Worksheets(\"Reporte\")   ' todo lo que empieza con punto es de esta hoja\n        .Range(\"A1\").Font.Bold = True\n        .Range(\"A1\").Font.Size = 16\n        .Range(\"A4:C4\").Font.Bold = True\n        .Range(\"A4:C4\").Font.Color = RGB(255, 255, 255)        ' letra blanca\n        .Range(\"A4:C4\").Interior.Color = RGB(110, 31, 58)      ' relleno burdeos\n        .Range(\"C5:C9\").NumberFormat = \"\"\"RD$\"\" #,##0.00\"       ' formato de moneda\n        .Range(\"A9:C9\").Font.Bold = True\n        .Range(\"A4:C9\").Borders.LineStyle = xlContinuous       ' bordes en la tabla\n        .Columns(\"A:C\").AutoFit                                ' ajusta el ancho\n    End With\nEnd Sub",
 "informe": "' PASO 7 · Ejecuta todo el proceso y avisa al terminar\nSub GenerarInforme()\n    Application.ScreenUpdating = False        ' trabaja sin parpadeos\n    PrepararReporte                           ' 1. hoja nueva con títulos\n    GenerarResumen                            ' 2. cálculos por ARS\n    DarFormato                                ' 3. formatos\n    Application.ScreenUpdating = True\n\n    ThisWorkbook.Worksheets(\"Reporte\").Activate\n    MsgBox \"Informe generado.\" & vbCrLf & \"Monto total: RD$ \" & _\n        Format(ThisWorkbook.Worksheets(\"Reporte\").Range(\"C9\").Value, \"#,##0.00\"), _\n        vbInformation, \"Informe mensual\"\nEnd Sub"
};

/* Colorea el código como el editor de VBA */
const KW=["Sub","End","Dim","As","Set","If","Then","Else","For","Each","In","Next","To","With","Integer","Variant","Worksheet","True","False"];
function vb(src){ const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const pal=s=>esc(s).replace(/\b([A-Za-z]+)\b/g,m=>KW.includes(m)?`<span class="k">${m}</span>`:m);
  return src.split("\n").map(l=>{ let out="",buf="",tx=false; for(let i=0;i<l.length;i++){ const ch=l[i];
      if(ch==='"'){ if(!tx){out+=pal(buf);buf='"';tx=true;} else {buf+='"';out+=`<span class="t">${esc(buf)}</span>`;buf="";tx=false;} continue; }
      if(ch==="'"&&!tx){ return out+pal(buf)+`<span class="c">${esc(l.slice(i))}</span>`; } buf+=ch; }
    return out+(tx?`<span class="t">${esc(buf)}</span>`:pal(buf)); }).join("\n"); }
const caja=(k,titulo)=>`<div class="codebox"><div class="bar"><b>${titulo}</b><button class="copiar" data-k="${k}">📋 Copiar código</button></div><pre>${vb(CODIGO[k])}</pre></div>`;
const ruta=(...p)=>`<span class="path">${p.map(x=>`<span>${x}</span>`).join("<i>›</i>")}</span>`;
const hoja=(filas,pest="Reporte",cols="ABC")=>`<div class="sheet"><table><tr><th></th>${[...cols].map(c=>`<th>${c}</th>`).join("")}</tr>${filas.map((f,i)=>`<tr><th>${i+1}</th>${f.map(c=>{ const [v,cl]=[].concat(c); return `<td class="${cl||''}">${v||''}</td>`; }).join("")}</tr>`).join("")}</table><div class="tabs">${["Datos","Nota","Reporte"].filter(x=>pest==="Datos"?x!=="Reporte":true).map(x=>`<span class="${x===pest?'on':''}">${x}</span>`).join("")}</div></div>`;
const RES=[["ARS Humano",35,"RD$ 166,200.00"],["ARS Primera",28,"RD$ 141,650.00"],["ARS Senasa",38,"RD$ 225,900.00"],["ARS Universal",19,"RD$ 160,100.00"]];

/* ---------- Láminas ---------- */
const S=[]; const SECC=["Inicio","Paso 1","Paso 2","Paso 3","Paso 4","Paso 5","Paso 6","Paso 7","Paso 8","Entrega"];
const lam=(t,h,cl="")=>S.push({t,h:`<div class="slide ${cl}">${h}</div>`});
const paso=(t,n,titulo,para,izq,der)=>lam(t,`<p class="eyebrow"><span class="tag">Paso ${n} de 8</span>Haga esto</p><h2>${titulo}</h2><p class="why"><b>Para qué</b>${para}</p><div class="cols"${der.includes('codebox')?' style="grid-template-columns:350px 1fr"':''}><div class="col">${izq}</div><div class="col">${der}</div></div>`);

const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children], $=id=>document.getElementById(id);
const INI=SECC.map((_,i)=>S.findIndex(s=>s.t===i));
const dots=$("dots"); dots.innerHTML=SECC.map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));
/* Copiar código al portapapeles */
function avisar(){ const a=$("aviso"); a.classList.add("on"); clearTimeout(avisar.h); avisar.h=setTimeout(()=>a.classList.remove("on"),2200); }
wrap.addEventListener("click",async e=>{ const b=e.target.closest(".copiar"); if(!b) return; const txt=CODIGO[b.dataset.k];
  try{ await navigator.clipboard.writeText(txt); }catch(_){ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(__){} t.remove(); }
  b.classList.add("ok"); b.textContent="✔ Copiado"; setTimeout(()=>{ b.classList.remove("ok"); b.textContent="📋 Copiar código"; },2200); avisar(); });
const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m7sonido")!=="0"; }catch(e){}
function sonar(d){ if(!SND.on||!SND.ready) return; try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+.01; o.frequency.value=d>0?880:587; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.22); }catch(e){} }
const pintarSnd=()=>{ $("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
$("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m7sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();
let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  $("stage").classList.toggle("oscuro",els[cur].classList.contains("cover"));
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  $("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  $("topL").textContent="PRÁCTICA GUIADA · "+SECC[tp].toUpperCase()+".";
  $("prev").disabled=cur===0; $("next").disabled=cur===els.length-1;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){} }
$("prev").onclick=()=>go(cur-1); $("next").onclick=()=>go(cur+1);
$("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ const enB=e.target.closest&&e.target.closest("button,a");
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!enB)){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") $("fs").click(); else if(e.key==="m"||e.key==="M") $("snd").click(); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; },{passive:true});
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); $("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
</body>
