<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Manual de Power Query · Módulo 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Escenario fijo 1280×720 escalado a la pantalla. Una idea por lámina, letra grande y un solo apoyo visual. Paleta del Módulo 6: índigo + mandarina. */
:root{
  --bg:#e6e5ee; --paper:#f7f6f3; --card:#ffffff; --ink:#2f3a8f; --text:#1f2233; --muted:#5f6275; --line:#e2e0ea; --grid:#cbc8d8;
  --acc:#f2994a; --acc-d:#b8641c; --acc-soft:#fdeedd; --pos:#23826f; --pos-soft:#e2f3f0; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#e7e9f6;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(47,58,143,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:70px 110px 80px;display:none;flex-direction:column;justify-content:center;gap:28px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:28px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.12;text-wrap:balance}
h2{font-size:56px}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d)}
.apoyo{font-size:30px;line-height:1.38;text-wrap:pretty}
.vis{display:flex;align-items:center;gap:18px}
.vis span{font-family:var(--mono);font-size:27px;background:var(--card);border:1px solid var(--grid);padding:14px 22px;color:var(--text)}
.vis span.fin{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.vis i{font-style:normal;color:var(--acc);font-size:40px}
.lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:32px;line-height:1.2}
.lista li{display:grid;grid-template-columns:54px 1fr;align-items:baseline}
.lista b{font-family:var(--serif);font-weight:600;color:var(--acc)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px;font-size:18.5px;line-height:1.35}
.refs li{padding-left:28px;text-indent:-28px}
.refs a{color:var(--ink);word-break:break-all;text-decoration:none}
.ref-t{font-size:44px}

.cover{gap:22px;background:var(--ink);color:#fff}
.cover-logo{position:absolute;top:50px;right:72px;height:90px;width:auto;background:#fff;padding:9px 13px}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#f8c9a0}
.cover h1{font-size:84px;color:#fff}
.cover .by{font-size:26px}.cover .by b{color:#f8c9a0;font-weight:600}
.cierre{background:var(--ink)}
.cierre h2{color:#fff;font-size:64px}
.cierre .apoyo{color:#dadcf2}
#stage.oscuro .top,#stage.oscuro .bottom{color:#d5d8ef}
#stage.oscuro .btn.primary{background:var(--acc);border-color:var(--acc);color:#2a1a00}
#giroTel{display:none;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.4}
@media (max-width:640px) and (orientation:portrait){#giroTel{display:flex}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none!important}}
</style>
</head>
<body>
<div id="giroTel"><p>📱 Gire su teléfono para ver el manual en horizontal.</p></div>
<div id="stage">
  <div class="top"><span id="topL">MANUAL DE POWER QUERY.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Láminas: una idea, una frase de apoyo y, si ayuda, un solo apoyo visual ---------- */
const S = [];
const SECC = ["Inicio","La idea","Conectar","Tipos de datos","Texto","Cargar","Actualizar","Cierre"];
const lam = (t,h,cl="") => S.push({t,h:`<div class="slide ${cl}">${h}</div>`});
const idea = (t,ey,tit,apoyo,vis="") => lam(t,`<p class="eyebrow">${ey}</p><h2>${tit}</h2><p class="apoyo">${apoyo}</p>${vis?`<div class="vis">${vis}</div>`:""}`);
const fl = `<i>→</i>`;

lam(0,`<img class="cover-logo" src="img/icadep-isologo.png" alt="ICADEP-XXI · Instituto de Capacitación y Desarrollo Profesional Siglo XXI">
  <p class="mod">Módulo 6</p>
  <h1>Manual de Power Query.</h1>
  <p class="by">Por: <b>Jarlin Figueroa, MA</b></p>`,"cover");

idea(1,"La idea","¿Qué es Power Query?","Es la herramienta de Excel que obtiene, transforma y carga datos, sin fórmulas y sin tocar los archivos originales.");
idea(1,"La idea","Una receta grabada.","Cada acción queda guardada como un paso. Cuando llegan datos nuevos, los pasos se repiten solos.");

lam(1,`<p class="eyebrow">La idea</p><h2>Cinco fundamentos.</h2>
  <ol class="lista"><li><b>1</b>Conectarse a una carpeta</li><li><b>2</b>Tipos de datos</li><li><b>3</b>Unificar el texto</li><li><b>4</b>Moneda y carga</li><li><b>5</b>Actualizar</li></ol>`);

idea(2,"Fundamento 1 · Conectarse a una carpeta","Se conecta, no copia.","Si varios archivos tienen las mismas columnas, Power Query los une en una sola consulta.",`<span>3 archivos</span>${fl}<span class="fin">1 tabla</span>`);
idea(3,"Fundamento 2 · Tipos de datos","Cada columna tiene un tipo.","Una fecha guardada como texto no se puede ordenar ni agrupar por mes.",`<span>14/01/2026</span><span>2026-01-15</span>${fl}<span class="fin">📅 Fecha</span>`);
idea(4,"Fundamento 3 · Unificar el texto","Igual solo si es idéntico.","Power Query distingue mayúsculas: una misma categoría escrita de dos formas cuenta como dos.",`<span>hogar</span><span>Hogar</span>${fl}<span class="fin">Hogar</span>`);
idea(5,"Fundamento 4 · Moneda y carga","Moneda es un tipo de dato.","Se usa para precios y montos. Con Cerrar y cargar, el resultado llega a una tabla de Excel.",`<span>123 Precio</span>${fl}<span class="fin">$ Moneda</span>`);
idea(6,"Fundamento 5 · Actualizar","Un clic repite la receta.","Al llegar un archivo nuevo a la carpeta, Actualizar todo aplica los mismos pasos.",`<span>90 filas</span>${fl}<span class="fin">120 filas</span>`);

lam(7,`<h2>Se hace una vez. Se repite siempre.</h2><p class="apoyo">Menos copiar y pegar, más tiempo para analizar.</p>`,"cierre");

lam(7,`<h2 class="ref-t">Referencias.</h2><ul class="refs">
  <li>Kimball, R., &amp; Caserta, J. (2004). <i>The data warehouse ETL toolkit</i>. Wiley.</li>
  <li>Microsoft. (s. f.-a). <i>Acerca de Power Query en Excel</i>. Microsoft Support. <a href="https://support.microsoft.com/es-es/Excel/about-power-query-in-excel" target="_blank" rel="noopener">https://support.microsoft.com/es-es/Excel/about-power-query-in-excel</a></li>
  <li>Microsoft. (s. f.-b). <i>Tipos de datos en Power Query</i>. Microsoft Learn. <a href="https://learn.microsoft.com/es-es/power-query/data-types" target="_blank" rel="noopener">https://learn.microsoft.com/es-es/power-query/data-types</a></li>
  <li>Microsoft. (s. f.-c). <i>¿Qué es Power Query?</i> Microsoft Learn. <a href="https://learn.microsoft.com/es-es/power-query/power-query-what-is-power-query" target="_blank" rel="noopener">https://learn.microsoft.com/es-es/power-query/power-query-what-is-power-query</a></li>
  <li>Puls, K., &amp; Escobar, M. (2021). <i>Master your data with Power Query in Excel and Power BI</i> (2.ª ed.). Holy Macro! Books.</li>
  <li>Raviv, G. (2019). <i>Collect, combine, and transform data using Power Query in Excel and Power BI</i>. Microsoft Press.</li></ul>`);

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children], $=id=>document.getElementById(id);
const INI=SECC.map((_,i)=>S.findIndex(s=>s.t===i));
const dots=$("dots");
dots.innerHTML=SECC.map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));

const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m6sonido")!=="0"; }catch(e){}
function sonar(d){ if(!SND.on||!SND.ready) return; try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+.01; o.frequency.value=d>0?880:587; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.22); }catch(e){} }
const pintarSnd=()=>{ $("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
$("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m6sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();

let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  $("stage").classList.toggle("oscuro",els[cur].classList.contains("cover")||els[cur].classList.contains("cierre"));
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  $("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  $("topL").textContent="MANUAL DE POWER QUERY · "+SECC[tp].toUpperCase()+".";
  $("prev").disabled=cur===0; $("next").disabled=cur===els.length-1;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){} }
$("prev").onclick=()=>go(cur-1); $("next").onclick=()=>go(cur+1);
$("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ const enB=e.target.closest&&e.target.closest("button,a");
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!enB)){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") $("fs").click(); else if(e.key==="m"||e.key==="M") $("snd").click(); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; },{passive:true});
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); $("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
</body>
</html>
