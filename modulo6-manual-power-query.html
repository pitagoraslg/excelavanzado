<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Manual interactivo de Power Query · Módulo 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Escenario fijo 1280×720 escalado a la pantalla. Manual interactivo: poco texto y algo que probar en cada lámina. Paleta del Módulo 6: índigo + mandarina. */
:root{
  --bg:#e6e5ee; --paper:#f7f6f3; --card:#ffffff; --ink:#2f3a8f; --text:#1f2233; --muted:#5f6275; --line:#e2e0ea; --grid:#cbc8d8;
  --acc:#f2994a; --acc-d:#b8641c; --acc-soft:#fdeedd; --pos:#23826f; --pos-soft:#e2f3f0; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#e7e9f6;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(47,58,143,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:56px 72px 66px;display:none;flex-direction:column;gap:14px}
.slide.on{display:flex;animation:in .4s ease}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:24px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.08;text-wrap:balance}
h2{font-size:36px}
p{margin:0}
b{font-weight:600}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--acc-d)}
.lead{font-size:19px;line-height:1.42}
.hazlo{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--acc-soft);border-left:4px solid var(--acc);padding:5px 10px;align-self:flex-start}
code{font-family:var(--mono);font-size:.9em;background:var(--ink-soft);color:var(--ink);padding:1px 5px}
.ruta{font-family:var(--mono);font-size:13.5px;background:var(--ink-soft);color:var(--ink);padding:3px 8px;display:inline-block}
.grow1{flex:1;min-height:0}

/* Selector: botones + panel */
.pick{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.pick.lado{display:grid;grid-template-columns:320px 1fr;gap:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pick.lado .opts{flex-direction:column;flex-wrap:nowrap}
.op{font-family:var(--sans);font-size:15.5px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--grid);padding:9px 14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.op:hover{border-color:var(--ink)}
.op.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);padding:18px 22px;display:flex;flex-direction:column;gap:11px;min-height:0;font-size:17.5px;line-height:1.42;animation:pop .3s ease}
.pick .panel{flex:1;justify-content:center;font-size:20px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--ink);margin:0}
.panel .eje{font-size:15.5px;background:var(--pos-soft);border-left:4px solid var(--pos);padding:7px 11px}
.panel .ojo{font-size:15.5px;background:var(--acc-soft);border-left:4px solid var(--acc);padding:7px 11px}

/* Tablas de muestra */
table.t{border-collapse:collapse;width:100%;font-size:15px;background:var(--card);font-variant-numeric:tabular-nums}
.t th{background:var(--ink);color:#fff;text-align:left;padding:6px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.t td{border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap}
.t .r{text-align:right}
.t tr.fuera td{background:var(--neg-soft);color:#8f2f1c;text-decoration:line-through}
.t td.nul{color:#888;font-style:italic}
.t td.nuevo,.t th.nuevo{background:var(--acc-soft);color:#2a1a00}
.t td.bien{background:var(--pos-soft)}
.estado{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.cap{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.flecha{color:var(--acc);font-size:28px;text-align:center;align-self:center}
.camp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}
input[type=text],input[type=date],select{font-family:var(--mono);font-size:16px;padding:7px 10px;border:1.5px solid var(--grid);background:#fff;color:var(--text)}
input[type=text]{width:100%}
input[type=range]{accent-color:var(--ink);flex:1;min-width:180px}
.resul{font-family:var(--mono);font-size:21px;color:var(--ink);background:var(--ink-soft);padding:10px 14px;min-height:50px;white-space:pre-wrap;word-break:break-word}
.sp{background:var(--neg-soft);color:var(--neg);padding:0 1px}

/* Flujo de etapas */
.etapas{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr 34px 1fr;gap:6px;align-items:stretch}
.etapas .a{color:var(--acc);font-size:26px;display:flex;align-items:center;justify-content:center}
.etapa{font-family:var(--sans);background:var(--card);border:1.5px solid var(--grid);border-top:5px solid var(--ink);padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-size:20px;font-weight:600}
.etapa.on{background:var(--ink);color:#fff}

/* Editor */
.ed{border:1px solid #b9b7c6;background:#fff;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;display:flex;flex-direction:column}
.zona{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:7px 10px;transition:box-shadow .15s}
.zona:hover{box-shadow:inset 0 0 0 2px var(--acc)}
.zona.on{box-shadow:inset 0 0 0 3px var(--acc)}
.zona:focus-visible{outline:3px solid var(--acc)}
.z1{background:#217346;color:#fff}.z2{background:#f3f3f6;font-family:var(--mono);font-size:12.5px;border-bottom:1px solid #d6d4e0}
.zfila{display:grid;grid-template-columns:120px 1fr 170px;min-height:220px;flex:1}
.z3,.z5{background:#fafafc;font-size:13px;line-height:1.6}.z3{border-right:1px solid #d6d4e0}.z5{border-left:1px solid #d6d4e0}
.z6{background:#f3f3f6;border-top:1px solid #d6d4e0;font-size:12.5px;font-weight:600}
.num{display:inline-flex;width:21px;height:21px;border-radius:50%;background:var(--acc);color:#2a1a00;font-weight:700;font-size:12px;align-items:center;justify-content:center;margin-right:6px}

/* Lista de pasos */
.pasos{display:flex;flex-direction:column;gap:4px}
.paso{all:unset;box-sizing:border-box;cursor:pointer;font-size:15.5px;padding:6px 11px;border:1px solid var(--line);background:var(--card)}
.paso:hover{border-color:var(--ink)}.paso.on{background:#dfe7f7;outline:1px solid #9fb3df;font-weight:600}
.paso:focus-visible{outline:3px solid var(--acc)}

/* Venn */
.venn svg{display:block;height:170px;margin:0 auto}
.venn circle,.venn path{transition:fill .25s}

/* Código M */
.cod{background:#20244f;color:#f0f0f8;font-family:var(--mono);font-size:13.8px;line-height:2;padding:16px 18px;white-space:pre-wrap;border-left:4px solid var(--acc)}
.mk{all:unset;cursor:pointer;border-bottom:2px dotted var(--acc);padding:0 2px}
.mk:hover,.mk.on{background:var(--acc);color:#2a1a00}
.mk:focus-visible{outline:2px solid #fff}

/* Prueba */
.preg{font-family:var(--serif);font-size:25px;line-height:1.28;color:var(--ink)}
.resps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resp{font-family:var(--sans);font-size:17px;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--grid);padding:13px 16px;cursor:pointer}
.resp:hover{border-color:var(--ink)}
.resp.bien{background:var(--pos-soft);border-color:var(--pos);font-weight:600}
.resp.mal{background:var(--neg-soft);border-color:var(--neg)}
.fb{font-size:17px;min-height:50px;line-height:1.4}

/* Tarjetas que giran */
.giros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}
.giro{all:unset;cursor:pointer;perspective:900px;display:block}
.giro:focus-visible{outline:3px solid var(--acc)}
.giro .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.giro.on .in{transform:rotateY(180deg)}
.giro .ca{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
.giro .fr{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink)}
.giro .at{background:var(--ink);color:#fff;font-size:17.5px;line-height:1.4;transform:rotateY(180deg)}

/* Glosario */
.glos{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;align-content:start;overflow:hidden;flex:1;min-height:0}
.glos div{display:grid;grid-template-columns:165px 1fr;gap:10px;font-size:15.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.glos b{color:var(--ink)}

/* Mapa */
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;flex:1;min-height:0}
.mapa button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ink);padding:13px 17px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.mapa button:hover{transform:translateY(-3px);border-top-color:var(--acc)}
.mapa button:focus-visible{outline:3px solid var(--acc)}
.mapa .n{font-family:var(--serif);font-size:27px;color:var(--acc);line-height:1}
.mapa b{font-size:18px;color:var(--ink)}.mapa span{font-size:14.5px;color:var(--muted)}

/* Actualizar */
.cuenta{font-family:var(--serif);font-size:52px;font-weight:600;color:var(--ink);line-height:1;transition:color .3s}
.archivos{display:flex;flex-direction:column;gap:6px}
.arch{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 12px;font-size:15.5px;animation:pop .3s ease}
.arch i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:26px;height:28px;background:#1d6f42;color:#fff;font-weight:700;font-size:12px}
.arch.nuevo{border:2px dashed var(--acc);background:var(--acc-soft)}

.refs{list-style:none;margin:0;padding:10px 0 0;border-top:2px solid var(--ink);columns:2;column-gap:30px;font-size:12.6px;line-height:1.36}
.refs li{padding-left:22px;text-indent:-22px;margin-bottom:6px;break-inside:avoid}
.refs a{color:var(--ink);word-break:break-all;text-decoration:none}

/* Portada */
.cover{justify-content:center;gap:18px;background:var(--ink);color:#fff}
.cover-logo{position:absolute;top:50px;right:72px;height:90px;width:auto;background:#fff;padding:9px 13px}
.cover .mod{font-family:var(--mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#f8c9a0}
.cover h1{font-size:70px;color:#fff;max-width:900px}
.cover .sub{font-family:var(--serif);font-size:25px;color:#dadcf2;max-width:760px;line-height:1.3}
.cover .by{font-size:20px}.cover .by b{color:#f8c9a0}
.cover .hint{font-family:var(--mono);font-size:13.5px;color:#dadcf2}
#stage.oscuro .top,#stage.oscuro .bottom{color:#d5d8ef}
#stage.oscuro .btn.primary{background:var(--acc);border-color:var(--acc);color:#2a1a00}

#giroTel{display:none;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.4}
@media (max-width:640px) and (orientation:portrait){#giroTel{display:flex}}
@media (prefers-reduced-motion:reduce){.slide.on,.panel,.arch,.giro .in{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="giroTel"><p>📱 Gire su teléfono para ver el manual en horizontal.</p></div>
<div id="stage">
  <div class="top"><span id="topL">MANUAL DE POWER QUERY.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Piezas ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtN = n => n.toLocaleString("en-US");
const tabla = (cab,filas,opt={}) => `<table class="t"><tr>${cab.map((c,j)=>`<th class="${(opt.r||[]).includes(j)?'r':''} ${(opt.nuevas||[]).includes(j)?'nuevo':''}">${c}</th>`).join("")}</tr>${filas.map((f,i)=>`<tr class="${(opt.fuera||[]).includes(i)?'fuera':''}">${f.map((c,j)=>`<td class="${c===null?'nul':''} ${(opt.r||[]).includes(j)?'r':''} ${(opt.nuevas||[]).includes(j)?'nuevo':''}">${c===null?'null':c}</td>`).join("")}</tr>`).join("")}</table>`;
const panel = (h,t,x="") => `<h3>${h}</h3><p>${t}</p>${x}`;
const eje = t => `<p class="eje"><b>Ejemplo.</b> ${t}</p>`;
const ojo = t => `<p class="ojo"><b>Ojo.</b> ${t}</p>`;
const haz = t => `<p class="hazlo">👆 ${t}</p>`;
const cab = (c,t,l="") => `<p class="eyebrow">${c}</p><h2>${t}</h2>${l?`<p class="lead">${l}</p>`:""}`;

/* Selector genérico: cada opción tiene un nombre (k) y un contenido (b) o una función */
const SEL = {};
let nSel = 0;
function sel(ops,lado=true,al){ const id="s"+(++nSel); SEL[id]={ops,al}; return `<div class="pick ${lado?'lado':''}" data-sel="${id}"><div class="opts">${ops.map((o,i)=>`<button type="button" class="op" data-i="${i}">${o.k}</button>`).join("")}</div><div class="panel" aria-live="polite"></div></div>`; }
function pintaSel(g,i){ const s=SEL[g.dataset.sel], o=s.ops[i], p=g.querySelector(".panel"); g.querySelectorAll(".op").forEach((b,j)=>b.classList.toggle("on",j===i)); p.innerHTML=typeof o.b==="function"?o.b():o.b; p.style.animation="none"; p.offsetWidth; p.style.animation=""; if(s.al) s.al(p,i); }

const S = [];
const SECC = ["Inicio","Fundamentos","El editor","Obtener datos","Tipos de datos","Transformar","Crear y resumir","Unir consultas","Entregar","Ir más allá","Referencias"];
const lam = (t,h,cl="") => S.push({t,h:`<div class="slide ${cl}">${h}</div>`});

/* ---------- Inicio ---------- */
lam(0,`<img class="cover-logo" src="img/icadep-isologo.png" alt="ICADEP-XXI · Instituto de Capacitación y Desarrollo Profesional Siglo XXI">
  <p class="mod">Módulo 6 · Material de consulta</p>
  <h1>Manual interactivo de Power Query.</h1>
  <p class="sub">Qué es, para qué sirve y qué hace cada opción. Pruébelo aquí mismo.</p>
  <p class="by">Por: <b>Jarlin Figueroa, MA</b></p>
  <p class="hint">Use ← → para avanzar · En cada lámina hay algo que tocar 👆 · M = sonido</p>`,"cover");

lam(0,`${cab("Contenido","Vaya directo a lo que necesita.")}
  <div class="mapa" id="mapa">${[["1","Fundamentos","Qué es y cuándo usarlo"],["2","El editor","La ventana, la cinta y los pasos"],["3","Obtener datos","Orígenes y carpetas"],["4","Tipos de datos","Tipo, formato y región"],["5","Transformar","Filas, columnas, texto y fechas"],["6","Crear y resumir","Columnas nuevas, agrupar, dinamizar"],["7","Unir consultas","Anexar, combinar y sus 6 tipos"],["8","Entregar","Cargar y actualizar"],["9","Ir más allá","Lenguaje M, prueba y glosario"]].map(([n,k,d],i)=>`<button type="button" data-sec="${i+1}"><span class="n">${n}</span><b>${k}.</b><span>${d}</span></button>`).join("")}</div>`);

/* ---------- 1. Fundamentos ---------- */
lam(1,`${cab("Capítulo 1 · Fundamentos","Prepara los datos una vez. Después, se repite solo.")}
  ${haz("Toque cada etapa.")}
  <div class="pick" data-sel="etl"><div class="etapas opts" style="display:grid">${["Obtener","Transformar","Cargar","Actualizar"].map((k,i)=>`<button type="button" class="etapa op" data-i="${i}">${k}</button>${i<3?`<span class="a">${i===2?'↻':'→'}</span>`:""}`).join("")}</div><div class="panel" aria-live="polite"></div></div>`);
SEL.etl={ops:[
  {b:panel("Obtener.","Se conecta al origen de los datos: un archivo, una carpeta, una web o una base de datos. No copia nada a mano: recuerda dónde están.")},
  {b:panel("Transformar.","Limpia y da forma con botones, sin fórmulas. Cada acción queda grabada como un paso.")},
  {b:panel("Cargar.","Lleva el resultado a una tabla de Excel, lista para analizar. Los archivos originales no cambian.")},
  {b:panel("Actualizar.","Cuando llegan datos nuevos, un clic repite toda la receta.",eje("A este proceso se le llama ETL: extraer, transformar y cargar."))}]};

lam(1,`${cab("Capítulo 1 · Fundamentos","Sirve en casi cualquier área.")}${haz("Elija un área.")}
  ${sel([
   {k:"Ventas",b:panel("Ventas.","Unir cada mes los archivos de todas las sucursales.",eje("Antes: copiar y pegar por horas. Ahora: guardar el archivo y pulsar Actualizar todo."))},
   {k:"Finanzas",b:panel("Finanzas.","Consolidar estados de cuenta y clasificar movimientos siempre con las mismas reglas.")},
   {k:"Recursos humanos",b:panel("Recursos humanos.","Reunir nóminas o asistencia de varios departamentos en una sola tabla.")},
   {k:"Salud y seguros",b:panel("Salud y seguros.","Consolidar reportes que llegan de distintas instituciones.")},
   {k:"Educación",b:panel("Educación.","Reunir calificaciones de varios cursos y unirlas con los datos de los estudiantes.")},
   {k:"Inventario",b:panel("Inventario.","Cruzar existencias con el catálogo de productos y proveedores.")}])}`);

lam(1,`${cab("Capítulo 1 · Fundamentos","¿Power Query u otra herramienta?")}${haz("Elija su situación.")}
  ${sel([
   {k:"Los datos llegan sucios cada mes",b:panel("Power Query.","Prepara y repite los mismos arreglos.")},
   {k:"Necesito un cálculo que cambie al instante",b:panel("Fórmulas.","Se recalculan solas. Una consulta solo cambia al actualizar.")},
   {k:"Quiero explorar datos ya limpios",b:panel("Tablas dinámicas.","Resumen y exploran desde varios ángulos.")},
   {k:"Debo automatizar botones e informes",b:panel("Macros y VBA.","Controlan la interfaz de Excel y crean procesos a la medida.")},
   {k:"Tengo varias tablas relacionadas",b:panel("Power Pivot.","Relaciona tablas y crea medidas sobre el modelo de datos.")},
   {k:"Es un arreglo pequeño, una sola vez",b:panel("Quizá no haga falta.","Si no se repetirá, hágalo directamente en la hoja.",ojo("Lo normal es combinarlas: Power Query prepara y las tablas dinámicas analizan."))}])}`);

  if(t){ const f=()=>{ const q=t.value.split(d.value).map(x=>x.trim()).filter(Boolean); p.querySelector("#divR").innerHTML=tabla(q.map((_,i)=>"Columna."+(i+1)),[q.map(esc)]); }; t.oninput=f; d.onchange=f; f(); }
  if(a){ const f=()=>{ p.querySelector("#comR").textContent=(a.value+" "+b.value).trim(); }; a.oninput=f; b.oninput=f; f(); } }
function liveCon(p){ const r=p.querySelector("#conR"); if(!r) return; const f=()=>{ const v=+r.value; p.querySelector("#conV").textContent=fmtN(v); p.querySelector("#conT").innerHTML=tabla(["Producto","Monto","Nivel"],VTA.map(x=>[x[0],fmtN(x[1]),x[1]>v?"Venta alta":"Venta baja"]),{r:[1],nuevas:[2]}); }; r.oninput=f; f(); }

/* Sonido */
const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m6sonido")!=="0"; }catch(e){}
function ctx(){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); return c; }
function tono(c,f,t0,dur,vol,tipo){ const o=c.createOscillator(), g=c.createGain(); o.type=tipo||"sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }
function clic(){ if(!SND.on||!SND.ready) return; try{ const c=ctx(); if(c) tono(c,660,c.currentTime+.01,.09,.035); }catch(e){} }
function exito(){ if(!SND.on||!SND.ready) return; try{ const c=ctx(); if(!c) return; const t=c.currentTime+.05; [659.25,987.77].forEach((f,i)=>tono(c,f,t+i*.11,.4,.07,"triangle")); }catch(e){} }
function sonar(d){ if(!SND.on||!SND.ready) return; try{ const c=ctx(); if(c) tono(c,d>0?880:587,c.currentTime+.01,.2,.05); }catch(e){} }
const pintarSnd=()=>{ $("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
$("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m6sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();

/* Navegación */
let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  $("stage").classList.toggle("oscuro",els[cur].classList.contains("cover"));
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  $("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  $("topL").textContent="MANUAL DE POWER QUERY · "+SECC[tp].toUpperCase()+".";
  $("prev").disabled=cur===0; $("next").disabled=cur===els.length-1;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){} }
$("prev").onclick=()=>go(cur-1); $("next").onclick=()=>go(cur+1);
$("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ const en=e.target.closest&&e.target.closest("input,select,textarea"); if(en) return; const enB=e.target.closest&&e.target.closest("button,a");
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!enB)){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") $("fs").click(); else if(e.key==="m"||e.key==="M") $("snd").click(); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.target.closest("input,select")?null:e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; },{passive:true});
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); $("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
