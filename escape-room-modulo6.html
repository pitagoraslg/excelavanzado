<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape room · La bóveda de Brisa Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1030; --bg2:#151a45; --panel:#1b2157; --panel2:#232a6b; --line:#343c86;
  --ink:#eef0ff; --muted:#a9afd9; --indigo:#2F3A8F; --mand:#F2994A; --mand2:#ffb877;
  --ok:#3ddc97; --bad:#ff6b81;
  --e1:#ff6b81; --e2:#4db8ff; --e3:#3ddc97;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,#2a2f7a 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#3a2350 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:Sora,'Segoe UI',Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.muted{color:var(--muted)}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.panel{background:linear-gradient(180deg,var(--panel),#181d4e);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
.kick{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--mand2)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--mand);color:#241200;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.dang{background:#5a1f33;color:#ffd7de;border:1px solid #8a2e4a}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#10143a;color:var(--ink);outline:none}
input:focus{border-color:var(--mand)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{font-size:34px}
.brand b{display:block;font-size:18px}
.brand span{font-size:13px;color:var(--muted)}
.credit{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.loading{text-align:center;padding:30vh 16px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0b0e2b;border:1px solid var(--line);padding:12px 18px;border-radius:12px;transition:.25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* Equipos */
.team{border-radius:var(--r);padding:18px;border:2px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.team:hover{transform:translateY(-3px)}
.team.sel{border-color:var(--c)}
.team .tn{font-weight:800;font-size:19px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.chip.off{opacity:.45}
.chip .x{margin-left:6px;cursor:pointer;color:var(--bad)}

/* Candados */
.locks{display:flex;gap:8px}
.lk{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#10143a;border:1px solid var(--line);position:relative}
.lk.on{border-color:var(--mand);box-shadow:0 0 0 3px rgba(242,153,74,.25)}
.lk.ok{background:rgba(61,220,151,.14);border-color:var(--ok)}
.lk small{position:absolute;bottom:-1px;right:4px;font-size:10px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.clock{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;letter-spacing:1px}
.clock.extra{color:var(--bad)}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08)}

/* Sala */
.sala{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.sala{grid-template-columns:1fr}}
.sala h2{font-size:clamp(24px,3.4vw,34px)}
.story{font-size:16px;color:#d9dcff;border-left:3px solid var(--mand);padding:4px 0 4px 14px;margin:12px 0 16px}
.mision{background:#10143a;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mision p{margin:.3em 0}
.preg{margin-top:16px;font-size:18px;font-weight:700}
.code{display:flex;gap:10px;margin-top:10px}
.code input{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:1px}
.code .btn{white-space:nowrap}
.code input::placeholder{font-family:Sora,'Segoe UI',sans-serif;font-size:16px;letter-spacing:0}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.msg{min-height:24px;margin-top:8px;font-weight:600}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.file{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#10143a;border:1px solid var(--line);margin-bottom:10px;text-decoration:none;color:var(--ink)}
.file:hover{border-color:var(--mand)}
.file .fi{font-size:26px}
.file b{display:block;font-size:15px;word-break:break-word}
.file span{font-size:13px;color:var(--muted)}
.file.new{animation:glow 2s ease-out 3}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(242,153,74,.7)}100%{box-shadow:0 0 0 14px rgba(242,153,74,0)}}
.pista{background:rgba(242,153,74,.09);border:1px dashed rgba(242,153,74,.55);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.side h3{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--mand2);margin:4px 0 10px}
.side .blk{margin-bottom:18px}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(5,7,25,.86);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ov .card{text-align:center;max-width:640px}
.ov .big{font-size:clamp(60px,12vw,120px);line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.ov h2{font-size:clamp(28px,5vw,48px)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Pantalla */
.scr{padding:22px 28px;max-width:none}
.scr .head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
.scr .title{font-size:clamp(26px,3vw,44px);font-weight:800}
.scr .clock{font-size:clamp(44px,6vw,86px)}
.lanes{display:grid;gap:16px}
.lane{display:grid;grid-template-columns:260px 1fr 190px;gap:18px;align-items:center;background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r);padding:16px 20px}
.lane .nm{font-size:26px;font-weight:800;color:var(--c)}
.lane .doors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.door{height:92px;border-radius:14px;background:#10143a;border:2px solid var(--line);display:grid;place-items:center;font-size:40px;position:relative}
.door.ok{background:rgba(61,220,151,.14);border-color:var(--ok)}
.door.on{border-color:var(--c);box-shadow:0 0 22px -4px var(--c)}
.door.on::after{content:'';position:absolute;inset:-2px;border-radius:14px;border:2px solid var(--c);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.door small{position:absolute;top:6px;left:9px;font-size:13px;color:var(--muted);font-weight:700}
.door .t{position:absolute;bottom:5px;font-size:12px;color:var(--ok);font-family:'JetBrains Mono',monospace}
.lane .st{text-align:right}
.lane .st b{font-size:24px;display:block}
.feed{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.feed .ev{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:15px}
.join{display:flex;gap:16px;align-items:center;background:#fff;color:#111;border-radius:14px;padding:10px 14px}
.join #qr img,.join #qr canvas{display:block;width:96px;height:96px}
.join b{display:block;font-size:13px}
.join span{font-size:12px;word-break:break-all;max-width:260px;display:block}
@media (max-width:1000px){.lane{grid-template-columns:1fr}.lane .st{text-align:left}.door{height:70px;font-size:30px}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin-top:30px}
.pd{width:240px;text-align:center}
.pd .base{border-radius:14px 14px 0 0;background:linear-gradient(180deg,var(--c),rgba(0,0,0,.2));display:grid;place-items:center;font-size:54px;font-weight:800;color:#0d1030}
.pd .nm{font-size:24px;font-weight:800;color:var(--c);margin-bottom:6px}

/* Profesor */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}
.sep{height:1px;background:var(--line);margin:18px 0}
.links a{color:var(--mand2);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Felicitación */
.cert{position:relative;max-width:860px;margin:0 auto;border-radius:22px;padding:34px 34px 26px;text-align:center;overflow:hidden;
  background:radial-gradient(600px 300px at 50% -10%,rgba(242,153,74,.28),transparent 70%),linear-gradient(180deg,#1f2668,#151a4a);border:2px solid var(--mand);box-shadow:0 0 0 6px rgba(242,153,74,.12),0 30px 60px rgba(0,0,0,.35)}
.cert .seal{font-size:64px;line-height:1;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.cert .fel{font-size:clamp(30px,5vw,50px);font-weight:800;margin:10px 0 2px;line-height:1.1}
.cert .nom{font-size:clamp(28px,5vw,46px);font-weight:800;color:var(--mand2);margin:2px 0 8px;word-break:break-word}
.cert .lead{font-size:18px;color:#d9dcff;max-width:640px;margin:0 auto 18px}
.cert .datos{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cert .datos span{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px}
.cert .hall{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
@media (max-width:640px){.cert .hall{grid-template-columns:1fr}.cert{padding:26px 18px 20px}}
.cert .hall div{background:#10143a;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.cert .hall b{display:block;color:var(--ok);font-family:'JetBrains Mono',monospace;font-size:15px}
.cert .pie{margin-top:16px;font-size:13px;color:var(--muted)}
.foto{max-width:860px;margin:16px auto 0;text-align:center;background:rgba(61,220,151,.1);border:1px dashed var(--ok);border-radius:14px;padding:12px 16px;font-size:16px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.jr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.jr .mini{font-size:15px;letter-spacing:2px;white-space:nowrap}
.scr .panel h3{font-size:18px}
table.t td{font-size:16px}
.musbtn{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:99px;border:1px solid var(--mand);background:rgba(13,16,48,.92);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.musbtn .mi{font-size:20px;line-height:1}
.musbtn.off{border-color:var(--bad);animation:llama 1.8s ease-in-out infinite}
@keyframes llama{50%{box-shadow:0 0 0 8px rgba(255,107,129,.18)}}
.wrap{padding-bottom:84px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
</style>

  <p>5. Al abrir el último candado aparecerá una <b>felicitación con tu nombre</b>: tómale una captura de pantalla y envíasela a tu facilitador.</p>
  <p>🎧 El juego tiene música de suspenso y efectos de sonido. Si necesitas silencio, usa el botón 🔊 de abajo a la derecha (o la tecla M).</p></div>
  <form id="fIni" style="margin-top:18px" autocomplete="off"><label class="lbl" for="nm">Tu nombre completo (así aparecerá en la felicitación)</label>
  <div class="code" style="margin-top:0"><input id="nm" type="text" maxlength="50" placeholder="Nombre y apellido"><button class="btn">🔓 Empezar</button></div></form></div>
  ${credito}</div>`;
  $('#fIni').onsubmit = ev => { ev.preventDefault(); const n = $('#nm').value.trim().replace(/\s+/g,' ');
    if (n.length < 3) { toast('Escribe tu nombre completo.'); $('#nm').focus(); return; }
    ac(); SFX.inicio(); G = { nombre:n, inicio:Date.now(), sala:1, res:{}, resp:{}, tok:{}, pistas:{}, intentos:0, fin:null, noCuenta: lsGet('escapeM6_terminado') === '1' }; guardar(); render(); MUS.duck(); };
}

function filesHtml(nuevo){
  let h = `<a class="file" href="${ARCH1.ruta}" download><span class="fi">${ARCH1.ico}</span><div><b>${ARCH1.nombre}</b><span>${ARCH1.desc}</span></div></a>`;
  [3,4,5].forEach(n => { const t = G.tok[n]; h += t ? `<a class="file ${nuevo === n ? 'new' : ''}" href="${urlArch(n, t)}" download><span class="fi">${ARCHS[n].ico}</span><div><b>${ARCHS[n].nombre}</b><span>${ARCHS[n].desc}</span></div></a>`
    : `<div class="file" style="opacity:.45"><span class="fi">🔒</span><div><b>Archivo bloqueado</b><span>Se abre con el candado ${n-1}</span></div></div>`; });
  return h;
}
function pistasHtml(n){
  const usadas = G.pistas[n] || 0, s = SALAS[n-1];
  let h = s.pis.slice(0, usadas).map((p,i) => `<div class="pista"><b>Pista ${i+1}.</b> ${p}</div>`).join('');
  h += usadas < s.pis.length ? `<button class="btn sec sm" id="verPista" style="margin-top:${usadas ? 12 : 0}px">💡 Ver la pista ${usadas+1}</button>`
    : '<p class="muted" style="font-size:14px;margin:10px 0 0">Ya usaste las dos pistas de este candado.</p>';
  return h;
}
function vistaSala(nuevo){
  const n = G.sala, s = SALAS[n-1];
  MUS.want(n);
  $('#app').innerHTML = `<div class="wrap">${cabecera()}
  <div class="hud"><div class="locks">${[1,2,3,4,5].map(i => `<div class="lk ${i < n ? 'ok' : i === n ? 'on' : ''}">${i < n ? '🔓' : '🔒'}<small>${i}</small></div>`).join('')}</div>
  <div style="text-align:right"><div class="clock" id="clk">00:00</div><div class="muted" style="font-size:13px">Tu tiempo</div></div></div>
  <div class="sala">
    <div class="panel">
      <div class="kick">Candado ${n} de 5</div><h2>${s.ico} ${s.t}.</h2>
      <p class="story">${s.h}</p>
      <div class="mision">${s.m}</div>
      <div class="preg">🔑 ${s.p}</div>
      <form class="code" id="frm" autocomplete="off"><input id="cod" type="text" inputmode="decimal" placeholder="Escribe el número" aria-label="Código del candado"><button class="btn" id="abrir">Abrir</button></form>
      <div class="msg" id="msg"></div>
    </div>
    <div class="side">
      <div class="panel blk"><h3>Archivos de la bóveda</h3>${filesHtml(nuevo)}</div>
      <div class="panel blk"><h3>Pistas</h3><div id="pistas">${pistasHtml(n)}</div></div>
    </div>
  </div>
  <p class="credit">Juego creado por: Jarlin Figueroa, M.A. · <button class="linkbtn" id="reini">Empezar de nuevo</button></p></div>`;
  enlazarPista(n);
  $('#reini').onclick = reiniciar;
  let cool = 0;
  $('#frm').onsubmit = async ev => {
    ev.preventDefault(); const inp = $('#cod'), msg = $('#msg'), f = $('#frm');
    if (Date.now() < cool) { msg.className = 'msg bad'; msg.textContent = 'Espera un momento antes de intentar otra vez.'; return; }
    const v = norm(inp.value); if (!v) { msg.className = 'msg bad'; msg.textContent = 'Escribe un número.'; return; }
    if (await sha('m6esc|' + n + '|' + v) !== CRYPTO.h[n-1]) {
      G.intentos++; guardar(); SFX.err(); cool = Date.now() + 3000;
      msg.className = 'msg bad'; msg.textContent = '✖ Ese no es el código. Revisa tus pasos en Power Query.';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); inp.select(); return;
    }
    const tok = await revelar(n, v);
    G.res[n] = Date.now() - G.inicio; G.resp[n] = Number(v); if (tok) G.tok[n+1] = tok;
    if (n === 5) { G.fin = Date.now(); guardar(); lsSet('escapeM6_terminado','1'); MUS.duck(); SFX.fan(); confeti(6000);
      G.lugar = await miLugar(); guardar(); vistaFelicitacion(true); return; }
    G.sala = n + 1; guardar(); MUS.duck(); SFX.unlock(); confeti(2000); vistaSala(tok ? n + 1 : null); celebrar(n, tok ? n + 1 : null);
  };
  $('#cod').focus();
}
function enlazarPista(n){
  const b = $('#verPista'); if (!b) return;
  b.onclick = () => { G.pistas[n] = (G.pistas[n] || 0) + 1; guardar(); SFX.pista(); $('#pistas').innerHTML = pistasHtml(n); enlazarPista(n); };
}
function celebrar(n, arch){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card"><div class="big">🔓</div><h2>¡Candado ${n} abierto!</h2><p class="muted" style="font-size:18px">${arch ? 'Se desbloqueó un archivo nuevo: <b>' + esc(ARCHS[arch].nombre) + '</b>.' : 'Pasa a la siguiente sala.'}</p><button class="btn" style="margin-top:14px">Continuar</button></div>`;
  document.body.appendChild(ov);
  const cerrar = () => { ov.remove(); const c = $('#cod'); if (c) c.focus(); }; ov.querySelector('button').onclick = cerrar; setTimeout(cerrar, 4500);
}
function vistaFelicitacion(recien){
  MUS.want(6);
  const total = G.fin - G.inicio, pistas = Object.values(G.pistas).reduce((a,b) => a + b, 0);
  $('#app').innerHTML = `<div class="wrap">
  <div class="cert" id="cert">
    <div class="kick">Escape room · Módulo 6 · Power Query</div>
    <div class="seal" style="margin-top:12px">🏆</div>
    <div class="fel">¡Felicidades,</div>
    <div class="nom">${esc(G.nombre)}!</div>
    <p class="lead">Abriste los <b>cinco candados</b> de la bóveda de Farmacias Brisa Verde: uniste y analizaste los datos con Power Query, y el informe llegó a tiempo a la junta.</p>
    <div class="datos"><span>📅 ${fechaLarga(G.fin)}</span><span>⏱️ Tiempo: <b class="mono">${hms(total)}</b></span><span>💡 Pistas: <b>${pistas}</b></span><span>✖ Intentos fallidos: <b>${G.intentos}</b></span>${G.lugar ? `<span style="border-color:var(--mand);color:var(--mand2)">🏅 Lugar <b>${G.lugar.lugar}</b> entre ${G.lugar.de} que han terminado</span>` : ''}</div>
    <div class="hall">${RESUMEN.map((r,i) => `<div>✅ ${r}<b>${rd(G.resp[i+1])}</b></div>`).join('')}</div>
    <p class="pie">Excel Avanzado · Juego creado por: Jarlin Figueroa, M.A.</p>
  </div>
  <div class="foto">📸 <b>Toma una captura de pantalla</b> de esta felicitación y envíasela a tu facilitador.</div>
  <p style="text-align:center"><button class="linkbtn" id="reini">Jugar otra vez</button></p></div>`;
  $('#reini').onclick = reiniciar;
  if (!recien) setTimeout(() => confeti(2500), 300);
}
function reiniciar(){
  if (!confirm('¿Empezar de nuevo? Se borra tu avance en este navegador.')) return;
  try { localStorage.removeItem(KEY); } catch(e) {} G = null; render();
}
/* =============== PANTALLA DEL FACILITADOR (?modo=profesor) =============== */
let J = {}, sonidoProf = false, profIni = 0, vistos = null;
function vistaProfesor(){
  if (lsGet('escapeM6_prof') !== CLAVE) {
    $('#app').innerHTML = `<div class="wrap">${cabecera()}<div class="panel" style="max-width:420px;margin:10vh auto"><h2>Pantalla del facilitador.</h2><p class="muted">Escribe la clave para ver el ranking.</p>
      <form id="fc" class="code"><input id="clave" type="password" placeholder="Clave"><button class="btn">Entrar</button></form></div></div>`;
    $('#fc').onsubmit = ev => { ev.preventDefault(); if ($('#clave').value === CLAVE) { lsSet('escapeM6_prof', CLAVE); vistaProfesor(); } else toast('Clave incorrecta.'); };
    return;
  }
  $('#app').innerHTML = `<div class="wrap scr">
    <div class="head"><div><div class="kick">Escape room · Módulo 6 · Ranking en vivo</div><div class="title">🔐 La bóveda de Brisa Verde</div></div>
    <div class="row"><div class="tag" id="cuenta"></div></div></div>
    <div id="podio"></div>
    <div class="grid2">
      <div class="panel"><h3>🏁 Terminaron</h3><div id="tabla"></div></div>
      <div class="panel"><h3>🎮 Jugando ahora</h3><div id="jugando"></div></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <div class="ctl"><button class="btn sec sm" id="snd">🔇 Activar el sonido</button><button class="btn sec sm" id="csv">⬇ Descargar CSV</button><button class="btn dang sm" id="rei">↺ Reiniciar ranking</button><button class="btn sec sm" id="sal">Salir</button></div>
      <span class="muted" style="font-size:14px">Enlace para los estudiantes: <b>${esc(location.href.split('?')[0])}</b></span></div>
    <p class="credit">Juego creado por: Jarlin Figueroa, M.A.</p></div>`;
  $('#snd').onclick = () => { sonidoProf = !sonidoProf; ac(); $('#snd').textContent = sonidoProf ? '🔊 Sonido activo' : '🔇 Activar el sonido'; if (sonidoProf) SFX.pista(); };
  $('#sal').onclick = () => { lsSet('escapeM6_prof',''); location.reload(); };
  $('#csv').onclick = () => {
    const filas = [['Lugar','Nombre','Estado','Candados abiertos','Tiempo','Pistas','Tiempo con pistas','Intentos fallidos','Terminó']];
    ordenados().forEach((j,i) => filas.push([j.fin != null ? i+1 : '', j.nombre, j.fin != null ? 'Terminó' : 'Jugando', Math.min(5,(j.sala||1)-1), j.fin != null ? hms(j.fin-j.inicio) : '', j.pistas||0, j.fin != null ? hms(totalRank(j)) : '', j.intentos||0, j.fin != null ? fechaLarga(j.fin) : '']));
    const csv = '﻿' + filas.map(f => f.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' })); a.download = 'Ranking-Escape-Room-Modulo6.csv'; a.click();
  };
  $('#rei').onclick = () => { if (confirm('¿Borrar el ranking completo? Esta acción no se puede deshacer.')) window.DB_READY.ref(ROOT + '/jugadores').remove(); };
  if (!window.DB_READY) { $('#tabla').innerHTML = '<p class="muted">Conectando…</p>'; return; }
  profIni = Date.now();
  window.DB_READY.ref(ROOT + '/jugadores').on('value', s => { J = s.val() || {}; pintarRanking(); });
}
function ordenados(){
  return Object.keys(J).map(k => Object.assign({ id:k }, J[k])).sort((a,b) => (a.fin != null) !== (b.fin != null) ? (a.fin != null ? -1 : 1)
    : a.fin != null ? totalRank(a) - totalRank(b) : (b.sala||1) - (a.sala||1) || a.inicio - b.inicio);
}
function pintarRanking(){
  const L = ordenados(), fin = L.filter(j => j.fin != null), jug = L.filter(j => j.fin == null);
  $('#cuenta').textContent = `🏁 ${fin.length} terminaron · 🎮 ${jug.length} jugando`;
  const med = ['🥇','🥈','🥉'], alto = [200,150,110], orden = [1,0,2].filter(i => fin[i]);
  $('#podio').innerHTML = fin.length ? `<div class="podium" style="margin:0 0 22px">${orden.map(i => `<div class="pd" style="--c:${['#F2994A','#a9b4ff','#d08a5a'][i]}">
      <div class="nm" style="font-size:${i ? 22 : 28}px">${med[i]} ${esc(fin[i].nombre)}</div><div class="muted mono" style="margin-bottom:8px">${hms(totalRank(fin[i]))}</div>
      <div class="base" style="height:${alto[i]}px">${i+1}</div></div>`).join('')}</div>`
    : `<div class="panel" style="text-align:center;margin-bottom:18px"><div style="font-size:54px">⏳</div><h2>Todavía nadie ha abierto la bóveda.</h2><p class="muted">El primero en terminar aparecerá aquí en primer lugar.</p></div>`;
  $('#tabla').innerHTML = fin.length ? `<table class="t"><thead><tr><th>#</th><th>Nombre</th><th>Tiempo</th><th>Pistas</th><th>Total</th></tr></thead><tbody>${fin.map((j,i) =>
    `<tr${i === 0 ? ' style="color:var(--mand2);font-weight:700"' : ''}><td>${i < 3 ? med[i] : i+1}</td><td>${esc(j.nombre)}</td><td class="mono">${hms(j.fin - j.inicio)}</td><td>${j.pistas||0}</td><td class="mono"><b>${hms(totalRank(j))}</b></td></tr>`).join('')}</tbody></table>`
    : '<p class="muted">Aún no hay estudiantes que hayan terminado.</p>';
  $('#jugando').innerHTML = jug.length ? jug.map(j => `<div class="jr"><span>${esc(j.nombre)}</span><span class="mini">${[1,2,3,4,5].map(i => i < (j.sala||1) ? '🔓' : '🔒').join('')}</span></div>`).join('')
    : '<p class="muted">Nadie está jugando en este momento.</p>';
  /* aviso cuando alguien termina */
  const ya = new Set(fin.map(j => j.id));
  if (vistos) fin.forEach((j,i) => { if (!vistos.has(j.id)) avisoFin(j, i+1); });
  vistos = ya;
}
function avisoFin(j, lugar){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card"><div class="big">${lugar === 1 ? '🥇' : lugar === 2 ? '🥈' : lugar === 3 ? '🥉' : '🏆'}</div><h2 style="color:var(--mand2)">${esc(j.nombre)}</h2><p style="font-size:clamp(22px,3vw,32px);margin:0">¡abrió la bóveda! ${lugar === 1 ? '<b>Primer lugar</b>' : 'Lugar ' + lugar}</p><p class="muted mono" style="font-size:20px">${hms(totalRank(j))}</p></div>`;
  document.body.appendChild(ov); setTimeout(() => ov.remove(), 5500);
  confeti(4000); if (sonidoProf) SFX.fan();
}

setInterval(() => { const c = $('#clk'); if (c && G && G.fin == null) c.textContent = hms(Date.now() - G.inicio); }, 500);
window.addEventListener('fb-ready', () => { if (MODO === 'profesor') vistaProfesor(); else subir(); });
if (MODO === 'profesor') vistaProfesor(); else render();
</script>
</body>
</html>
