<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape room · La bóveda de Brisa Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1030; --bg2:#151a45; --panel:#1b2157; --panel2:#232a6b; --line:#343c86;
  --ink:#eef0ff; --muted:#a9afd9; --indigo:#2F3A8F; --mand:#F2994A; --mand2:#ffb877;
  --ok:#3ddc97; --bad:#ff6b81;
  --e1:#ff6b81; --e2:#4db8ff; --e3:#3ddc97;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,#2a2f7a 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#3a2350 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:Sora,'Segoe UI',Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.muted{color:var(--muted)}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.panel{background:linear-gradient(180deg,var(--panel),#181d4e);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
.kick{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--mand2)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--mand);color:#241200;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.dang{background:#5a1f33;color:#ffd7de;border:1px solid #8a2e4a}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#10143a;color:var(--ink);outline:none}
input:focus{border-color:var(--mand)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{font-size:34px}
.brand b{display:block;font-size:18px}
.brand span{font-size:13px;color:var(--muted)}
.credit{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.loading{text-align:center;padding:30vh 16px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0b0e2b;border:1px solid var(--line);padding:12px 18px;border-radius:12px;transition:.25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* Equipos */
.team{border-radius:var(--r);padding:18px;border:2px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.team:hover{transform:translateY(-3px)}
.team.sel{border-color:var(--c)}
.team .tn{font-weight:800;font-size:19px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.chip.off{opacity:.45}
.chip .x{margin-left:6px;cursor:pointer;color:var(--bad)}

/* Candados */
.locks{display:flex;gap:8px}
.lk{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#10143a;border:1px solid var(--line);position:relative}
.lk.on{border-color:var(--mand);box-shadow:0 0 0 3px rgba(242,153,74,.25)}
.lk.ok{background:rgba(61,220,151,.14);border-color:var(--ok)}
.lk small{position:absolute;bottom:-1px;right:4px;font-size:10px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.clock{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;letter-spacing:1px}
.clock.extra{color:var(--bad)}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08)}

/* Sala */
.sala{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.sala{grid-template-columns:1fr}}
.sala h2{font-size:clamp(24px,3.4vw,34px)}
.story{font-size:16px;color:#d9dcff;border-left:3px solid var(--mand);padding:4px 0 4px 14px;margin:12px 0 16px}
.mision{background:#10143a;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mision p{margin:.3em 0}
.preg{margin-top:16px;font-size:18px;font-weight:700}
.code{display:flex;gap:10px;margin-top:10px}
.code input{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:1px}
.code .btn{white-space:nowrap}
.code input::placeholder{font-family:Sora,'Segoe UI',sans-serif;font-size:16px;letter-spacing:0}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.msg{min-height:24px;margin-top:8px;font-weight:600}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.file{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#10143a;border:1px solid var(--line);margin-bottom:10px;text-decoration:none;color:var(--ink)}
.file:hover{border-color:var(--mand)}
.file .fi{font-size:26px}
.file b{display:block;font-size:15px;word-break:break-word}
.file span{font-size:13px;color:var(--muted)}
.file.new{animation:glow 2s ease-out 3}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(242,153,74,.7)}100%{box-shadow:0 0 0 14px rgba(242,153,74,0)}}
.pista{background:rgba(242,153,74,.09);border:1px dashed rgba(242,153,74,.55);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.side h3{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--mand2);margin:4px 0 10px}
.side .blk{margin-bottom:18px}

.ov{position:fixed;inset:0;background:rgba(5,7,25,.86);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ov .card{text-align:center;max-width:640px}
.ov .big{font-size:clamp(60px,12vw,120px);line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.ov h2{font-size:clamp(28px,5vw,48px)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Pantalla */
.scr{padding:22px 28px;max-width:none}
.scr .head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
.scr .title{font-size:clamp(26px,3vw,44px);font-weight:800}
.scr .clock{font-size:clamp(44px,6vw,86px)}
.lanes{display:grid;gap:16px}
.lane{display:grid;grid-template-columns:260px 1fr 190px;gap:18px;align-items:center;background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r);padding:16px 20px}
.lane .nm{font-size:26px;font-weight:800;color:var(--c)}
.lane .doors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.door{height:92px;border-radius:14px;background:#10143a;border:2px solid var(--line);display:grid;place-items:center;font-size:40px;position:relative}
.door.ok{background:rgba(61,220,151,.14);border-color:var(--ok)}
.door.on{border-color:var(--c);box-shadow:0 0 22px -4px var(--c)}
.door.on::after{content:'';position:absolute;inset:-2px;border-radius:14px;border:2px solid var(--c);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.door small{position:absolute;top:6px;left:9px;font-size:13px;color:var(--muted);font-weight:700}
.door .t{position:absolute;bottom:5px;font-size:12px;color:var(--ok);font-family:'JetBrains Mono',monospace}
.lane .st{text-align:right}
.lane .st b{font-size:24px;display:block}
.feed{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.feed .ev{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:15px}
.join{display:flex;gap:16px;align-items:center;background:#fff;color:#111;border-radius:14px;padding:10px 14px}
.join #qr img,.join #qr canvas{display:block;width:96px;height:96px}
.join b{display:block;font-size:13px}
.join span{font-size:12px;word-break:break-all;max-width:260px;display:block}
@media (max-width:1000px){.lane{grid-template-columns:1fr}.lane .st{text-align:left}.door{height:70px;font-size:30px}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin-top:30px}
.pd{width:240px;text-align:center}
.pd .base{border-radius:14px 14px 0 0;background:linear-gradient(180deg,var(--c),rgba(0,0,0,.2));display:grid;place-items:center;font-size:54px;font-weight:800;color:#0d1030}
.pd .nm{font-size:24px;font-weight:800;color:var(--c);margin-bottom:6px}

/* Profesor */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}
.sep{height:1px;background:var(--line);margin:18px 0}
.links a{color:var(--mand2);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function tone(f, d, type, vol, at){ const a = ac(); if (!a || !sonido) return; const t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .18, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); }
const SFX = {
  clic(){ tone(660,.08,'triangle',.08); },
  err(){ tone(140,.32,'sawtooth',.16); tone(110,.4,'square',.08,.08); },
  pista(){ tone(880,.12,'sine',.12); tone(1320,.18,'sine',.1,.1); },
  unlock(){ tone(220,.06,'square',.12); tone(320,.06,'square',.12,.06); [523,659,784,1047].forEach((f,i) => tone(f,.35,'triangle',.16,.16 + i*.09)); },
  fan(){ [523,523,523,659,784,659,784,1047].forEach((f,i) => tone(f, i === 7 ? .9 : .2,'triangle',.18,i*.16)); [262,330,392].forEach(f => tone(f,1.4,'sine',.07,1.1)); },
  join(){ tone(587,.1,'sine',.08); tone(880,.14,'sine',.07,.08); }
};

/* ---------- confeti ---------- */
function confeti(ms){
  const cv = $('#cf'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const col = ['#F2994A','#ffb877','#4db8ff','#3ddc97','#ff6b81','#ffffff'];
  const P = Array.from({length:160}, () => ({ x:Math.random()*cv.width, y:-20 - Math.random()*cv.height*.5, vx:(Math.random()-.5)*3, vy:2 + Math.random()*3.5, r:Math.random()*6.28, vr:(Math.random()-.5)*.25, s:6 + Math.random()*7, c:col[Math.floor(Math.random()*col.length)] }));
  const fin = Date.now() + (ms || 3500);
  (function f(){ cx.clearRect(0,0,cv.width,cv.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
    if (Date.now() < fin) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height); })();
}

const now = () => Date.now() + off;
function transcurrido(){
  const e = S.estado; if (!e.inicio) return 0;
  const ref = e.fase === 'pausa' && e.pausaDesde ? e.pausaDesde : (e.fase === 'fin' && e.finEn ? e.finEn : now());
  return Math.max(0, ref - e.inicio - (e.pausaAcum || 0));
}
const nombreEq = k => (S.equipos[k] && S.equipos[k].nombre) || DEF_NOMBRES[k];
const salaEq = k => (S.equipos[k] && S.equipos[k].sala) || 1;
const pistasEq = k => { const p = (S.equipos[k] && S.equipos[k].pistas) || {}; return Object.values(p).reduce((a,b) => a + (b||0), 0); };
function ranking(){
  return EQS.map(k => { const e = S.equipos[k] || {}, res = e.res || {}, n = Object.keys(res).length, ult = n ? Math.max(...Object.values(res)) : 0;
    return { k, n, fin: e.fin != null ? e.fin + pistasEq(k)*PEN : null, ult: ult + pistasEq(k)*PEN }; })
   .sort((a,b) => (a.fin != null) !== (b.fin != null) ? (a.fin != null ? -1 : 1) : a.fin != null ? a.fin - b.fin : b.n - a.n || a.ult - b.ult);
}

/* ---------- abrir candado (equipo o profesor) ---------- */
async function intentar(k, n, valor, quien){
  const v = norm(valor); if (!v) return { ok:false, vacio:true };
  const h = await sha('m6esc|' + n + '|' + v);
  if (h !== CRYPTO.h[n-1]) { db.ref(ROOT + '/equipos/' + k + '/intentos').transaction(x => (x || 0) + 1); return { ok:false }; }
  const tok = await revelar(n, v), t = transcurrido();
  const r = await db.ref(ROOT + '/equipos/' + k).transaction(cur => {
    cur = cur || { nombre: DEF_NOMBRES[k], sala:1 };
    if ((cur.sala || 1) !== n) return;
    cur.sala = n + 1; cur.res = cur.res || {}; cur.res[n] = t; cur.resp = cur.resp || {}; cur.resp[n] = Number(v);
    if (tok) { cur.tok = cur.tok || {}; cur.tok[n+1] = tok; }
    if (n === 5) cur.fin = t;
    return cur;
  });
  if (r.committed) db.ref(ROOT + '/eventos').push({ tipo: n === 5 ? 'fin' : 'candado', eq:k, sala:n, quien: quien || '', t: firebase.database.ServerValue.TIMESTAMP });
  return { ok:true };
}

  return `<div class="wrap scr" style="text-align:center"><div class="kick">Escape room · Resultado final</div><h1 style="font-size:clamp(34px,5vw,64px)">🏆 ¡La bóveda está abierta!</h1>
  <div class="podium">${orden.map(i => { const r = R[i]; return `<div class="pd" style="--c:${COLORES[r.k]}"><div class="nm">${esc(nombreEq(r.k))}</div>
    <div class="muted" style="margin-bottom:8px">${r.fin != null ? '⏱️ ' + mmss(r.fin) + (pistasEq(r.k) ? ` (incluye ${pistasEq(r.k)} pista(s))` : '') : r.n + ' de 5 candados'}</div>
    <div class="base" style="height:${alto[i]}px">${i+1}</div></div>`; }).join('')}</div>
  <p class="muted" style="margin-top:30px">Juego creado por: Jarlin Figueroa, M.A.</p></div>`;
}
function evento(ev){
  if (MODO !== 'pantalla' || !ev || vistos.has(ev.id)) return; vistos.add(ev.id);
  const quien = ev.quien ? ` <span class="muted">(${esc(ev.quien)})</span>` : '';
  const txt = ev.tipo === 'pista' ? `💡 ${esc(nombreEq(ev.eq))} usó una pista en el candado ${ev.sala}` : ev.tipo === 'fin' ? `🏆 ${esc(nombreEq(ev.eq))} abrió la bóveda` : `🔓 ${esc(nombreEq(ev.eq))} abrió el candado ${ev.sala}`;
  const f = $('#feed'); if (f) { f.insertAdjacentHTML('afterbegin', `<span class="ev" style="border-color:${COLORES[ev.eq]}">${txt}${quien}</span>`); while (f.children.length > 8) f.lastChild.remove(); }
  if (ev.t < cargaT - 3000 || ev.tipo === 'pista') { if (ev.tipo === 'pista' && ev.t >= cargaT) SFX.pista(); return; }
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="card"><div class="big">${ev.tipo === 'fin' ? '🏆' : '🔓'}</div><h2 style="color:${COLORES[ev.eq]}">${esc(nombreEq(ev.eq))}</h2><p style="font-size:clamp(22px,3vw,34px);margin:0">${ev.tipo === 'fin' ? '¡abrió los cinco candados!' : 'abrió el candado ' + ev.sala}</p></div>`;
  document.body.appendChild(ov); setTimeout(() => ov.remove(), ev.tipo === 'fin' ? 5000 : 3000);
  if (ev.tipo === 'fin') { SFX.fan(); confeti(5000); } else { SFX.unlock(); confeti(1600); }
}

/* =============== PROFESOR =============== */
let profOk = lsGet('escM6_prof') === CLAVE, profPintado = false;
function renderT(){
  const app = $('#app');
  if (!profOk) {
    if (!$('#clave')) { app.innerHTML = `<div class="wrap">${cabecera()}<div class="panel" style="max-width:420px;margin:10vh auto"><h2>Panel del facilitador.</h2><p class="muted">Escribe la clave para entrar.</p><form id="fc" class="code"><input id="clave" type="password" placeholder="Clave"><button class="btn">Entrar</button></form></div></div>`;
      $('#fc').onsubmit = ev => { ev.preventDefault(); if ($('#clave').value === CLAVE) { profOk = true; lsSet('escM6_prof', CLAVE); renderT(); } else toast('Clave incorrecta.'); }; }
    return;
  }
  if (!profPintado) {
    profPintado = true;
    app.innerHTML = `<div class="wrap">${cabecera('<span class="tag">Panel del facilitador</span>')}
    <div class="panel" style="margin-bottom:16px">
      <div class="hud" style="margin:0"><div><div class="kick">Estado</div><h2 id="fase" style="margin:0"></h2></div><div style="text-align:right"><div class="clock" id="clk"></div><div class="muted" id="clkLbl" style="font-size:13px"></div></div></div>
      <div class="sep"></div>
      <div class="ctl"><button class="btn" id="bIni">▶ Abrir la bóveda (iniciar)</button><button class="btn sec" id="bPau">⏸ Pausar</button><button class="btn sec" id="bFin">🏁 Terminar y mostrar podio</button></div>
      <div class="sep"></div>
      <div class="row" style="align-items:flex-end">
        ${EQS.map(k => `<div style="flex:1;min-width:180px"><label class="lbl">Nombre ${k.slice(1)}</label><input type="text" id="n_${k}" maxlength="30"></div>`).join('')}
        <div style="width:120px"><label class="lbl">Duración (min)</label><input type="number" id="dur" min="10" max="240"></div>
        <button class="btn sec" id="bGuardar">Guardar</button>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px;overflow-x:auto"><h3>Avance de los equipos</h3><table class="t"><thead><tr><th>Equipo</th><th>Integrantes</th><th>Candado</th><th>Tiempos</th><th>Pistas</th><th>Fallos</th><th>Abrir por el equipo</th></tr></thead><tbody id="tb"></tbody></table>
    <p class="muted" style="font-size:13px;margin:10px 0 0">«Abrir por el equipo»: si un equipo tiene un problema técnico, escribe aquí el código del candado actual (está en el solucionario).</p></div>
    <div class="panel"><h3>Enlaces</h3><div class="links"><p>Participantes: <a href="${baseUrl()}" target="_blank">${esc(baseUrl())}</a></p><p>Pantalla proyectada: <a href="${baseUrl()}?modo=pantalla" target="_blank">${esc(baseUrl())}?modo=pantalla</a></p></div>
    <div class="sep"></div><div class="ctl"><button class="btn dang" id="bRei">↺ Reiniciar progreso (mantener equipos)</button><button class="btn dang" id="bTodo">🗑 Reiniciar todo</button><button class="btn sec" id="bSal">Salir del panel</button></div></div>
    <p class="credit">Juego creado por: Jarlin Figueroa, M.A.</p></div>`;
    EQS.forEach(k => $('#n_' + k).value = nombreEq(k)); $('#dur').value = S.estado.dur || 90;
    const ts = firebase.database.ServerValue.TIMESTAMP, est = db.ref(ROOT + '/estado');
    $('#bIni').onclick = () => { const e = S.estado; if (e.fase === 'juego') return toast('El juego ya está en marcha.');
      if (e.fase === 'pausa') return toast('Usa «Reanudar».');
      if (e.fase === 'fin' && !confirm('El juego terminó. ¿Iniciar uno nuevo desde cero? Se borra el avance.')) return;
      const up = {}; EQS.forEach(k => up['equipos/' + k] = { nombre: nombreEq(k), sala:1 }); up['eventos'] = null;
      up['estado'] = { fase:'juego', inicio: ts, pausaAcum:0, dur: Number($('#dur').value) || 90 };
      db.ref(ROOT).update(up); toast('¡La bóveda está abierta!'); };
    $('#bPau').onclick = () => { const e = S.estado;
      if (e.fase === 'juego') est.update({ fase:'pausa', pausaDesde: now() });
      else if (e.fase === 'pausa') est.update({ fase:'juego', pausaAcum: (e.pausaAcum || 0) + (now() - e.pausaDesde), pausaDesde:null }); };
    $('#bFin').onclick = () => { if (!confirm('¿Terminar el juego y mostrar el podio?')) return; const e = S.estado;
      const extra = e.fase === 'pausa' ? now() - e.pausaDesde : 0; est.update({ fase:'fin', finEn: now(), pausaAcum: (e.pausaAcum || 0) + extra, pausaDesde:null }); };
    $('#bGuardar').onclick = () => { const up = {}; EQS.forEach(k => up['equipos/' + k + '/nombre'] = $('#n_' + k).value.trim() || DEF_NOMBRES[k]); up['estado/dur'] = Number($('#dur').value) || 90; db.ref(ROOT).update(up); toast('Guardado.'); };
    $('#bRei').onclick = () => { if (!confirm('¿Reiniciar el avance? Los integrantes siguen en sus equipos.')) return;
      const up = { estado:{ fase:'espera', dur: S.estado.dur || 90 }, eventos:null }; EQS.forEach(k => up['equipos/' + k] = { nombre: nombreEq(k), sala:1 }); db.ref(ROOT).update(up); };
    $('#bTodo').onclick = () => { if (!confirm('¿Borrar TODO (equipos, integrantes y avance)?')) return; db.ref(ROOT).set({ estado:{ fase:'espera', dur:90 } }); };
    $('#bSal').onclick = () => { lsSet('escM6_prof',''); location.reload(); };
    $('#tb').addEventListener('click', ev => { const x = ev.target.closest('[data-quitar]'); if (x) { const [k,u] = x.dataset.quitar.split('|'); if (confirm('¿Quitar a este integrante?')) db.ref(ROOT + '/miembros/' + k + '/' + u).remove(); }
      const b = ev.target.closest('[data-abrir]'); if (b) { const k = b.dataset.abrir, inp = $('#c_' + k); intentar(k, salaEq(k), inp.value, 'Facilitador').then(r => { toast(r.ok ? 'Candado abierto.' : 'Ese código no corresponde al candado actual.'); if (r.ok) inp.value = ''; }); } });
  }
  const e = S.estado, F = { espera:'⏳ En espera', juego:'▶ En juego', pausa:'⏸ En pausa', fin:'🏁 Terminado' };
  $('#fase').textContent = F[e.fase] || e.fase; $('#bPau').textContent = e.fase === 'pausa' ? '▶ Reanudar' : '⏸ Pausar';
  const R = ranking();
  /* conservar lo que el facilitador está escribiendo en «Abrir por el equipo» */
  const guard = {}, foco = document.activeElement && document.activeElement.id;
  EQS.forEach(k => { const i = $('#c_' + k); if (i) guard[k] = i.value; });
  $('#tb').innerHTML = EQS.map(k => { const q = S.equipos[k] || {}, res = q.res || {}, pis = q.pistas || {};
    return `<tr><td><b style="color:${COLORES[k]}">${esc(nombreEq(k))}</b><div class="muted" style="font-size:12px">Lugar ${R.findIndex(r => r.k === k) + 1}</div></td><td><div class="chips" style="margin:0">${chipsEq(k, true)}</div></td>
      <td>${q.fin != null ? '🏆 Terminó' : salaEq(k) + ' de 5'}</td>
      <td class="mono" style="font-size:12px">${[1,2,3,4,5].map(i => res[i] != null ? i + ': ' + mmss(res[i]) : '').filter(Boolean).join('<br>') || '—'}</td>
      <td>${pistasEq(k)}${Object.keys(pis).length ? '<div class="muted" style="font-size:12px">' + Object.keys(pis).map(s => 'C' + s + ': ' + pis[s]).join(' · ') + '</div>' : ''}</td><td>${q.intentos || 0}</td>
      <td>${q.fin == null ? `<div class="row" style="flex-wrap:nowrap"><input type="text" id="c_${k}" placeholder="Código" style="width:120px;padding:8px"><button class="btn sm sec" data-abrir="${k}">Abrir</button></div>` : '—'}</td></tr>`; }).join('');
  EQS.forEach(k => { const i = $('#c_' + k); if (i && guard[k]) i.value = guard[k]; });
  if (foco && $('#' + foco)) $('#' + foco).focus();
}

/* =============== arranque =============== */
function render(){ if (MODO === 'pantalla') renderS(); else if (MODO === 'profesor') renderT(); else renderP(); }
function boot(){
  db = window.DB_READY;
  db.ref('.info/serverTimeOffset').on('value', s => off = s.val() || 0);
  let pend = 3; const listo = () => { if (--pend <= 0) { S.listo = true; cargaT = now(); render(); } else if (S.listo) render(); };
  db.ref(ROOT + '/estado').on('value', s => { S.estado = s.val() || { fase:'espera', dur:90 }; S.listo ? render() : listo(); });
  db.ref(ROOT + '/equipos').on('value', s => { S.equipos = s.val() || {}; S.listo ? render() : listo(); });
  db.ref(ROOT + '/miembros').on('value', s => { const ant = S.miembros; S.miembros = s.val() || {}; S.listo ? render() : listo();
    if (MODO === 'pantalla' && S.listo) { const c = o => EQS.reduce((a,k) => a + Object.keys(o[k] || {}).length, 0); if (c(S.miembros) > c(ant)) SFX.join(); } });
  if (MODO === 'pantalla') db.ref(ROOT + '/eventos').limitToLast(12).on('child_added', s => { const v = s.val(); v.id = s.key; setTimeout(() => evento(v), S.listo ? 0 : 600); });
  if (MODO === 'participante' && ME.eq) presencia();
  setInterval(() => { if (S.listo) relojes(); }, 500);
}
if (MODO === 'pantalla') { const q = document.createElement('script'); q.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  q.onload = () => { const el = $('#qr'); if (el && !el.innerHTML) try { new QRCode(el, { text: baseUrl(), width:96, height:96, correctLevel: QRCode.CorrectLevel.M }); } catch(err) {} };
  document.head.appendChild(q); }
if (window.DB_READY) boot(); else window.addEventListener('fb-ready', boot);
</script>
