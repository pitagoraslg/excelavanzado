<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Práctica adicional · Módulo 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Láminas de 1280×720. Cada paso = «Haga esto» + «Compruebe». Paleta del Módulo 6: índigo + mandarina. */
:root{
  --bg:#e6e5ee; --paper:#f7f6f3; --card:#ffffff; --ink:#2f3a8f; --text:#1f2233; --muted:#5f6275; --line:#e2e0ea; --grid:#cbc8d8;
  --acc:#f2994a; --acc-d:#b8641c; --acc-soft:#fdeedd; --pos:#23826f; --pos-soft:#e2f3f0; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#e7e9f6;
  --xl:#217346; --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace; --win:"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(47,58,143,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:56px 72px 66px;display:none;flex-direction:column;gap:13px}
.slide.on{display:flex;animation:in .4s ease}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on,.pop,.grow,.draw,.bob{animation:none!important}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:24px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.08;text-wrap:balance}
h2{font-size:33px}
p{margin:0}
b{font-weight:600}
code{font-family:var(--mono);font-size:.9em;background:var(--ink-soft);color:var(--ink);padding:1px 6px;font-weight:600;white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;gap:12px;align-items:center}
.eyebrow .tag{background:var(--ink);color:#fff;padding:3px 10px;font-size:12.5px}
.eyebrow .tag.ok{background:var(--pos)}
.eyebrow .tag.go{background:var(--acc);color:#2a1a00}
.eyebrow .con{margin-left:auto;font-size:11.5px;letter-spacing:.06em;border:1px solid var(--acc);color:var(--acc-d);background:var(--acc-soft);padding:3px 9px}
.lead{font-size:19px;line-height:1.5}
.why{display:flex;gap:12px;align-items:baseline;font-size:16px;color:var(--ink);background:var(--ink-soft);padding:7px 14px}
.why b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.cols{display:grid;grid-template-columns:430px 1fr;gap:30px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:11px;min-width:0}
.note{font-size:14.5px;color:var(--muted);line-height:1.45}
.cap{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tip{border-left:4px solid var(--acc);background:var(--acc-soft);padding:8px 13px;font-size:15px;line-height:1.42}
.warn{border-left:4px solid var(--neg);background:var(--neg-soft);padding:8px 13px;font-size:15px;line-height:1.42}
.q{font-family:var(--serif);font-size:23px;line-height:1.35;color:var(--ink);border-left:4px solid var(--acc);padding-left:18px}

/* Instrucciones numeradas */
.do{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.do li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:16.5px;line-height:1.38}
.do li .h{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.m{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:var(--acc);color:#2a1a00;font-family:var(--mono);font-size:13.5px;font-weight:700;flex:none;box-shadow:0 0 0 2px #fff}
.pin{position:absolute;top:-11px;right:-11px;z-index:2}
.rel{position:relative}
.path{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--win);font-size:13.5px}
.path span{background:var(--card);border:1px solid var(--grid);padding:1px 8px;font-weight:600}
.path i{font-style:normal;color:var(--acc-d);font-weight:700}

/* Cinta de Excel y del editor */
.ribbon{border:1px solid #c6c6c6;background:#fff;font-family:var(--win);font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ribbon .tabsr{display:flex;background:var(--xl);color:#fff}
.ribbon .tabsr span{padding:6px 12px;opacity:.9;display:flex;align-items:center;gap:6px}
.ribbon .tabsr span.on{background:#fff;color:var(--xl);font-weight:700;opacity:1}
.ribbon .groups{display:flex;padding:9px 6px 6px;gap:4px;align-items:stretch}
.ribbon .grp{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:0 10px;border-right:1px solid #e1e1e1;color:#777;font-size:11.5px;gap:5px;text-align:center}
.ribbon .grp .ic{font-size:22px;opacity:.5}
.ribbon .grp.on{color:var(--text)}
.ribbon .bt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 7px;font-size:12.5px;color:var(--text);border:2px solid transparent;text-align:center}
.ribbon .bt.on{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.ribbon .drop{display:flex;gap:6px;padding:0 14px 12px;align-items:flex-start}
.menu{border:1px solid #c6c6c6;box-shadow:0 6px 14px rgba(0,0,0,.16);background:#fff;font-size:13.5px;font-family:var(--win)}
.menu div{padding:6px 16px 6px 11px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.menu div.on{background:#d3e5d9;outline:2px solid var(--acc);outline-offset:-2px;font-weight:600}

/* Editor de Power Query */
.pq{border:1px solid #b9b7c6;background:#fff;font-family:var(--win);font-size:12.5px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(0,0,0,.12);min-height:0}
.pq .bar{background:var(--xl);color:#fff;padding:4px 10px;font-weight:600}
.pq .rib{display:flex;gap:14px;padding:4px 10px;border-bottom:1px solid #d6d4e0;background:#f3f3f6;color:#333}
.pq .rib span.on{border-bottom:2px solid var(--xl);font-weight:600}
.pq .body{display:grid;grid-template-columns:minmax(0,1fr) 205px;min-height:0}
.pq .body.tres{grid-template-columns:128px minmax(0,1fr) 190px}
.pq .qs{border-right:1px solid #d6d4e0;padding:7px 8px;background:#fafafc;display:flex;flex-direction:column;gap:3px}
.pq .qs b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:3px}
.pq .qs span{padding:2px 5px}.pq .qs span.cur{background:#dfe7f7;font-weight:600}
.pq .grid{padding:6px;overflow:hidden}
.pq .grid table{border-collapse:collapse;width:100%}
.pq .grid th{background:#f3f3f6;border:1px solid #dcdae5;padding:3px 6px;text-align:left;font-weight:600;white-space:nowrap}
.pq .grid th.hl{background:#fdeedd;box-shadow:inset 0 -3px 0 var(--acc)}
.pq .grid th i{font-style:normal;color:var(--xl);font-family:var(--mono);font-size:10.5px;margin-right:4px}
.pq .grid td{border:1px solid #ebe9f1;padding:3px 6px;white-space:nowrap}
.pq .grid td.hl{background:#fff8f0}
.pq .grid td.num{text-align:right}
.pq .steps{border-left:1px solid #d6d4e0;padding:7px 9px;display:flex;flex-direction:column;gap:2px;background:#fafafc}
.pq .steps b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:3px}
.pq .steps span{padding:2px 6px;border-radius:2px}
.pq .steps span.cur{background:#dfe7f7;outline:1px solid #9fb3df;font-weight:600}
.pq .st{border-top:1px solid #d6d4e0;background:#f3f3f6;padding:3px 10px;font-size:11.5px;letter-spacing:.03em;font-weight:600;color:#333}
.sp{font-family:var(--mono);background:var(--neg-soft);color:var(--neg);padding:0 2px}

/* Cuadros de diálogo */
.dlg{border:1px solid #9aa3a6;background:#f0f0f0;font-family:var(--win);font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.16);width:100%;align-self:start}
.dlg .t{background:#fff;padding:6px 12px;border-bottom:1px solid #d0d0d0;font-weight:600;display:flex;justify-content:space-between}
.dlg .t span{color:#777;font-weight:400}
.dlg .b{padding:10px 13px 12px;display:flex;flex-direction:column;gap:7px}
.dlg .f{background:#fff;border:1px solid #8f979a;padding:4px 8px;min-height:27px}
.dlg .f.on{border:2px solid var(--acc);background:#fffaf0;font-weight:600}
.dlg .k{display:flex;justify-content:flex-end;gap:8px;margin-top:3px}
.dlg .k span{border:1px solid #8f979a;background:#fdfdfd;padding:3px 13px;text-align:center;position:relative}
.dlg .k span.on{border:2px solid var(--acc);background:var(--acc-soft);font-weight:600}
.dlg .o{display:flex;gap:8px;align-items:center}
.dlg .o i{font-style:normal;display:inline-block;width:14px;height:14px;border:1.5px solid #555;border-radius:50%;flex:none}
.dlg .o i.on{background:radial-gradient(circle,var(--xl) 45%,#fff 50%)}
.dlg .o i.sq{border-radius:2px}
.dlg .o i.sq.on{background:var(--xl)}
.dlg table{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px}
.dlg td,.dlg th{border:1px solid #dcdae5;padding:2px 6px;text-align:left;white-space:nowrap;font-weight:400}
.dlg th{background:#f3f3f6;font-weight:600}
.dlg .hl{background:#fdeedd;box-shadow:inset 0 0 0 2px var(--acc);font-weight:600}
.tree{background:#fff;border:1px solid #8f979a;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.tree span{padding:2px 6px}.tree span.on{background:#cce4f7;outline:2px solid var(--acc);outline-offset:-2px;font-weight:600}

/* Lámina «Compruebe» */
.okbox{border:2px solid var(--pos);background:var(--pos-soft);padding:13px 17px;display:flex;flex-direction:column;gap:8px;align-self:start;width:100%}
.okbox .t{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--pos);font-weight:700;display:flex;align-items:center;gap:10px}
.okbox .t i{font-style:normal;display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--pos);color:#fff;align-items:center;justify-content:center;font-size:16px}
.okbox p{font-size:16.5px;line-height:1.42}
.fixbox{align-self:start;width:100%;border:1px solid var(--grid);background:var(--card);padding:13px 17px;display:flex;flex-direction:column;gap:8px}
.fixbox .t{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--neg);font-weight:700}
.fixbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.fixbox li{display:grid;grid-template-columns:18px 1fr;gap:7px;font-size:14.5px;line-height:1.4}
.fixbox li::before{content:"→";color:var(--neg);font-weight:700}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

table.vals{border-collapse:collapse;width:100%;font-size:15px;background:var(--card);font-variant-numeric:tabular-nums}
table.vals th,table.vals td{border:1px solid var(--line);padding:6px 11px;text-align:left}
table.vals th{background:var(--ink);color:#fff;font-weight:600}
table.vals td.r,table.vals th.r{text-align:right}
table.vals tr.tot td{font-weight:700;background:var(--ink-soft);color:var(--ink)}
table.vals td.bad{background:var(--neg-soft);color:#8f2f1c;font-family:var(--mono);font-size:13.5px}
table.vals td.ok{background:var(--pos-soft)}
.neg{color:var(--neg);font-weight:700}.pos{color:var(--pos);font-weight:700}

/* Introducción */
.cover{justify-content:center;gap:18px}
.cover-logo{position:absolute;top:54px;right:72px;height:96px;width:auto;mix-blend-mode:multiply}
.cover .mod{font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-d)}
.cover h1{font-size:58px;max-width:640px}
.cover .lead{max-width:600px}
.cover .by{font-size:20px;color:var(--muted)} .cover .by b{color:var(--ink);font-weight:600}
.cover-tags{display:flex;gap:10px;flex-wrap:wrap;max-width:640px}
.cover-tags span{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);color:var(--ink);padding:5px 10px;background:var(--card)}
.cover .hint{font-family:var(--mono);font-size:14px;color:var(--muted)}
.cover-art{position:absolute;right:60px;top:186px;width:450px;height:388px}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-origin:left;transform-box:fill-box;animation:grow 1.2s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.etapas{display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr 30px 1fr;gap:6px;align-items:stretch}
.etapas .a{color:var(--acc);font-size:26px;display:flex;align-items:center;justify-content:center}
.et{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ink);padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.et.s{border-top-color:var(--neg)}.et.r{border-top-color:var(--pos)}.et.n{border-top-color:var(--acc)}
.et .v{font-family:var(--serif);font-size:30px;color:var(--ink);font-weight:600;line-height:1.1}
.et .l{font-size:15px;line-height:1.35}
.et small{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mapa{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}
.mapa div{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:11px 14px;font-size:16.5px}
.mapa .n{font-family:var(--serif);font-size:25px;color:var(--acc)}
.mapa b{color:var(--ink)}
.mapa small{font-family:var(--mono);font-size:12.5px;color:var(--acc-d);font-weight:600;text-align:right}
.dlbs{display:flex;flex-direction:column;gap:9px}
.dlbtn{display:flex;align-items:center;gap:13px;text-decoration:none;background:var(--ink);color:#fff;padding:10px 15px}
.dlbtn:hover{background:#232c70}
.dlbtn.alt{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.dlbtn .ic{font-size:21px;line-height:1;color:var(--acc)}
.dlbtn b{display:block;font-size:15.5px}
.dlbtn small{display:block;font-family:var(--mono);font-size:11.5px;opacity:.9;margin-top:1px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:7px 11px;font-size:14.5px}
.file .ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:30px;background:#1d6f42;color:#fff;font-weight:700;font-size:12.5px;border-radius:3px}
.file.dir .ic{background:var(--acc);color:#2a1a00}
.file.new{border:2px dashed var(--acc);background:var(--acc-soft)}
.file small{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Cierre */
.final{background:var(--ink)}
.final h2,.final .eyebrow{color:#fff}
#stage.oscuro .top,#stage.oscuro .bottom{color:#d5d8ef}
#stage.oscuro .btn.primary{background:var(--acc);border-color:var(--acc);color:#2a1a00}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.chk li{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:17.5px;color:#fff;line-height:1.38}
.chk li::before{content:"☐";font-size:22px;line-height:1.1;color:var(--acc)}
.save{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);padding:18px;display:flex;flex-direction:column;gap:11px;color:#fff;font-size:16.5px;line-height:1.42;align-self:start}
.save code{background:rgba(255,255,255,.14);color:#fff;font-size:18px;padding:6px 10px;white-space:normal}
.think{font-family:var(--serif);font-size:21px;line-height:1.4;color:#fff;border-left:4px solid var(--acc);padding-left:16px}
</style>
</head>
<body>
<div id="stage">
  <div class="top"><span id="topL">MÓDULO 6 · PRÁCTICA ADICIONAL.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Cifras comprobadas en Power Query con los reportes publicados (datos ficticios) ---------- */
const fmt = n => "RD$ " + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const POR_ARS = [["ARS Humano",40,689000],["ARS Universal",40,655250],["ARS Primera",40,472300]];
const NUEVA = ["ARS Senasa",40,591650];
const TOT3 = 1816550, TOT4 = 2408200, CON_DUP = 1917400;

/* ---------- Piezas de las láminas ---------- */
const CONC = {1:"Conectarse a una carpeta",2:"Dejar solo filas útiles",3:"Tipos de datos",4:"Cargar el resultado",5:"Actualizar con un clic"};
const con = n => `<span class="con">${CONC[n]}</span>`;
const path = (...a) => `<div class="path">${a.map(x=>`<span>${x}</span>`).join("<i>›</i>")}</div>`;
const doL = (items,st="") => `<ol class="do" style="${st}">${items.map((t,i)=>`<li><span class="m">${i+1}</span><span>${t}</span></li>`).join("")}</ol>`;
const pin = n => `<span class="m pin">${n}</span>`;
const sp = s => String(s).replace(/^ /,'<span class="sp">·</span>').replace(/ $/,'<span class="sp">·</span>');
const ok = (...ps) => `<div class="okbox pop"><span class="t"><i>✓</i>Va bien si…</span>${ps.map(p=>`<p>${p}</p>`).join("")}</div>`;
const fix = (...li) => `<div class="fixbox"><span class="t">✋ ¿Le salió distinto?</span><ul>${li.map(l=>`<li><span>${l}</span></li>`).join("")}</ul></div>`;
const file = (n,s,cl="",ic="X") => `<div class="file ${cl}"><span class="ic">${ic}</span><span>${n}</span><small>${s}</small></div>`;

function pq({cols,rows,steps,cur,st,hl=[],num=[],tab="Inicio",qs}){
  const celdas=r=>r.map((v,j)=>`<td class="${hl.includes(j)?'hl ':''}${num.includes(j)?'num':''}">${sp(v)}</td>`).join("");
  return `<div class="pq"><div class="bar">${qs?qs[0]:"Consolidado"} · Editor de Power Query</div>
  <div class="rib">${["Inicio","Transformar","Agregar columna","Vista"].map(t=>`<span class="${t===tab?'on':''}">${t}</span>`).join("")}</div>
  <div class="body ${qs?'tres':''}">${qs?`<div class="qs"><b>Consultas</b>${qs.map((q,i)=>`<span class="${i===0?'cur':''}">${q}</span>`).join("")}</div>`:""}

const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children];
const SECC=["Introducción",...Array.from({length:5},(_,i)=>"Paso "+(i+1)),"Cierre"];
const INI=SECC.map((_,i)=>S.findIndex(s=>s.t===i));
const dots=document.getElementById("dots");
dots.innerHTML=SECC.map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));

/* Sonido: transición al cambiar de lámina y campanita en las láminas «Compruebe» */
const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m6sonido")!=="0"; }catch(e){}
function ctx(){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); return c; }
function tono(c,f,t0,dur,vol,tipo){ const o=c.createOscillator(), g=c.createGain(); o.type=tipo||"sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }
function sonar(dir){ if(!SND.on||!SND.ready) return; try{ const c=ctx(); if(!c) return;
  const t=c.currentTime+.01, len=.22, b=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate), d=b.getChannelData(0); for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*(1-k/d.length);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.4; f.frequency.setValueAtTime(dir>0?500:2600,t); f.frequency.exponentialRampToValueAtTime(dir>0?2600:500,t+len);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+len); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+len);
  tono(c,dir>0?880:587,t+.06,.25,.06); }catch(e){} }
function exito(nivel){ if(!SND.on||!SND.ready) return; try{ const c=ctx(); if(!c) return; const t=c.currentTime+.18;
  (nivel>1?[523.25,659.25,783.99,1046.5]:[659.25,987.77]).forEach((f,i)=>tono(c,f,t+i*.11,.45,.07,"triangle")); }catch(e){} }
const pintarSnd=()=>{ document.getElementById("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
document.getElementById("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m6sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();

let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i));
  if(cur!==prev){ sonar(cur>prev?1:-1); if(cur>prev && S[cur].ok) exito(S[cur].ok); }
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  document.getElementById("stage").classList.toggle("oscuro",els[cur].classList.contains("final"));
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  document.getElementById("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  document.getElementById("topL").textContent=S[cur].l;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===els.length-1;
  history.replaceState(null,"","#"+(cur+1)); }
document.getElementById("prev").onclick=()=>go(cur-1); document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ if(["ArrowRight","PageDown"].includes(e.key)||e.key===" "){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") document.getElementById("fs").click(); else if(e.key==="m"||e.key==="M") document.getElementById("snd").click(); });

function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); document.getElementById("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
