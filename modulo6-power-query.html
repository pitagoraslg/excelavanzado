<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Módulo 6 · Power Query y consolidación de datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Escenario fijo 1280×720 escalado a la pantalla. Solo teoría. Paleta del Módulo 6: índigo + mandarina. */
:root{
  --bg:#e6e5ee; --paper:#f7f6f3; --card:#ffffff; --ink:#2f3a8f; --text:#1f2233; --muted:#5f6275; --line:#e2e0ea; --grid:#cbc8d8;
  --acc:#f2994a; --acc-d:#b8641c; --acc-soft:#fdeedd; --pos:#2a9d8f; --pos-soft:#e2f3f0; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#e7e9f6;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(47,58,143,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:64px 72px 72px;display:none;flex-direction:column;gap:20px}
.slide.on{display:flex;animation:in .4s ease}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on,.grow,.draw,.bob,.slideR{animation:none!important}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:28px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:18px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);display:flex;gap:14px;align-items:center}
.eyebrow .n{font-family:var(--serif);font-size:30px;letter-spacing:0;color:var(--acc)}
.eyebrow .tag{border:1px solid var(--ink);padding:2px 8px;font-size:12px}
h1{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.02}
h2{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.08;margin:0;color:var(--ink)}
p{margin:0}
.lead{font-size:20px;line-height:1.5}
.analogy{border-left:3px solid var(--acc);padding:4px 0 4px 16px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;color:var(--ink)}
.exl{font-size:15px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
.exl b{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d);margin-bottom:3px}
.path{font-family:var(--mono);font-size:13.5px;background:var(--ink-soft);color:var(--ink);padding:1px 6px}
.cols{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.ex{background:var(--card);border:1px solid var(--grid);display:flex;flex-direction:column;min-height:0}
.ex-h{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
.ex-h span:first-child{color:var(--ink);font-weight:600}
.ex-b{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.ex-c{padding:0 16px 14px;font-size:15px;line-height:1.45}
table.m{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
table.m th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.m td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.m td.r,table.m th.r{text-align:right}
td.bad{background:var(--neg-soft);color:#8f2f1c} td.ok{background:var(--pos-soft)} tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.blank td{background:repeating-linear-gradient(45deg,#f6e7e3,#f6e7e3 6px,#fff 6px,#fff 12px);height:14px}
.sp{font-family:var(--mono);background:var(--neg-soft);color:var(--neg);padding:0 2px}
.mono{font-family:var(--mono);font-size:13px}
.neg{color:var(--neg);font-weight:700}.pos{color:var(--pos);font-weight:700}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);padding:12px 16px;font-size:18px}
.chip i{font-style:normal;font-size:26px}
.flow{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:center;gap:6px}
.flow div{background:var(--paper);border:1.5px solid var(--grid);padding:14px 10px;text-align:center;font-size:14px;line-height:1.35}
.flow div b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.flow .a{color:var(--acc);font-size:26px;border:0;background:none;padding:0}
.flow .s{border-color:var(--acc);background:var(--acc-soft)}.flow .f{border-color:var(--ink);background:var(--ink-soft)}.flow .r{border-color:var(--pos);background:var(--pos-soft)}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:9px 12px;font-size:15px}
.file .ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:34px;background:#1d6f42;color:#fff;font-weight:700;font-size:13px;border-radius:3px}
.file small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.file.new{border:2px dashed var(--acc);background:var(--acc-soft)}
.pq{border:1px solid #b9b7c6;background:#fff;font-family:"Segoe UI",Arial,sans-serif;font-size:12.5px;display:grid;grid-template-rows:auto auto 1fr;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.pq .bar{background:#1d6f42;color:#fff;padding:5px 10px;font-weight:600}
.pq .rib{display:flex;gap:14px;padding:5px 10px;border-bottom:1px solid #d6d4e0;background:#f3f3f6;color:#333}
.pq .rib span:first-child{border-bottom:2px solid #1d6f42;font-weight:600}
.pq .body{display:grid;grid-template-columns:1fr 200px;min-height:0}
.pq .grid{padding:6px;overflow:hidden}
.pq .grid table{border-collapse:collapse;width:100%}
.pq .grid th{background:#f3f3f6;border:1px solid #dcdae5;padding:3px 6px;text-align:left;font-weight:600;white-space:nowrap}
.pq .grid th i{font-style:normal;color:#1d6f42;font-family:var(--mono);font-size:10.5px;margin-right:4px}
.pq .grid td{border:1px solid #ebe9f1;padding:3px 6px;white-space:nowrap}
.pq .steps{border-left:1px solid #d6d4e0;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:#fafafc}
.pq .steps b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:4px}
.pq .steps span{padding:3px 6px;border-radius:2px}
.pq .steps span.cur{background:#dfe7f7;outline:1px solid #9fb3df;font-weight:600}
.slideR{animation:slr .5s ease both}
@keyframes slr{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.dlg{border:1px solid #9aa3a6;background:#f3f3f3;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.dlg .t{background:#fff;padding:7px 12px;border-bottom:1px solid #d0d0d0;font-weight:600}
.dlg .b{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dlg .o{display:flex;gap:8px;align-items:center}
.dlg .o i{font-style:normal;display:inline-block;width:14px;height:14px;border:1.5px solid #555;border-radius:50%}
.dlg .o i.on{background:radial-gradient(circle,#1d6f42 45%,#fff 50%)}
.dlg .o i.sq{border-radius:2px}
.dlg .o i.sq.on{background:#1d6f42}
.dlg .k{display:flex;justify-content:flex-end;gap:8px}.dlg .k span{border:1px solid #9aa3a6;background:#fff;padding:3px 16px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);border-top:2px solid var(--ink)}
.sum>div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.sum .n{font-family:var(--serif);font-size:26px;color:var(--acc)}
.sum p{font-size:16px;color:var(--muted)} .sum code{font-family:var(--mono);font-size:14px;display:block;color:var(--ink);margin-top:3px;font-weight:500}
.idx{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.idx button{all:unset;cursor:pointer;padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.idx button:nth-child(4n){border-right:0}
.idx button:hover{background:var(--card)}
.idx .n{font-family:var(--serif);font-size:38px;color:var(--acc);line-height:1}
.idx .k{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:500}
.idx .d{font-size:15px}
.idx button.res{background:var(--ink);color:#fff}.idx button.res .k,.idx button.res .d,.idx button.res .n{color:#fff}
.refs{list-style:none;margin:0;padding:12px 0 0;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:8px}
.refs li{font-size:14.5px;line-height:1.42;padding-left:36px;text-indent:-36px}
.refs a{color:var(--ink);word-break:break-all;text-decoration:none}
.note{font-size:15px;color:var(--muted)}
.dl{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:auto}
.dlbs{display:flex;gap:10px;flex:none}
.dlbtn{display:flex;align-items:center;gap:12px;flex:none;text-decoration:none;background:var(--ink);color:#fff;padding:10px 16px;border:1px solid var(--ink)}
.dlbtn:hover{background:#232c70}
.dlbtn.alt{background:var(--card);color:var(--ink)}
.dlbtn .ic{font-size:22px;line-height:1;color:var(--acc)}
.dlbtn b{display:block;font-size:15px;font-weight:600}
.dlbtn small{display:block;font-family:var(--mono);font-size:11px;opacity:.9;margin-top:2px}
.pts{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.pts div{display:grid;grid-template-columns:215px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.45}
.pts b{color:var(--ink);font-size:15.5px}
/* portada */
.cover{justify-content:center;gap:22px}
.cover-logo{position:absolute;top:54px;right:72px;height:96px;width:auto;mix-blend-mode:multiply}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-d)}
.cover h1{font-size:62px;max-width:600px}
.cover .by{font-size:22px;color:var(--muted)} .cover .by b{color:var(--ink);font-weight:600}
.cover .hint{font-family:var(--mono);font-size:14px;color:var(--muted)}
.cover-art{position:absolute;right:60px;top:186px;width:450px;height:388px}
.grow{transform-origin:left;transform-box:fill-box;animation:grow 1.2s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cover-tags{display:flex;gap:10px;flex-wrap:wrap}
.cover-tags span{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);color:var(--ink);padding:5px 10px;background:var(--card)}
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--sans)}
#gate[hidden]{display:none}
#gate form{background:var(--paper);border-top:4px solid var(--ink);box-shadow:0 10px 40px rgba(47,58,143,.18);padding:34px 36px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
#gate .mod{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-d)}
#gate h1{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;margin:0;color:var(--ink)}
#gate p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
#gate input{font-family:var(--mono);font-size:20px;padding:10px 12px;border:1px solid var(--grid);background:#fff;color:var(--ink);letter-spacing:.3em}
#gate .err{color:var(--neg);font-size:14px;min-height:1.2em}
#gate button{font-family:var(--mono);font-size:14px;padding:11px;border:0;background:var(--ink);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <div class="mod">Módulo 6.</div>
    <h1>Power Query y consolidación de datos.</h1>
    <p>Este contenido está protegido. Escriba la clave de acceso para continuar.</p>
    <input id="gateIn" type="password" inputmode="numeric" maxlength="12" aria-label="Clave de acceso" placeholder="Clave">
    <div class="err" id="gateErr" role="alert"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
(function(){
  var CLAVE="1022", KEY="m6-acceso", gate=document.getElementById("gate"), locked;
  function valido(){ try{ var t=+localStorage.getItem(KEY); return t && Date.now()-t < 12*3600e3; }catch(e){ return false; } }
  locked=!valido();
  if(locked){ gate.hidden=false; setTimeout(function(){ document.getElementById("gateIn").focus(); },50); }
  // Mientras está bloqueado, las teclas no mueven la presentación
  document.addEventListener("keydown",function(e){ if(locked) e.stopImmediatePropagation(); },true);
  document.getElementById("gateForm").addEventListener("submit",function(e){
    e.preventDefault();
    var inp=document.getElementById("gateIn");
    if(inp.value.trim()===CLAVE){ try{ localStorage.setItem(KEY,String(Date.now())); }catch(err){} locked=false; gate.hidden=true; }
    else { document.getElementById("gateErr").textContent="Clave incorrecta. Inténtelo de nuevo."; inp.select(); }
  });
})();
</script>
<div id="stage">
  <div class="top"><span id="topL">MÓDULO 6 · POWER QUERY Y CONSOLIDACIÓN DE DATOS.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Datos del ejemplo: reportes de reclamaciones de enero 2026 (datos ficticios con fines didácticos) ---------- */
const fmt = n => "RD$ " + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const ARS = [{k:"ARS Humano",n:40,m:689000},{k:"ARS Universal",n:40,m:655250},{k:"ARS Primera",n:40,m:472300}];
const NUEVA = {k:"ARS Senasa",n:40,m:591650};
const TOT3 = ARS.reduce((s,a)=>s+a.m,0), TOT4 = TOT3 + NUEVA.m;   // 1,816,550 y 2,408,200

/* Barras horizontales: monto por ARS */
function barChart(items, W=560){
  const H=items.length*58+8, max=Math.max(...items.map(i=>i.m)), sc=(W-150)/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monto de reclamaciones por ARS">`;
  items.forEach((it,i)=>{ const y=6+i*58, w=it.m*sc;
    s+=`<text x="0" y="${y+14}" font-size="14" fill="#1f2233">${it.k}${it.nuevo?' <tspan fill="#b8641c" font-weight="700">· nuevo</tspan>':''}</text>`
      +`<rect class="grow" x="0" y="${y+22}" width="${w}" height="22" rx="3" fill="${it.nuevo?'#f2994a':'#2f3a8f'}" style="animation-delay:${i*.12}s"/>`
      +`<text x="${w+8}" y="${y+38}" font-size="13.5" font-weight="700" fill="#1f2233">${fmt(it.m)}</text>`; });
  return s+"</svg>";
}
const exBox = (sub, body, cap) => `<div class="ex"><div class="ex-h"><span>Ejemplo · Reportes de las ARS.</span><span>${sub}</span></div><div class="ex-b">${body}</div>${cap?`<p class="ex-c">${cap}</p>`:""}</div>`;
const fileRow = (name, sub, nuevo) => `<div class="file${nuevo?' new':''}"><span class="ic">X</span><span>${name}<br><small>${sub}</small></span>${nuevo?'<b style="color:var(--acc-d);font-size:13px">NUEVO</b>':'<small>Hoja «Reporte»</small>'}</div>`;
const pqEditor = (cols, rows, steps, cur) => `<div class="pq"><div class="bar">Reportes ARS · Editor de Power Query</div>
  <div class="rib"><span>Inicio</span><span>Transformar</span><span>Agregar columna</span><span>Vista</span></div>
  <div class="body"><div class="grid"><table><tr>${cols.map(([t,c])=>`<th><i>${t}</i>${c}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table></div>
  <div class="steps"><b>Pasos aplicados</b>${steps.map((s,i)=>`<span class="${i===cur?'cur':''} slideR" style="animation-delay:${i*.08}s">${s}</span>`).join("")}</div></div></div>`;

/* ---------- Conceptos ---------- */
const T = [
{ k:"Power Query", d:"Obtener, transformar y cargar.", q:"¿Qué es Power Query?",
  def:"Es la herramienta de Excel para <b>obtener</b> datos de distintas fuentes, <b>transformarlos</b> (limpiarlos y ordenarlos) y <b>cargarlos</b> en una hoja, listos para analizar. Cada paso queda grabado y se repite solo cuando llegan datos nuevos.",
  ana:"Es como una receta grabada: la primera vez se cocina paso a paso; las siguientes, la cocina la repite sola con los ingredientes nuevos.",
  xl:`<span class="path">Datos › Obtener y transformar datos</span>. Viene incluido en Excel desde la versión 2016; en Excel 2010 y 2013 era un complemento aparte.`,
  ex:()=>exBox("Del correo a la tabla.",`<div class="flow"><div class="s"><b>Obtener</b>3 reportes de ARS en una carpeta</div><div class="a">→</div><div class="f"><b>Transformar</b>Limpiar, corregir y unir</div><div class="a">→</div><div class="r"><b>Cargar</b>1 tabla de 120 filas</div></div>
     <p style="font-size:16px;line-height:1.5">Cada mes llegan los reportes de <b>ARS Humano</b>, <b>ARS Universal</b> y <b>ARS Primera</b>. Traen la misma información, pero con títulos en código, montos escritos como texto, filas vacías y repetidas. Power Query los convierte en <b>una sola tabla limpia</b>.</p>`,"Los archivos de origen no se modifican: Power Query trabaja sobre una copia de los datos.") },
{ k:"Importar datos", d:"Conectarse al origen.", q:"¿De dónde puede traer datos?",
  def:"El primer paso es conectarse al <b>origen</b>: un libro de Excel, un archivo de texto o CSV, una tabla de la misma hoja o <b>una carpeta completa</b>. Power Query no copia el archivo: crea una <b>conexión</b> que recuerda dónde están los datos.",
  ana:"Es como una tubería conectada a un tanque: no se carga el agua en cubetas; se abre la llave cada vez que se necesita.",
  xl:`<span class="path">Datos › Obtener datos › Desde un archivo</span> › Desde un libro, Desde texto o CSV o <b style="display:inline;color:var(--ink);font-family:var(--sans);font-size:15px;letter-spacing:0;text-transform:none">Desde una carpeta</b>.`,
  ex:()=>exBox("Los orígenes más usados.",`<table class="m"><tr><th>Origen</th><th>Cuándo se usa</th></tr>
     <tr><td><b>Desde un libro</b></td><td>Un solo archivo de Excel.</td></tr>

  <div class="cols" style="align-items:start"><div class="col" style="gap:14px"><h2 style="font-size:36px">${f.q}</h2><p class="lead" style="font-size:18px">${f.lead}</p>
    <div class="pts">${f.pts.map(([h,p])=>`<div><b>${h}</b><span>${p}</span></div>`).join("")}</div></div>${f.ex()}</div></div>`}); });

INI[T.length]=S.length;
S.push({t:T.length, h:`<div class="slide" style="gap:16px">
  <div class="eyebrow"><span class="n">★</span><span>Ejemplo integrador.</span><span class="tag">Todos los conceptos juntos.</span></div>
  <h2>Del correo al reporte en un clic.</h2>
  <div class="cols" style="grid-template-columns:1.1fr 1fr"><div class="ex"><div class="ex-h"><span>Monto reclamado por ARS.</span><span>Enero 2026.</span></div><div class="ex-b">${barChart(ARS.concat([{...NUEVA,nuevo:true}]))}
    <table class="m"><tr><th></th><th class="r">Reclamaciones</th><th class="r">Monto</th></tr><tr class="tot"><td>Consolidado</td><td class="r">160</td><td class="r">${fmt(TOT4)}</td></tr></table></div></div>
  <div class="col"><div class="chips">
    <div class="chip"><i>📂</i><span><b>Importar</b> desde una carpeta los reportes de las ARS.</span></div>
    <div class="chip"><i>🧹</i><span><b>Limpiar</b>: nombres claros, textos uniformes, montos como número.</span></div>
    <div class="chip"><i>🧩</i><span><b>Unir</b> 138 filas sucias en 120 reclamaciones únicas.</span></div>
    <div class="chip" style="border-left-color:var(--pos)"><i>↻</i><span>Llega ARS Senasa: <b>Actualizar todo</b> y son <b class="pos">160</b>.</span></div></div>
    <p class="analogy" style="font-size:17px">El trabajo se hace una sola vez. Los meses siguientes, solo se copian los archivos nuevos y se actualiza.</p></div></div>
</div>`});

S.push({t:-1, h:`<div class="slide">
  <div class="eyebrow">Resumen.</div>
  <h2>Lo que aprendimos hoy.</h2>
  <div class="sum">${T.map((t,i)=>`<div><span class="n">0${i+1}</span><div><p>${t.d}</p><code>${t.k}.</code></div></div>`).join("")}<div><span class="n">★</span><div><p>Se graba una vez, se repite siempre.</p><code>Menos copiar y pegar, más analizar.</code></div></div></div>
</div>`});

const MS = (l,t,u) => `Microsoft. (s. f.-${l}). <i>${t}</i>. Microsoft Support. <a href="${u}" target="_blank" rel="noopener">${u}</a>`;
S.push({t:-1, h:`<div class="slide" style="gap:12px">
  <div class="eyebrow">Bibliografía.</div>
  <h2 style="font-size:40px">Referencias.</h2>
  <ul class="refs">
    <li>Figueroa, J. (2026). <i>Modulo6-Reportes-ARS.zip</i> [Conjunto de datos ficticio con fines didácticos]. Instituto de Capacitación y Desarrollo Profesional Siglo XXI (ICADEP-XXI).</li>
    <li>${MS("a","Acerca de Power Query en Excel","https://support.microsoft.com/es-es/Excel/about-power-query-in-excel")}</li>
    <li>${MS("b","Anexar consultas (Power Query)","https://support.microsoft.com/es-es/Excel/append-queries-power-query")}</li>
    <li>${MS("c","Combinar las consultas (Power Query)","https://support.microsoft.com/es-es/Excel/merge-queries-power-query")}</li>
    <li>${MS("d","Crear, cargar o editar una consulta en Excel (Power Query)","https://support.microsoft.com/es-es/Excel/create-load-or-edit-a-query-in-excel-power-query")}</li>
    <li>${MS("e","Importar datos de una carpeta con varios archivos (Power Query)","https://support.microsoft.com/es-es/Excel/import-data-from-a-folder-with-multiple-files-power-query")}</li>
    <li>Puls, K., &amp; Escobar, M. (2021). <i>Master your data with Power Query in Excel and Power BI</i> (2.ª ed.). Holy Macro! Books.</li>
    <li>Raviv, G. (2019). <i>Collect, combine, and transform data using Power Query in Excel and Power BI</i>. Microsoft Press.</li>
  </ul>
</div>`});

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children]; els.forEach((el,i)=>S[i].init&&S[i].init(el));
wrap.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
const dots=document.getElementById("dots");
dots.innerHTML=T.map(t=>t.k).concat(["Ejemplo integrador"]).map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));
const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m6sonido")!=="0"; }catch(e){}
function sonar(dir){ if(!SND.on||!SND.ready) return; try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume();
  const t=c.currentTime+.01, len=.22, b=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate), d=b.getChannelData(0); for(let k=0;k<d.length;k++) d[k]=(Math.random()*2-1)*(1-k/d.length);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.4; f.frequency.setValueAtTime(dir>0?500:2600,t); f.frequency.exponentialRampToValueAtTime(dir>0?2600:500,t+len);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+len); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+len);
  const o=c.createOscillator(), og=c.createGain(); o.type="sine"; o.frequency.value=dir>0?880:587; og.gain.setValueAtTime(.0001,t+.06); og.gain.exponentialRampToValueAtTime(.06,t+.075); og.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(og); og.connect(c.destination); o.start(t+.06); o.stop(t+.32); }catch(e){} }
const pintarSnd=()=>{ document.getElementById("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
document.getElementById("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m6sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();
let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  document.getElementById("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  document.getElementById("topL").textContent=tp<0?"MÓDULO 6 · POWER QUERY Y CONSOLIDACIÓN DE DATOS.":tp===T.length?"MÓDULO 6 · EJEMPLO INTEGRADOR.":`MÓDULO 6 · CONCEPTO 0${tp+1} DE 0${T.length} · ${T[tp].k.toUpperCase()}.`;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===els.length-1; }
document.getElementById("prev").onclick=()=>go(cur-1); document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ if(["ArrowRight","PageDown"].includes(e.key)||e.key===" "){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") document.getElementById("fs").click(); else if(e.key==="m"||e.key==="M") document.getElementById("snd").click(); });
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); document.getElementById("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>
</body>
</html>
