<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/icadep-escudo.png">
<title>Power Query en Excel · Módulo 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Escenario fijo 1280×720 escalado a la pantalla. Una idea por lámina, letra grande y un solo apoyo visual. Paleta del Módulo 6: índigo + mandarina. */
:root{
  --bg:#e6e5ee; --paper:#f7f6f3; --card:#ffffff; --ink:#2f3a8f; --text:#1f2233; --muted:#5f6275; --line:#e2e0ea; --grid:#cbc8d8;
  --acc:#f2994a; --acc-d:#b8641c; --acc-soft:#fdeedd; --pos:#23826f; --pos-soft:#e2f3f0; --neg:#c8553d; --neg-soft:#f8e4df; --ink-soft:#e7e9f6;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(47,58,143,.18);border-top:4px solid var(--ink)}
.slide{position:absolute;inset:0;padding:70px 110px 80px;display:none;flex-direction:column;justify-content:center;gap:28px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}.dots button{width:28px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}.dots button.cur{background:var(--acc)}
.bottom{position:absolute;bottom:16px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);line-height:1.12;text-wrap:balance}
h2{font-size:56px}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d)}
.apoyo{font-size:30px;line-height:1.38;text-wrap:pretty}
.vis{display:flex;align-items:center;gap:18px}
.vis span{font-family:var(--mono);font-size:27px;background:var(--card);border:1px solid var(--grid);padding:14px 22px;color:var(--text)}
.vis span.fin{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.vis i{font-style:normal;color:var(--acc);font-size:40px}
.lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:32px;line-height:1.2}
.lista li{display:grid;grid-template-columns:54px 1fr;align-items:baseline}
.lista b{font-family:var(--serif);font-weight:600;color:var(--acc)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px;font-size:18.5px;line-height:1.35}
.refs li{padding-left:28px;text-indent:-28px}
.refs a{color:var(--ink);word-break:break-all;text-decoration:none}
.ref-t{font-size:44px}

.esq{justify-content:flex-start;padding-top:58px;gap:12px}
.esq h2{font-size:40px}
.esq .eyebrow{font-size:15px}
.nota{font-size:23px;line-height:1.3;color:var(--muted);margin-top:auto}
.slide:not(.esq) h2{font-size:54px}
.sv{width:100%;height:auto;display:block;font-family:var(--sans);overflow:visible}
.sv .c{fill:var(--card);stroke:var(--grid);stroke-width:1.5}
.sv .c.i{fill:var(--ink);stroke:var(--ink)}
.sv .c.a{fill:var(--acc-soft);stroke:var(--acc)}
.sv .c.v{fill:var(--pos-soft);stroke:var(--pos)}
.sv .c.m{fill:var(--neg-soft);stroke:var(--neg)}
.sv text{fill:var(--text)}
.sv text.i{fill:#fff;font-weight:600}
.sv text.r{fill:var(--muted);font-family:var(--mono)}
.sv .f{stroke:var(--acc);stroke-width:3.5;fill:none}
.sv .f.d{stroke-dasharray:9 7}
.sv .p{fill:var(--acc)}
.sv .b{fill:var(--ink)}.sv .b.g{fill:#9a98ad}
.sv .gl{stroke:var(--line);stroke-width:1.5}
.sv .l1{fill:none;stroke:#5563d0;stroke-width:3}.sv .l2{fill:none;stroke:#c9701f;stroke-width:3}
.sv .m1,.sv .ly1{fill:#5563d0}.sv .m2,.sv .ly2{fill:#c9701f}
.cover{gap:22px;background:var(--ink);color:#fff}
.cover-logo{position:absolute;top:50px;right:72px;height:90px;width:auto;background:#fff;padding:9px 13px}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#f8c9a0}
.cover h1{font-size:84px;color:#fff}
.cover .by{font-size:26px}.cover .by b{color:#f8c9a0;font-weight:600}
.cierre{background:var(--ink)}
.cierre h2{color:#fff;font-size:64px}
.cierre .apoyo{color:#dadcf2}
#stage.oscuro .top,#stage.oscuro .bottom{color:#d5d8ef}
#stage.oscuro .btn.primary{background:var(--acc);border-color:var(--acc);color:#2a1a00}
#giroTel{display:none;position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.4}
@media (max-width:640px) and (orientation:portrait){#giroTel{display:flex}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none!important}}
</style>
</head>
<body>
<div id="giroTel"><p>📱 Gire su teléfono para ver la presentación en horizontal.</p></div>
<div id="stage">
  <div class="top"><span id="topL">POWER QUERY EN EXCEL.</span><div class="dots" id="dots"></div></div>
  <div id="slides"></div>
  <div class="bottom">
    <span>Jarlin Figueroa, MA</span>
    <div class="navb">
      <button class="btn" id="snd" title="Sonido (M)">🔊 Sonido</button>
      <button class="btn" id="fs" title="Pantalla completa (F)">Pantalla completa</button>
      <button class="btn" id="prev">← Anterior</button>
      <span id="count" style="min-width:70px;text-align:center"></span>
      <button class="btn primary" id="next">Siguiente →</button>
    </div>
  </div>
</div>
<script>
/* ---------- Dibujos: cajas, flechas, tablas y gráficas en SVG (lienzo de 1060 de ancho) ---------- */
const C = (x,y,w,h,txt,cl="",t=24) => { const L=[].concat(txt), y0=y+h/2-(L.length-1)*t*.62; return `<rect class="c ${cl}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>${L.map((l,i)=>`<text class="${cl}" x="${x+w/2}" y="${y0+i*t*1.24+t*.34}" text-anchor="middle" font-size="${t}">${l}</text>`).join("")}`; };
const F = (x1,y1,x2,y2,cl="") => { const a=Math.atan2(y2-y1,x2-x1), p=(d,b)=>`${x2-d*Math.cos(a-b)},${y2-d*Math.sin(a-b)}`; return `<line class="f ${cl}" x1="${x1}" y1="${y1}" x2="${x2-10*Math.cos(a)}" y2="${y2-10*Math.sin(a)}"/><polygon class="p" points="${x2},${y2} ${p(18,.42)} ${p(18,-.42)}"/>`; };
const R = (x,y,txt,t=20,an="middle") => `<text class="r" x="${x}" y="${y}" text-anchor="${an}" font-size="${t}">${txt}</text>`;
const fmtN = n => n.toLocaleString("en-US");

/* Tabla dibujada: la primera fila es el encabezado; nuevas = columnas resaltadas */
function T(x,y,anchos,filas,rh=46,t=20,nuevas=[]){ let s=""; filas.forEach((f,i)=>{ let cx=x; f.forEach((v,j)=>{ const cl=i===0?"i":nuevas.includes(j)?"a":""; s+=C(cx,y+i*rh,anchos[j],rh,v,cl,t); cx+=anchos[j]; }); }); return s; }

/* Barras horizontales: una serie, valores a la derecha y extremo redondeado */
function barras(it,o={}){ const eti=o.eti||300, an=o.an||600, alto=o.alto||38, paso=o.paso||64, t=o.t||24, max=Math.max(...it.map(x=>x[1])), H=it.length*paso;
  return `<svg class="sv" viewBox="0 0 1060 ${H}" role="img" aria-label="${o.alt||''}">${it.map(([k,v,g],i)=>{ const w=Math.max(6,v/max*an), y=i*paso+(paso-alto)/2; return `<text x="${eti-16}" y="${y+alto/2+t*.34}" text-anchor="end" font-size="${t}">${k}</text><path class="b ${g?'g':''}" d="M${eti} ${y}h${w-4}q4 0 4 4v${alto-8}q0 4-4 4h-${w-4}z"/><text x="${eti+w+12}" y="${y+alto/2+t*.34}" font-size="${t}" font-weight="600">${o.pref||''}${fmtN(v)}</text>`; }).join("")}</svg>`; }

/* Tiempo acumulado en 12 meses: ejemplo ilustrativo */
function linea(){ const ML=[...Array(12)].map((_,i)=>60*(i+1)), PQ=[...Array(12)].map((_,i)=>90+2*i), x=i=>80+i*(780/11), y=v=>300-v/720*270;
  const ruta=a=>a.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join("");
  return `<svg class="sv" viewBox="0 0 1060 345" role="img" aria-label="En 12 meses, a mano se acumulan 720 minutos y con Power Query 112 minutos.">
  ${[0,200,400,600].map(v=>`<line class="gl" x1="80" y1="${y(v)}" x2="860" y2="${y(v)}"/><text class="r" x="68" y="${y(v)+6}" text-anchor="end" font-size="18">${v}</text>`).join("")}
  ${[0,2,5,8,11].map(i=>`<text class="r" x="${x(i)}" y="330" text-anchor="middle" font-size="18">Mes ${i+1}</text>`).join("")}
  <path class="l1" d="${ruta(ML)}"/><path class="l2" d="${ruta(PQ)}"/>
  <circle class="m1" cx="${x(11)}" cy="${y(720)}" r="6"/><circle class="m2" cx="${x(11)}" cy="${y(112)}" r="6"/>
  <text x="876" y="${y(720)+7}" font-size="22" font-weight="600">A mano: 720 min</text><text x="876" y="${y(112)+7}" font-size="22" font-weight="600">Power Query: 112 min</text>
  <rect class="ly1" x="80" y="0" width="26" height="5" rx="2"/><text x="114" y="9" font-size="18">A mano</text><rect class="ly2" x="200" y="0" width="26" height="5" rx="2"/><text x="234" y="9" font-size="18">Power Query</text></svg>`; }

const SEC = [["Hogar",10450],["Cocina",90600],["Electrodomésticos",202200],["Muebles",74800]].sort((a,b)=>b[1]-a[1]);
const CAL = [["Filas útiles",120],["Repetidas",9,1],["Vacías",6,1],["Totales",3,1]];
const venn=(x,y,a,c,b,k)=>{ const s=.82, cx1=x+36*s+26, cx2=cx1+36*s, cy=y+50, r=48, m=(cx1+cx2)/2, h=Math.sqrt(r*r-(m-cx1)*(m-cx1)); return `<circle cx="${cx1}" cy="${cy}" r="${r}" fill="${a?'#f2994a':'#fff'}" stroke="#2f3a8f" stroke-width="2"/><circle cx="${cx2}" cy="${cy}" r="${r}" fill="${b?'#f2994a':'#fff'}" fill-opacity="${b?1:.01}" stroke="#2f3a8f" stroke-width="2"/><path d="M${m} ${cy-h}A${r} ${r} 0 0 1 ${m} ${cy+h}A${r} ${r} 0 0 1 ${m} ${cy-h}z" fill="${c?'#2f3a8f':'#fff'}" stroke="#2f3a8f" stroke-width="2"/><text x="${m}" y="${y+128}" text-anchor="middle" font-size="21" font-weight="600">${k}</text>`; };
const ID = {
  etl:`${R(120,24,"OBTENER")}${R(530,24,"TRANSFORMAR")}${R(930,24,"CARGAR")}${["Archivos","Carpetas","Web","Bases de datos"].map((t,i)=>C(0,40+i*76,240,62,t,"a")+F(244,71+i*76,386,135+i*30)).join("")}${C(390,100,280,170,["Power Query","limpia y da forma"],"i",26)}${F(674,185,796,185)}${C(800,115,260,140,["Tabla","en Excel"],"v",28)}`,
  herr:`${C(0,110,270,120,["Power Query","prepara"],"i",26)}${F(274,170,376,170)}${C(380,110,260,120,["Tabla o","modelo de datos"],"a",24)}${["Fórmulas: calculan","Tablas dinámicas: resumen","Gráficos: comunican"].map((t,i)=>F(644,170,736,60+i*110)+C(740,20+i*110,320,80,t,"v",21)).join("")}`,
  fuen:`${["Libro de Excel","Texto o CSV","Carpeta","Web","Base de datos"].map((t,i)=>C(0,4+i*68,280,56,t,"a",23)+F(284,32+i*68,456,110+i*30)).join("")}${C(460,90,280,170,["Power Query","se conecta"],"i",27)}${F(744,175,826,175)}${C(830,105,230,140,["Editor o","carga directa"],"v",23)}`,
  edit:`${C(0,0,1060,54,"1  Cinta de opciones · Inicio · Transformar · Agregar columna · Vista","i",22)}${C(0,60,1060,46,"2  Barra de fórmulas","a",21)}${C(0,112,210,190,["3","Panel de","consultas"],"",22)}${C(216,112,590,190,["4","Vista previa de los datos"],"v",24)}${C(812,112,248,190,["5","Pasos","aplicados"],"",22)}`,
  prob:`${R(240,24,"PROBLEMA")}${R(820,24,"SOLUCIÓN")}${[["Espacios sobrantes","Recortar"],["Registros repetidos","Quitar duplicados"],["Filas sin contenido","Quitar filas en blanco"],["Una categoría, varias formas","Reemplazar los valores"]].map(([a,b],i)=>C(0,40+i*74,480,60,a,"m",23)+F(486,70+i*74,574,70+i*74)+C(580,40+i*74,480,60,b,"v",23)).join("")}`,
  trans:`${R(255,24,"COLUMNAS")}${R(805,24,"FILAS")}${T(0,44,[170,170,170],[["Fecha","Producto","Monto"],["2/1/26","Olla","950"],["3/1/26","Silla","550"]],52,21,[1])}${R(255,246,"Quitar · Elegir · Renombrar",23)}${R(255,284,"Dividir · Combinar · Extraer",23)}${T(550,44,[170,170,170],[["Fecha","Producto","Monto"],["2/1/26","Olla","950"]],52,21)}${C(550,148,510,52,"3/1/26 · Silla · 550","a",21)}${R(805,246,"Filtrar · Ordenar",23)}${R(805,284,"Conservar · Quitar filas",23)}`,
  tipos:`${[["ABC","Texto","00125"],["123","Número entero","18"],["1.2","Número decimal","1250.75"],["📅","Fecha","31/10/2026"],["V/F","Verdadero/Falso","Verdadero"]].map(([a,b,c],i)=>C(i*214,20,204,84,a,"i",32)+C(i*214,110,204,84,b,"a",20)+C(i*214,200,204,84,c,"v",23)).join("")}`,
  reg:`${C(0,110,330,120,"03/01/2026","m",34)}${F(334,150,526,72)}${F(334,190,526,268)}${C(530,20,530,104,["República Dominicana","3 de enero de 2026"],"v",25)}${C(530,216,530,104,["Estados Unidos","1 de marzo de 2026"],"a",25)}`,
  unp:`${R(235,24,"TABLA ANCHA")}${T(0,44,[170,150,150],[["Sucursal","Enero","Febrero"],["Norte","500","650"],["Sur","300","420"]],62,23,[])}${F(486,136,596,136)}${R(830,24,"TABLA LARGA")}${T(600,44,[170,150,140],[["Sucursal","Atributo","Valor"],["Norte","Enero","500"],["Norte","Febrero","650"],["Sur","Enero","300"],["Sur","Febrero","420"]],50,21,[1,2])}`,
  anx:`${["Enero","Febrero","Marzo"].map((t,i)=>C(0,20+i*106,300,88,["Reporte de "+t.toLowerCase(),"Mismas columnas"],"a",22)+F(304,64+i*106,456,134+i*36)).join("")}${C(460,50,600,44,"Fecha · Código · Monto","i",21)}${["Filas de enero","Filas de febrero","Filas de marzo"].map((t,i)=>C(460,94+i*62,600,62,t,"v",23)).join("")}`,
  cmb:`${T(0,20,[170,170],[["Código","Ventas"],["P-101","12"],["P-102","8"]],54,22)}${T(0,206,[170,170],[["Código","Categoría"],["P-101","Cocina"],["P-102","Hogar"]],36,19)}${F(344,102,496,150)}${F(344,262,496,190)}${T(500,80,[170,170,220],[["Código","Ventas","Categoría"],["P-101","12","Cocina"],["P-102","8","Hogar"]],62,23,[2])}`,
  joins:[["Externa izquierda",1,1,0],["Externa derecha",0,1,1],["Externa completa",1,1,1],["Interna",0,1,0],["Anti izquierda",1,0,0],["Anti derecha",0,0,1]].map(([k,a,c,b],i)=>venn(i%3*353+70,(i>2?1:0)*154+6,a,c,b,k)).join(""),
  pasos:`${["Origen","Encabezados","Filas filtradas","Tipo cambiado"].map((t,i)=>C(i*220,40,190,100,t,i?"i":"a",22)+F(i*220+194,90,i*220+216,90)).join("")}${C(880,40,180,100,"Resultado","v",23)}<path class="f d" d="M970 146 V210 H95 V160"/><polygon class="p" points="95,142 85,162 105,162"/>${R(530,256,"Al actualizar, se repite toda la secuencia",24)}${R(530,300,"La interfaz escribe cada paso en lenguaje M",22)}`,
  carga:`${C(0,110,260,120,["Cerrar","y cargar"],"i",26)}${[["Tabla en una hoja","Filtrar y usar fórmulas"],["Modelo de datos","Relacionar tablas"],["Solo conexión","Etapa intermedia"]].map(([a,b],i)=>F(264,170,396,60+i*110)+C(400,20+i*110,660,84,[a,b],i===0?"v":"a",22)).join("")}`,
  act:`${C(40,20,320,100,"Llega información nueva","a",23)}${F(364,70,696,70)}${C(700,20,320,100,"Se guarda en el origen","a",24)}${F(860,124,860,206)}${C(700,210,320,100,"Actualizar","i",28)}${F(696,260,364,260)}${C(40,210,320,100,["Mismos pasos,","datos al día"],"v",24)}<line class="f d" x1="200" y1="206" x2="200" y2="134"/><polygon class="p" points="200,124 190,142 210,142"/>`,
  falla:`${["Cambió nombre o ruta","Cambiaron los encabezados","Sin permisos o credenciales","Origen no disponible","Tipos de datos inesperados"].map((t,i)=>C(0,2+i*66,480,54,t,"m",22)+F(484,29+i*66,676,105+i*30)).join("")}${C(680,90,380,170,["La actualización","puede fallar"],"i",27)}`
};
const CSS_SV = `.sv{width:100%;height:auto;display:block;font-family:var(--sans);overflow:visible}
.sv .c{fill:var(--card);stroke:var(--grid);stroke-width:1.5}
.sv .c.i{fill:var(--ink);stroke:var(--ink)}
.sv .c.a{fill:var(--acc-soft);stroke:var(--acc)}
.sv .c.v{fill:var(--pos-soft);stroke:var(--pos)}
.sv .c.m{fill:var(--neg-soft);stroke:var(--neg)}
.sv text{fill:var(--text)}
.sv text.i{fill:#fff;font-weight:600}
.sv text.r{fill:var(--muted);font-family:var(--mono)}
.sv .f{stroke:var(--acc);stroke-width:3.5;fill:none}
.sv .f.d{stroke-dasharray:9 7}
.sv .p{fill:var(--acc)}
.sv .b{fill:var(--ink)}.sv .b.g{fill:#9a98ad}
.sv .gl{stroke:var(--line);stroke-width:1.5}
.sv .l1{fill:none;stroke:#5563d0;stroke-width:3}.sv .l2{fill:none;stroke:#c9701f;stroke-width:3}
.sv .m1,.sv .ly1{fill:#5563d0}.sv .m2,.sv .ly2{fill:#c9701f}`;
const dib = (k,alt,h=345) => `<svg class="sv" viewBox="0 0 1060 ${h}" role="img" aria-label="${alt}">${ID[k]}</svg>`;

/* ---------- Láminas: una idea, poco texto y una gráfica o esquema ---------- */
const S = [];
const SECC = ["Inicio","Qué es","Fuentes y editor","Calidad","Transformar","Tipos de datos","Resumir","Unir","Pasos","Cargar","Buenas prácticas","Cierre"];
const lam = (t,h,cl="") => S.push({t,h:`<div class="slide ${cl}">${h}</div>`});
const idea = (t,ey,tit,apoyo) => lam(t,`<p class="eyebrow">${ey}</p><h2>${tit}</h2><p class="apoyo">${apoyo}</p>`);
const gr = (t,ey,tit,cuerpo,nota="") => lam(t,`<p class="eyebrow">${ey}</p><h2>${tit}</h2>${cuerpo}${nota?`<p class="nota">${nota}</p>`:""}`,"esq");

lam(0,`<img class="cover-logo" src="img/icadep-isologo.png" alt="ICADEP-XXI · Instituto de Capacitación y Desarrollo Profesional Siglo XXI">
  <p class="mod">Módulo 6</p><h1>Power Query en Excel.</h1><p class="sub">Fundamentos, herramientas y proceso de transformación de datos.</p><p class="by">Por: <b>Jarlin Figueroa, MA</b></p>`,"cover");

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides"); wrap.innerHTML=S.map(s=>s.h).join("");
const els=[...wrap.children], $=id=>document.getElementById(id);
const INI=SECC.map((_,i)=>S.findIndex(s=>s.t===i));
const dots=$("dots");
dots.innerHTML=SECC.map((k,i)=>`<button title="${k}" aria-label="Ir a ${k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(INI[b.dataset.t]));

const SND={on:true,ctx:null,ready:false}; try{ SND.on=localStorage.getItem("m6sonido")!=="0"; }catch(e){}
function sonar(d){ if(!SND.on||!SND.ready) return; try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=SND.ctx||(SND.ctx=new A()); if(c.state==="suspended") c.resume(); const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+.01; o.frequency.value=d>0?880:587; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.22); }catch(e){} }
const pintarSnd=()=>{ $("snd").textContent=SND.on?"🔊 Sonido":"🔇 Sin sonido"; };
$("snd").onclick=e=>{ SND.on=!SND.on; try{ localStorage.setItem("m6sonido",SND.on?"1":"0"); }catch(_){} pintarSnd(); e.currentTarget.blur(); }; pintarSnd();

let cur=0;
function go(i){ const prev=cur; cur=Math.max(0,Math.min(els.length-1,i)); if(cur!==prev) sonar(cur>prev?1:-1);
  els.forEach((e,j)=>e.classList.toggle("on",j===cur)); const tp=S[cur].t;
  $("stage").classList.toggle("oscuro",els[cur].classList.contains("cover")||els[cur].classList.contains("cierre"));
  dots.querySelectorAll("button").forEach((b,j)=>{ b.classList.toggle("cur",j===tp); b.classList.toggle("done",tp>j); });
  $("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  $("topL").textContent="POWER QUERY EN EXCEL · "+SECC[tp].toUpperCase()+".";
  $("prev").disabled=cur===0; $("next").disabled=cur===els.length-1;
  try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){} }
$("prev").onclick=()=>go(cur-1); $("next").onclick=()=>go(cur+1);
$("fs").onclick=e=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} e.currentTarget.blur(); };
document.addEventListener("keydown",e=>{ const enB=e.target.closest&&e.target.closest("button,a");
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&!enB)){e.preventDefault();go(cur+1);} else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1); else if(e.key==="f"||e.key==="F") $("fs").click(); else if(e.key==="m"||e.key==="M") $("snd").click(); });
let tx=null; document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>70) go(cur+(d<0?1:-1)); tx=null; },{passive:true});
function fit(){ const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); $("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go((parseInt(location.hash.slice(1),10)||1)-1); SND.ready=true;
</script>

</html>
