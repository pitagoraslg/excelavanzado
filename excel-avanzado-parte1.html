<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Excel Avanzado — Módulo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F5F0;
    --grid-line:#DEDBD1;
    --ink:#1E2A22;
    --ink-soft:#54655A;
    --green:#1E6B45;
    --green-deep:#123F29;
    --green-tint:#DEEEE2;
    --amber:#B9862B;
    --amber-tint:#F6E9CC;
    --red:#A23B2E;
    --red-tint:#F3DFDA;
    --white:#FFFFFF;
    --inst-navy:#12384F;
    --inst-orange:#E8622A;
    --inst-teal:#1BA7B4;
    --shadow: 0 3px 18px rgba(18,63,41,0.10);
    --shadow-lg: 0 12px 40px rgba(18,63,41,0.16);
    --radius: 16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid-line) 39px, var(--grid-line) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 79px, var(--grid-line) 79px, var(--grid-line) 80px),
      var(--paper);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-top:5px;
  }
  .inst-trim{
    position:fixed; top:0; left:0; right:0; height:5px; z-index:600;
    background:linear-gradient(90deg, var(--inst-navy) 0 40%, var(--inst-orange) 40% 70%, var(--inst-teal) 70% 100%);
  }
  h1,h2,h3{font-family:'IBM Plex Serif',serif; margin:0; color:var(--ink); font-weight:600;}
  p{margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  .muted{color:var(--ink-soft);}
  .small{font-size:0.85rem;}
  ::selection{background:var(--green-tint);}
  :focus-visible{outline:3px solid var(--green); outline-offset:2px;}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .center-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--white); border:1px solid var(--grid-line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:clamp(24px,4vw,44px); width:100%; max-width:460px;
  }
  .card-wide{max-width:640px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 22px; border-radius:12px; border:1.5px solid var(--ink);
    background:var(--white); color:var(--ink); font-weight:600; font-size:1rem;
    transition:transform .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--green); border-color:var(--green); color:var(--white);}
  .btn-primary:hover{background:var(--green-deep); border-color:var(--green-deep);}
  .btn-ghost{border-color:var(--grid-line); color:var(--ink-soft);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none;}
  .field{width:100%; margin-top:14px;}
  .field label{display:block; font-size:.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--grid-line);
    font-size:1rem; font-family:inherit; background:var(--paper); color:var(--ink);
  }
  .field input:focus{border-color:var(--green); background:var(--white);}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row-gap{display:flex; gap:12px; flex-wrap:wrap;}
  .error-msg{color:var(--red); font-size:.85rem; margin-top:10px;}

  /* excel cell motif */
  .xl-cell{
    position:relative; background:var(--white); border:1.5px solid var(--grid-line);
    border-radius:4px; display:inline-flex; align-items:center; justify-content:center;
  }
  .xl-cell.selected{border:2px solid var(--green); box-shadow:0 0 0 1px var(--green) inset;}
  .xl-cell.selected::after{
    content:''; position:absolute; right:-4px; bottom:-4px; width:8px; height:8px;
    background:var(--green); border:1px solid var(--white); border-radius:1px;
  }

  .code-cell{
    padding:18px 30px; font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:clamp(2.2rem,7vw,3.4rem); letter-spacing:.12em; color:var(--green-deep);
  }
  .cell-ref-tag{
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--grid-line); border-radius:6px;
    padding:3px 8px; display:inline-block;
  }

  /* ---------- role / join screens ---------- */
  .brandline{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .brand-mark{
    width:34px; height:34px; border-radius:7px; background:var(--green); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:.95rem; flex-shrink:0;
  }
  .brand-name{font-weight:600; font-size:.95rem; color:var(--ink-soft);}
  .role-options{display:flex; flex-direction:column; gap:14px; margin-top:22px;}
  .role-opt{
    text-align:left; padding:18px 20px; border-radius:var(--radius-sm); border:1.5px solid var(--grid-line);
    background:var(--paper); display:flex; align-items:center; gap:14px;
  }
  .role-opt:hover{border-color:var(--green); background:var(--green-tint);}
  .role-opt .icon{font-size:1.5rem;}
  .role-opt .txt strong{display:block; font-size:1.02rem;}
  .role-opt .txt span{font-size:.85rem; color:var(--ink-soft);}

  /* ---------- facilitator projector ---------- */
  .fac-root{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .fac-topbar{
    display:flex; align-items:center; justify-content:space-between; padding:14px 24px 14px 172px;
    border-bottom:1px solid var(--grid-line); background:rgba(255,255,255,.7); backdrop-filter:blur(6px);
  }
  .fac-topbar .brandline{margin:0;}
  .badge{
    display:inline-flex; align-items:center; gap:7px; font-size:.85rem; font-weight:600;
    background:var(--white); border:1px solid var(--grid-line); border-radius:999px; padding:6px 13px;
    color:var(--ink-soft);
  }
  .badge .dot{width:7px; height:7px; border-radius:50%; background:var(--green);}
  .fac-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:36px 24px 100px;}
  .slide-shell{width:100%; max-width:980px;}
  .slide-kicker{margin-bottom:10px;}
  .slide-title{font-size:clamp(1.7rem,4vw,2.7rem); margin-bottom:6px;}
  .slide-subtitle{color:var(--ink-soft); font-size:clamp(1rem,2vw,1.2rem); margin-bottom:28px;}
  .slide-body{margin-top:8px;}

  .fac-controlbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--inst-navy); color:var(--white);
    padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .fac-controlbar .grp{display:flex; align-items:center; gap:8px;}
  .ctrl-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); color:var(--white);
    padding:10px 16px; border-radius:9px; font-weight:600; font-size:.92rem;
  }
  .ctrl-btn:hover{background:rgba(255,255,255,.18);}
  .ctrl-btn:disabled{opacity:.35; cursor:not-allowed;}
  .ctrl-btn.reveal{background:var(--green); border-color:var(--green);}
  .ctrl-btn.reveal:hover{background:#248050;}
  .ctrl-indicator{font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:rgba(255,255,255,.75); min-width:118px; text-align:center;}

  /* reveal items */
  .reveal-list{display:flex; flex-direction:column; gap:14px;}
  .reveal-item{
    display:flex; align-items:flex-start; gap:14px; background:var(--white); border:1px solid var(--grid-line);
    border-radius:var(--radius-sm); padding:16px 18px; opacity:0; transform:translateY(8px);
    animation:itemIn .45s ease forwards;
  }
  @keyframes itemIn{to{opacity:1; transform:translateY(0);}}
  .reveal-item .num{
    font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green); font-weight:600;
    background:var(--green-tint); border-radius:6px; padding:3px 8px; flex-shrink:0; margin-top:2px;
  }
  .reveal-item h3{font-size:1.05rem; margin-bottom:3px;}
  .reveal-item p{color:var(--ink-soft); font-size:.92rem;}
  .reveal-item .ex{font-family:'IBM Plex Mono',monospace; color:var(--green-deep); font-size:.88rem; margin-top:5px; display:block;}
  .placeholder-row{color:var(--ink-soft); font-style:italic; font-size:.95rem;}

  /* powerpoint-style appear transition on the slide surface */
  @keyframes slidePop{
    0%{opacity:0; transform:scale(.965) translateY(10px);}
    65%{opacity:1; transform:scale(1.005) translateY(-2px);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  .stage-pop{animation:slidePop .42s cubic-bezier(.22,.9,.32,1);}

  /* join CTA — animated attention badge on the title slide */
  .join-cta{
    display:inline-flex; align-items:center; gap:10px; margin-top:24px;
    padding:14px 28px; border-radius:999px; background:var(--green); color:var(--white);
    font-weight:700; font-size:1rem; letter-spacing:.03em; text-transform:uppercase;
    animation: joinPulse 1.8s ease-in-out infinite;
  }
  .join-dot{width:9px; height:9px; border-radius:50%; background:var(--white); flex-shrink:0;}
  @keyframes joinPulse{
    0%{box-shadow:0 0 0 0 rgba(30,107,69,.45); transform:scale(1);}
    55%{box-shadow:0 0 0 16px rgba(30,107,69,0); transform:scale(1.035);}
    100%{box-shadow:0 0 0 0 rgba(30,107,69,0); transform:scale(1);}
  }
  .phase-tag{
    display:inline-block; margin-top:2px; padding:6px 16px; border-radius:999px;
    background:var(--green-tint); color:var(--green-deep); font-weight:600; font-size:.88rem;
    letter-spacing:.02em;
  }

  /* chain diagram */
  .chain{display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .chain-node{
    padding:14px 20px; background:var(--white); border:1.5px solid var(--grid-line); border-radius:var(--radius-sm);
    font-weight:600; opacity:0; transform:scale(.9); animation:itemIn .4s ease forwards;
  }
  .chain-node.on{border-color:var(--green); background:var(--green-tint); color:var(--green-deep);}
  .chain-arrow{color:var(--ink-soft); font-size:1.3rem; opacity:0; animation:itemIn .4s ease forwards;}

  /* poll bars */
  .pollbars{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .pollbar-row{display:grid; grid-template-columns:minmax(120px,220px) 1fr 34px; align-items:center; gap:12px;}
  .pollbar-label{font-size:.92rem; font-weight:500;}
  .pollbar-track{background:var(--paper); border:1px solid var(--grid-line); border-radius:999px; height:16px; overflow:hidden;}
  .pollbar-fill{background:var(--green); height:100%; border-radius:999px; transition:width .5s ease; min-width:2px;}
  .pollbar-count{font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--ink-soft); text-align:right;}
  .pollbar-row.correct .pollbar-fill{background:var(--amber);}
  .pollbar-row.correct .pollbar-label{color:var(--green-deep); font-weight:700;}

  /* word cloud */
  .wordcloud{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 16px; padding:20px 10px; min-height:140px;}
  .wc-word{font-family:'IBM Plex Serif',serif; font-weight:600; line-height:1;}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .chip{
    font-family:'IBM Plex Mono',monospace; background:var(--white); border:1.5px solid var(--grid-line);
    border-radius:8px; padding:8px 13px; font-size:.92rem; font-weight:600; color:var(--ink-soft);
  }
  .chip-correct{border-color:var(--green); color:var(--green-deep); background:var(--green-tint);}

  /* xl grid */
  .xl-grid{display:inline-block; border:1px solid var(--grid-line); border-radius:8px; overflow:hidden; background:var(--white);}
  .xl-grid-row{display:flex;}
  .xl-grid-header .xl-grid-colhead, .xl-grid-corner{
    width:56px; height:34px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
  }
  .xl-grid-rowhead{
    width:34px; height:56px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:.8rem; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
  }
  .xl-grid-cell{
    width:56px; height:56px; border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-size:.85rem; color:var(--green-deep); font-weight:600; background:var(--white);
  }
  .xl-grid-cell-btn{
    width:56px; height:56px; border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
    border-top:none; border-left:none; background:var(--white); font-size:1rem;
  }
  .xl-grid-cell-btn:hover{background:var(--green-tint);}
  .xl-grid-cell-btn.picked{background:var(--green); }
  .xl-cell-correct{background:var(--green)!important; color:var(--white)!important;}

  /* mc options for participant */
  .mc-grid{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .mc-opt{
    text-align:left; padding:15px 18px; border-radius:var(--radius-sm); border:1.5px solid var(--grid-line);
    background:var(--white); font-weight:600; font-size:1rem;
  }
  .mc-opt:hover{border-color:var(--green); background:var(--green-tint);}
  .mc-opt.chosen{border-color:var(--green); background:var(--green); color:var(--white);}
  .scale-grid{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .scale-opt{
    flex:1; min-width:52px; padding:16px 8px; border-radius:12px; border:1.5px solid var(--grid-line);
    background:var(--white); font-weight:700; font-size:1.15rem; font-family:'IBM Plex Mono',monospace;
  }
  .scale-opt:hover{border-color:var(--green); background:var(--green-tint);}
  .scale-opt.chosen{border-color:var(--green); background:var(--green); color:var(--white);}

  /* ---------- participant view ---------- */
  .part-root{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .part-topbar{
    padding:14px 18px 14px 160px; border-bottom:1px solid var(--grid-line); display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.7);
  }
  .part-name{font-size:.85rem; color:var(--ink-soft); font-weight:600;}
  .part-body{flex:1; display:flex; align-items:center; justify-content:center; padding:22px 22px 84px;}
  .part-card{width:100%; max-width:440px;}
  .waiting-wrap{text-align:center; padding:20px 0;}
  .pulse-dot{
    width:14px; height:14px; border-radius:50%; background:var(--green); margin:0 auto 18px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1); opacity:.7;} 50%{transform:scale(1.5); opacity:1;}}
  .confirm-wrap{text-align:center; padding:14px 0;}
  .confirm-check{
    width:52px; height:52px; border-radius:50%; background:var(--green-tint); color:var(--green-deep);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:1.5rem;
  }
  .num-input-row{display:flex; gap:10px; margin-top:16px;}
  .num-input-row input{flex:1;}

  /* ---------- timer badge ---------- */
  .timer-badge{
    display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-weight:700;
    font-size:.95rem; padding:6px 13px; border-radius:999px; background:var(--white); border:1.5px solid var(--grid-line);
    color:var(--ink);
  }
  .timer-badge.timer-low{border-color:#c0392b; color:#c0392b; animation:pulse 1s ease-in-out infinite;}
  .timer-badge.timer-done{border-color:#c0392b; background:#c0392b; color:var(--white); animation:none;}
  .timer-expired-note{color:#c0392b; font-weight:600;}

  /* ---------- reactions ---------- */
  .reaction-bar{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:8px;
    background:rgba(255,255,255,.92); border:1.5px solid var(--grid-line); border-radius:999px;
    padding:8px 10px; box-shadow:var(--shadow); z-index:600; backdrop-filter:blur(6px);
  }
  .reaction-btn{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent; font-size:1.3rem;
    display:flex; align-items:center; justify-content:center; transition:transform .15s ease; cursor:pointer;
  }
  .reaction-btn:hover{background:var(--green-tint);}
  .reaction-btn.pop{transform:scale(1.4);}
  .reaction-overlay{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:400;
  }
  .floating-emoji{
    position:absolute; bottom:70px; font-size:2.4rem; animation-name:float-up; animation-timing-function:ease-out;
    animation-fill-mode:forwards; will-change:transform, opacity;
  }
  @keyframes float-up{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    15%{ opacity:1; transform:translateY(-40px) scale(1); }
    100%{ transform:translateY(-420px) scale(1.1); opacity:0; }
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
  @media (max-width:640px){
    .fac-stage{padding:24px 16px 120px;}
    .fac-controlbar{padding:12px 14px;}
    .ctrl-btn{padding:9px 12px; font-size:.82rem;}
    .pollbar-row{grid-template-columns:1fr; gap:4px;}
    .pollbar-count{text-align:left;}
    #institute-logo{width:80px; height:80px; top:10px; left:10px;}
    .fac-topbar{padding:12px 16px 12px 100px;}
    .part-topbar{padding:12px 14px 12px 96px;}
  }

  /* institute logo — fixed across every screen */
  #institute-logo{
    position:fixed; top:18px; left:20px; width:132px; height:132px; z-index:500;
    opacity:.97; pointer-events:none; filter:drop-shadow(0 3px 10px rgba(18,63,41,.22));
  }
  #institute-logo img{width:100%; height:100%; object-fit:contain; display:block;}
  .role-badge{
    width:38px; height:38px; border-radius:9px; background:var(--inst-navy); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:.85rem; flex-shrink:0;
  }
</style>
</head>
<body>

    "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-database-compat.min.js"
  ];

  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ resolve(true); };
      s.onerror = function(){ reject(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }
  function loadWithFallback(urls){
    var i = 0;
    function tryNext(){
      if(i >= urls.length) return Promise.reject(new Error('all sources failed'));
      var url = urls[i++];
      return loadScript(url).catch(tryNext);
    }
    return tryNext();
  }
  function showLoadError(){
    document.body.innerHTML =
      '<div style="max-width:520px;margin:15vh auto;padding:32px;font-family:sans-serif;text-align:center;">' +
      '<h2 style="margin-bottom:14px;">No se pudo conectar</h2>' +
      '<p style="color:#555;line-height:1.5;">No logramos cargar el servicio de sincronización en tiempo real. ' +
      'Revisa tu conexión a internet, o si estás en una red de colegio/institución, intenta desde otra red (datos móviles, por ejemplo) y recarga la página.</p>' +
      '</div>';
  }

  loadWithFallback(APP_CDNS)
    .then(function(){ return loadWithFallback(DB_CDNS); })
    .then(function(){
      if(typeof firebase === 'undefined'){ showLoadError(); return; }
      firebase.initializeApp(firebaseConfig);
      window.EXCEL_DB_READY = firebase.database();
      window.dispatchEvent(new Event('excel-firebase-ready'));
    })
    .catch(function(){ showLoadError(); });
})();
</script>

  /* ============================================================
     SHARED RENDER WIDGETS
     ============================================================ */
  function labelFor(options, id){
    for(var i=0;i<options.length;i++){ if(options[i].id===id) return options[i].label; }
    return id;
  }
  function waitingBlock(msg){
    return '<div class="waiting-wrap"><div class="pulse-dot"></div><p class="muted">'+msg+'</p></div>';
  }
  function confirmedBlock(msg){
    return '<div class="confirm-wrap"><div class="confirm-check">✓</div><p style="font-weight:600;">'+msg+'</p></div>';
  }
  function renderWordCloud(words){
    var freq = {};
    words.forEach(function(w){
      var k = String(w).trim().toLowerCase();
      if(!k) return;
      freq[k] = (freq[k]||0) + 1;
    });
    var entries = Object.keys(freq).map(function(k){ return [k, freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    if(!entries.length) return '<p class="muted" style="text-align:center;padding:30px 0;">Esperando respuestas…</p>';
    var max = entries[0][1];
    var colors = ['var(--green)','var(--ink)','var(--amber)','var(--green-deep)'];
    var html = '<div class="wordcloud">';
    entries.forEach(function(e, i){
      var size = 15 + (e[1]/max) * 40;
      var rot = ((i % 5) - 2) * 3;
      var color = colors[i % colors.length];
      html += '<span class="wc-word" style="font-size:'+size.toFixed(0)+'px;transform:rotate('+rot+'deg);color:'+color+';">'+escapeHtml(e[0])+'</span>';
    });
    html += '</div>';
    return html;
  }
  function renderPollBars(values, options, correctId){
    var counts = {};
    options.forEach(function(o){ counts[o.id] = 0; });
    values.forEach(function(v){ if(counts.hasOwnProperty(v)) counts[v]++; });
    var total = values.length;
    var html = '<div class="pollbars">';
    options.forEach(function(o){
      var c = counts[o.id] || 0;
      var pct = total ? Math.round(c/total*100) : 0;
      var rowClass = (correctId && o.id===correctId) ? 'pollbar-row correct' : 'pollbar-row';
      html += '<div class="'+rowClass+'"><span class="pollbar-label">'+escapeHtml(o.label)+'</span>'
        + '<div class="pollbar-track"><div class="pollbar-fill" style="width:'+pct+'%"></div></div>'
        + '<span class="pollbar-count">'+c+'</span></div>';
    });
    html += '<p class="muted small" style="margin-top:2px;">'+total+' respuesta'+(total===1?'':'s')+'</p></div>';
    return html;
  }
  function renderNumericChips(values, correctVal){
    if(!values.length) return '<p class="muted">Esperando respuestas…</p>';
    var html = '<div class="chips">';
    values.forEach(function(v){
      var ok = (correctVal!==null && correctVal!==undefined && Number(v)===Number(correctVal));
      html += '<span class="chip '+(ok?'chip-correct':'')+'">RD$'+Number(v).toLocaleString('es-DO')+'</span>';
    });
    html += '</div>';
    return html;
  }
  function renderMiniSheet(revealAnswer){
    var cols = ['A','B','C','D'];
    var rows = [
      {num:1, cells:['Producto','Cantidad','Precio','Total']},
      {num:2, cells:['Laptop','2','35,000', revealAnswer ? '70,000' : null]},
      {num:3, cells:['Monitor','3','12,000','']},
      {num:4, cells:['Teclado','5','1,500','']},
      {num:5, cells:['Mouse','8','800','']}
    ];
    var html = '<div class="xl-grid">';
    html += '<div class="xl-grid-row xl-grid-header"><div class="xl-grid-corner"></div>' + cols.map(function(c){return '<div class="xl-grid-colhead" style="width:110px;">'+c+'</div>';}).join('') + '</div>';
    rows.forEach(function(r){
      html += '<div class="xl-grid-row"><div class="xl-grid-rowhead">'+r.num+'</div>';
      r.cells.forEach(function(val, ci){
        var isHeaderRow = (r.num===1);
        var isTarget = (r.num===2 && ci===3);
        var cls = 'xl-grid-cell';
        var style = 'width:110px;justify-content:center;font-weight:'+(isHeaderRow?'700':'500')+';';
        var content = (val===null) ? '' : escapeHtml(val);
        if(isHeaderRow){ style += 'background:var(--paper);color:var(--ink-soft);font-size:.82rem;'; }
        if(isTarget){
          if(revealAnswer){ cls += ' xl-cell-correct'; }
          else { style += 'border:2px solid var(--green);background:var(--green-tint);'; content = '<span class="mono" style="color:var(--green-deep);">?</span>'; }
        }
        html += '<div class="'+cls+'" style="'+style+'">'+content+'</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }
  function renderGridHeatmap(coords, revealCorrect){
    var counts = {};
    coords.forEach(function(c){ counts[c] = (counts[c]||0)+1; });
    var max = 1;
    Object.keys(counts).forEach(function(k){ if(counts[k] > max) max = counts[k]; });
    var cols=['A','B','C','D','E'], rows=[1,2,3,4,5];
    var html = '<div class="xl-grid">';
    html += '<div class="xl-grid-row xl-grid-header"><div class="xl-grid-corner"></div>' + cols.map(function(c){return '<div class="xl-grid-colhead">'+c+'</div>';}).join('') + '</div>';
    rows.forEach(function(r){
      html += '<div class="xl-grid-row"><div class="xl-grid-rowhead">'+r+'</div>';
      cols.forEach(function(c){
        var key = c+','+r;
        var n = counts[key] || 0;
        var alpha = n ? (0.15 + 0.65*(n/max)) : 0;
        var isTarget = (key === 'B,2');
        var cls = (revealCorrect && isTarget) ? 'xl-grid-cell xl-cell-correct' : 'xl-grid-cell';
        html += '<div class="'+cls+'" style="background:rgba(30,107,69,'+alpha+')">'+(revealCorrect && isTarget ? '✓' : (n||''))+'</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function attachFacilitatorListeners(){
    db.ref('participants/'+S.code).on('value', function(snap){
      S.participantCount = snap.numChildren();
      var badge = document.getElementById('participant-badge');
      if(badge) badge.textContent = S.participantCount + ' conectados';
    });
    db.ref('responses/'+S.code).on('value', function(snap){
      S.allResponses = snap.val() || {};
      updateLiveWidget();
    });
    var reactionsSince = Date.now();
    db.ref('reactions/'+S.code).orderByChild('t').startAt(reactionsSince).on('child_added', function(snap){
      spawnFloatingReaction(snap.val());
      snap.ref.remove();
    });
  }
  function getAggArray(step){
    return objToArray(S.allResponses ? S.allResponses[step] : null);
  }
  function updateLiveWidget(){
    var slide = SLIDES[S.step];
    if(S.role!=='facilitator' || S.stage < slide.interactiveStage) return;
    var host = document.getElementById('live-widget-host');
    if(host) host.innerHTML = slide.facRender.call(slide, S.stage, getAggArray(S.step));
  }

  function renderFacilitatorApp(){
    var slide = SLIDES[S.step];
    var body = slide.facRender.call(slide, S.stage, getAggArray(S.step));
    var atFirstStage = S.stage===0;
    var atLastStage = S.stage>=slide.maxStage;
    var atFirstSlide = S.step===0;
    var atLastSlide = S.step===SLIDES.length-1;

    var html = '<div class="fac-root">'
      + '<div class="reaction-overlay" id="reaction-overlay"></div>'
      + '<div class="fac-topbar">'
        + brandline()
        + '<div class="row-gap" style="align-items:center;">'
          + '<span class="badge"><span class="dot"></span>Código <strong class="mono">&nbsp;'+S.code+'</strong></span>'
          + '<span class="badge" id="participant-badge">'+S.participantCount+' conectados</span>'
          + (S.timerEndsAt ? '<span class="timer-badge" id="timer-badge">⏱ --</span>' : '')
          + '<button class="btn" id="btn-copy-link" style="padding:7px 14px; font-size:.85rem; border-radius:999px;">Copiar enlace para estudiantes</button>'
        + '</div>'
      + '</div>'
      + '<div class="fac-stage"><div class="slide-shell stage-pop" id="live-widget-host">'+body+'</div></div>'
      + '<div class="fac-controlbar">'
        + '<div class="grp">'
          + '<button class="ctrl-btn" id="ctrl-prev-slide" '+(atFirstSlide?'disabled':'')+'>◂◂ Diapositiva</button>'
          + '<button class="ctrl-btn" id="ctrl-prev-stage" '+(atFirstStage?'disabled':'')+'>◂ Ocultar</button>'
        + '</div>'
        + '<span class="ctrl-indicator">'+slide.ref+' · '+S.stage+'/'+slide.maxStage+'</span>'
        + '<div class="grp">'
          + '<button class="ctrl-btn reveal" id="ctrl-next-stage" '+(atLastStage?'disabled':'')+'>Revelar ▸</button>'
          + '<button class="ctrl-btn" id="ctrl-next-slide" '+(atLastSlide?'disabled':'')+'>Diapositiva ▸▸</button>'
        + '</div>'
      + '</div>'
      + '</div>';
    app.innerHTML = html;

    var b;
    if((b=document.getElementById('ctrl-prev-slide'))) b.addEventListener('click', function(){ changeSlide(-1); });
    if((b=document.getElementById('ctrl-next-slide'))) b.addEventListener('click', function(){ changeSlide(1); });
    if((b=document.getElementById('ctrl-prev-stage'))) b.addEventListener('click', function(){ changeStage(-1); });
    if((b=document.getElementById('ctrl-next-stage'))) b.addEventListener('click', function(){ changeStage(1); });
    if((b=document.getElementById('btn-copy-link'))){
      b.addEventListener('click', function(){
        copyToClipboard(getJoinLink(S.code)).then(function(){
          var original = b.textContent;
          b.textContent = '¡Enlace copiado!';
          setTimeout(function(){ b.textContent = original; }, 1800);
        });
      });
    }
  }

  function changeSlide(dir){
    var next = S.step + dir;
    if(next < 0 || next >= SLIDES.length) return;
    S.step = next; S.stage = 0; S.timerEndsAt = null; S._timerLockedFor = null;
    dbSet('session/'+S.code, {step:S.step, stage:S.stage, createdAt: Date.now(), timerEndsAt:null});
    renderFacilitatorApp();
  }
  function changeStage(dir){
    var slide = SLIDES[S.step];
    var next = S.stage + dir;
    if(next < 0 || next > slide.maxStage) return;
    S.stage = next;
    if(dir > 0) playRevealSound();
    S.timerEndsAt = (slide.timerSeconds && next === slide.interactiveStage) ? (Date.now() + slide.timerSeconds*1000) : null;
    S._timerLockedFor = null;
    dbSet('session/'+S.code, {step:S.step, stage:S.stage, createdAt: Date.now(), timerEndsAt:S.timerEndsAt});
    renderFacilitatorApp();
  }

  /* ---------- PARTICIPANT QUICK JOIN (via ?code= link) ---------- */
  function renderQuickJoin(code){
    var html = brandline()
      + '<h1 style="font-size:1.4rem;">Unirse a la sesión</h1>'
      + '<div class="field"><label>Código de sesión</label>'
      + '<div class="xl-cell selected code-cell" style="margin:6px auto 0;">'+escapeHtml(code)+'</div></div>'
      + '<div class="field" style="margin-top:16px;"><label>Tu nombre</label>'
      + '<input id="join-name" placeholder="Escribe tu nombre" maxlength="30"></div>'
      + '<button class="btn btn-primary btn-block" id="join-btn" style="margin-top:18px;">Estoy listo</button>'
      + '<p class="error-msg" id="join-error" style="display:none;"></p>'
      + '<p class="muted small" style="margin-top:16px;"><a href="#" id="manual-code" style="color:var(--ink-soft);">¿No es tu código? Escríbelo manualmente</a></p>';
    app.innerHTML = screenWrap(html);
    document.getElementById('manual-code').addEventListener('click', function(e){ e.preventDefault(); urlJoinCode = null; renderParticipantEntry(); });
    document.getElementById('join-btn').addEventListener('click', function(){ doJoin(code); });
  }

  /* ---------- PARTICIPANT ENTRY ---------- */
  function renderParticipantEntry(){
    var html = brandline()
      + '<h1 style="font-size:1.4rem;">Unirse a la sesión</h1>'
      + '<div class="field"><label>Código de sesión</label>'
      + '<input id="join-code" placeholder="0000" maxlength="4" inputmode="numeric" style="font-family:\'IBM Plex Mono\',monospace;font-size:1.2rem;letter-spacing:.1em;text-align:center;"></div>'
      + '<div class="field"><label>Tu nombre</label>'
      + '<input id="join-name" placeholder="Escribe tu nombre" maxlength="30"></div>'
      + '<button class="btn btn-primary btn-block" id="join-btn" style="margin-top:18px;">Estoy listo</button>'
      + '<p class="error-msg" id="join-error" style="display:none;"></p>'
      + '<p class="muted small" style="margin-top:16px;"><a href="#" id="back-role2" style="color:var(--ink-soft);">← Volver</a></p>';
    app.innerHTML = screenWrap(html);
    document.getElementById('back-role2').addEventListener('click', function(e){ e.preventDefault(); renderRoleScreen(); });
    document.getElementById('join-btn').addEventListener('click', function(){ doJoin(); });
  }
  function showJoinError(msg){
    var el = document.getElementById('join-error');
    if(el){ el.textContent = msg; el.style.display = 'block'; }
  }
  function doJoin(fixedCode){
    var codeEl = document.getElementById('join-code');
    var code = fixedCode || (codeEl ? (codeEl.value||'').trim() : '');
    var name = (document.getElementById('join-name').value||'').trim();
    if(code.length!==4){ showJoinError('Escribe el código de 4 dígitos que dio el facilitador.'); return; }
    if(!name){ showJoinError('Escribe tu nombre.'); return; }
    var btn = document.getElementById('join-btn'); btn.disabled = true; btn.textContent = 'Uniendo…';
    dbGetOnce('session/'+code).then(function(s){
      if(!s){ showJoinError('No encontramos esa sesión. Verifica el código.'); btn.disabled=false; btn.textContent='Estoy listo'; return; }
      var pid = genId();
      dbSet('participants/'+code+'/'+pid, {name:name, joinedAt: Date.now()}).then(function(){
        S.code = code; S.pid = pid; S.name = name; S.role = 'participant';
        S.step = s.step||0; S.stage = s.stage||0; S.timerEndsAt = s.timerEndsAt||null;
        attachParticipantListener();
        render();
      });
    });
  }

  /* ---------- PARTICIPANT APP ---------- */
  function attachParticipantListener(){
    db.ref('session/'+S.code).on('value', function(snap){
      var s = snap.val();
      if(!s) return;
      var changed = (s.step !== S.step || s.stage !== S.stage);
      S.timerEndsAt = s.timerEndsAt || null;
      S._timerLockedFor = null;
      if(changed){
        S.step = s.step; S.stage = s.stage;
        renderParticipantApp();
      }
    });
  }
  function renderParticipantApp(){
    var slide = SLIDES[S.step];
    var mine = S.myResponses[S.step];
    var body = slide.partRender.call(slide, S.stage, mine);
    var html = '<div class="part-root">'
      + '<div class="part-topbar"><span class="cell-ref-tag">'+slide.ref+'</span>'
        + (S.timerEndsAt ? '<span class="timer-badge" id="timer-badge">⏱ --</span>' : '')
        + '<span class="part-name">'+escapeHtml(S.name)+'</span></div>'
      + '<div class="part-body"><div class="part-card">'+body+'</div></div>'
      + renderReactionBar()
      + '</div>';
    app.innerHTML = html;
    if(typeof slide.partBind === 'function'){
      slide.partBind.call(slide, app);
    }
    bindReactionBar();
  }

  /* ---------- REACTIONS (participant side) ---------- */
  var REACTION_EMOJIS = ['👍','🎉','😂','🤔','❤️','✋'];
  function renderReactionBar(){
    return '<div class="reaction-bar">' + REACTION_EMOJIS.map(function(e){
      return '<button type="button" class="reaction-btn" data-emoji="'+e+'">'+e+'</button>';
    }).join('') + '</div>';
  }
  function bindReactionBar(){
    document.querySelectorAll('.reaction-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        sendReaction(btn.getAttribute('data-emoji'));
        btn.classList.add('pop');
        setTimeout(function(){ btn.classList.remove('pop'); }, 250);
      });
    });
  }
  var lastReactionAt = 0;
  function sendReaction(emoji){
    var now = Date.now();
    if(now - lastReactionAt < 400) return;
    lastReactionAt = now;
    db.ref('reactions/'+S.code).push({emoji: emoji, name: S.name, t: now});
  }

  /* ---------- REACTIONS (facilitator side) ---------- */
  function spawnFloatingReaction(data){
    var overlay = document.getElementById('reaction-overlay');
    if(!overlay || !data) return;
    var el = document.createElement('div');
    el.className = 'floating-emoji';
    el.textContent = data.emoji || '👍';
    el.style.left = (8 + Math.random()*80) + '%';
    el.style.animationDuration = (2.2 + Math.random()*1.2) + 's';
    overlay.appendChild(el);
    el.addEventListener('animationend', function(){ el.remove(); });
  }

  /* ---------- TIMER (shared) ---------- */
  function lockAnswering(){
    var opts = document.querySelectorAll('.mc-opt:not(:disabled)');
    if(!opts.length) return;
    opts.forEach(function(btn){ btn.disabled = true; });
    var host = document.querySelector('.part-card');
    if(host && !host.querySelector('.timer-expired-note')){
      var note = document.createElement('p');
      note.className = 'timer-expired-note';
      note.style.marginTop = '12px';
      note.textContent = '⏰ Se acabó el tiempo.';
      host.appendChild(note);
    }
  }
  function tickTimer(){
    var el = document.getElementById('timer-badge');
    if(!el || !S.timerEndsAt) return;
    var remaining = Math.max(0, Math.ceil((S.timerEndsAt - Date.now())/1000));
    el.textContent = '⏱ ' + remaining + 's';
    el.classList.toggle('timer-low', remaining>0 && remaining<=5);
    el.classList.toggle('timer-done', remaining<=0);
    if(remaining<=0 && S._timerLockedFor !== S.timerEndsAt){
      S._timerLockedFor = S.timerEndsAt;
      if(S.role==='participant') lockAnswering();
    }
  }
  setInterval(tickTimer, 300);

  function submitResponse(value){
    S.myResponses[S.step] = value;
    dbSet('responses/'+S.code+'/'+S.step+'/'+S.pid, {v:value, name:S.name, t:Date.now()});
    renderParticipantApp();
  }

  /* ============================================================
     BOOT — wait for Firebase to finish loading (with CDN fallback)
     ============================================================ */
  function boot(){
    db = window.EXCEL_DB_READY;
    render();
  }
  if(window.EXCEL_DB_READY){
    boot();
  } else {
    app.innerHTML = '<div class="center-screen"><p class="muted">Conectando…</p></div>';
    window.addEventListener('excel-firebase-ready', boot);
  }
})();
</script>
</body>
</html>
