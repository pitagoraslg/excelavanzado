<style>
/* Layout: escenario fijo 1280×720 escalado a la pantalla (proyector); hoja de cálculo como motivo. Tema claro deliberado. */
:root{
  --bg:#e9e8f0;        /* fondo fuera del escenario */
  --paper:#f5f4f8;     /* lámina */
  --card:#ffffff;
  --ink:#1f1c4f;       /* azul marino */
  --muted:#5e5b7a;
  --line:#dcdbe6;
  --grid:#c9c7d8;
  --xl:#16754c;        /* verde Excel */
  --xl-soft:#e1f1e8;
  --mark:#fff1bf;      /* resaltado de celda */
  --mark-line:#d9a800;
  --warn:#a33a2a;
  --warn-soft:#f8e6e2;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--paper);transform-origin:center center;transform:translate(-50%,-50%);box-shadow:0 10px 40px rgba(31,28,79,.18);border-top:3px solid var(--ink);flex:none}
.slide{position:absolute;inset:0;padding:64px 72px 70px;display:none;flex-direction:column;gap:22px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

/* chrome */
.top{position:absolute;top:20px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;z-index:3}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:6px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:var(--grid)}
.dots button.cur{background:var(--xl)}
.bottom{position:absolute;bottom:18px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);z-index:3}
.navb{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--xl);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* type */
.eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--xl);display:flex;gap:14px;align-items:center}
.eyebrow .n{font-family:var(--serif);font-size:30px;letter-spacing:0;text-transform:none}
.eyebrow .tag{border:1px solid var(--xl);padding:2px 8px;font-size:12px}
h1{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.02;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.08;margin:0;text-wrap:balance}
h3{font-size:20px;margin:0;font-weight:600}
p{margin:0}
.lead{font-size:24px;line-height:1.45;max-width:30em;color:var(--ink)}
.muted{color:var(--muted)}
code,.code{font-family:var(--mono)}

/* cover */
.cover{justify-content:center;gap:28px}
.cover .mod{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--xl)}
.cover h1{font-size:96px;max-width:11em}
.cover .by{font-size:24px;color:var(--muted)}
.cover .by b{color:var(--ink);font-weight:600}
.cover .fx{font-family:var(--mono);font-size:22px;display:flex;align-items:stretch;border:1px solid var(--grid);background:var(--card);width:max-content;max-width:100%}
.cover .fx span{padding:10px 14px}
.cover .fx .lbl{border-right:1px solid var(--grid);color:var(--muted);font-style:italic;font-family:var(--serif)}
.cover .fx .caret{border-left:2px solid var(--xl);animation:blink 1s steps(1) infinite;padding:0;margin:8px 0}
@keyframes blink{50%{opacity:0}}
.cover .hint{font-family:var(--mono);font-size:14px;color:var(--muted)}

/* index grid like the screenshot */
.idx{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.idx button{all:unset;cursor:pointer;padding:22px 22px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.idx button:nth-child(4n){border-right:0}
.idx button:hover{background:var(--card)}
.idx .n{font-family:var(--serif);font-size:40px;color:var(--xl);line-height:1}
.idx .k{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:500}
.idx .d{font-size:16px;color:var(--ink)}
.idx .ex{background:var(--ink);color:var(--paper);cursor:default}
.idx .ex .n,.idx .ex .k,.idx .ex .d{color:var(--paper)}
.note{font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center}
.note b{color:var(--ink)}

/* concept */
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;flex:1;min-height:0}
.analogy{border-left:3px solid var(--xl);padding:6px 0 6px 18px;font-family:var(--serif);font-size:22px;font-style:italic;line-height:1.4;color:var(--ink)}
.syntax{background:var(--card);border:1px solid var(--grid);font-family:var(--mono);font-size:20px;padding:18px 20px;line-height:1.7}
.syntax .fn{color:var(--xl);font-weight:600}
.arg{cursor:pointer;border-bottom:2px solid var(--grid);padding:0 2px}
.arg.opt{color:var(--muted)}
.arg.on{background:var(--mark);border-bottom-color:var(--mark-line)}
.args{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.args li{list-style:none;display:grid;grid-template-columns:200px 1fr;gap:16px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;line-height:1.4}
.args li code{font-size:15px;color:var(--ink);font-weight:500}
.args li .o{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.args li.on{background:var(--mark)}
.args{margin:0;padding:0}

/* uses */
.uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.use{min-width:0;background:var(--card);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.use h3{font-size:19px}
.use p{font-size:16.5px;line-height:1.45;color:var(--muted)}
.use code{font-size:14px;color:var(--xl);background:var(--xl-soft);padding:3px 6px;display:inline-block;margin-top:2px;white-space:normal;word-break:break-word;max-width:100%}
.pit{display:flex;gap:16px;align-items:flex-start;background:var(--warn-soft);padding:14px 18px;font-size:17px;line-height:1.45}
.pit b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);padding-top:3px;white-space:nowrap}

/* practice */
.prac{display:grid;grid-template-columns:430px 1fr;gap:36px;flex:1;min-height:0}
.steps{margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:17px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:22px;color:var(--xl);line-height:1}
.steps code{font-size:15px;background:var(--card);border:1px solid var(--line);padding:1px 5px}
.fbar{display:flex;border:1px solid var(--grid);background:var(--card);font-family:var(--mono);font-size:15.5px;align-items:stretch}
.fbar .lbl{font-family:var(--serif);font-style:italic;color:var(--muted);padding:9px 12px;border-right:1px solid var(--grid)}
.fbar .f{padding:9px 12px;flex:1;min-width:0;word-break:break-word;line-height:1.45}
.fbar button{all:unset;cursor:pointer;font-size:12px;padding:0 12px;border-left:1px solid var(--grid);color:var(--xl);font-weight:600}
.fbar button:hover{background:var(--xl-soft)}
.sim{background:var(--card);border:1px solid var(--grid);display:flex;flex-direction:column;min-height:0}
.sim-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--grid);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
.sim-h .live{color:var(--xl)}
.sim-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.ctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-family:var(--mono)}
select,input[type=number]{font-family:var(--sans);font-size:16px;padding:7px 10px;border:1px solid var(--grid);background:var(--card);color:var(--ink);min-width:180px}
.livef{font-family:var(--mono);font-size:15px;background:var(--paper);border:1px dashed var(--grid);padding:9px 12px;line-height:1.5;word-break:break-word}
.livef .v{background:var(--mark);padding:0 3px}
.res{display:flex;align-items:center;gap:16px;border:2px solid var(--xl);padding:12px 16px;position:relative;cursor:pointer}
.res .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--xl)}
.res .val{font-family:var(--serif);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.res.hide .val{filter:blur(12px);user-select:none}
.res .rev{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.res.hide .rev{color:var(--xl);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--grid);background:var(--paper);padding:4px 9px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--xl)}

/* spreadsheet table */
.sheet{overflow:auto;border:1px solid var(--grid);min-height:0;flex:1}
.sheet table{border-collapse:collapse;font-size:13.5px;width:100%;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.sheet thead th{background:var(--paper);font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);text-align:center;position:sticky;top:0}
.sheet thead tr.hdr th{color:var(--ink);font-family:var(--sans);font-weight:600;font-size:12.5px;text-align:left;top:25px}
.sheet td.rn,.sheet th.rn{background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;width:28px}
.sheet td.num{text-align:right}
.sheet tr.hit td{background:var(--mark)}
.sheet td.key{background:#fbf6e2}
.sheet td.ret{background:var(--xl-soft)}
.sheet tr.sel td{font-weight:600}
.sheet tr.sel td.key{outline:2px solid var(--mark-line);outline-offset:-2px;background:var(--mark)}
.sheet tr.sel td.ret{outline:2px solid var(--xl);outline-offset:-2px}
.empty{padding:18px;color:var(--muted);font-size:15px}

/* condition ladder (SI / SI.CONJUNTO) */
.ladder{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:15px}
.ladder div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 10px;border:1px solid var(--line);align-items:center;color:var(--muted)}
.ladder div.t{border-color:var(--xl);background:var(--xl-soft);color:var(--ink)}
.ladder div.s{opacity:.45}
.ladder .r{font-family:var(--sans);font-weight:600}
.dist{display:flex;gap:10px;flex-wrap:wrap}
.dist span{font-size:14px;border:1px solid var(--line);padding:5px 10px;background:var(--paper)}
.dist b{font-family:var(--serif);font-size:18px;margin-right:4px}

/* function output list (texto/fechas) */
.outs{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);font-size:15px;overflow:auto;min-height:0}
.outs > div{padding:8px 6px;border-bottom:1px solid var(--line)}
.outs .fx{font-family:var(--mono);font-size:14px;color:var(--muted)}
.outs .fx b{color:var(--xl);font-weight:600}
.outs .o{font-family:var(--serif);font-size:19px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.outs .o.hid{filter:blur(8px);cursor:pointer}
.ficha{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.ficha div{padding:7px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}
.ficha small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:2px solid var(--ink)}
.sum>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.sum .n{font-family:var(--serif);font-size:26px;color:var(--xl)}
.sum code{font-size:14.5px;display:block;color:var(--ink);margin-top:3px;font-weight:500}
.sum p{font-size:16px;color:var(--muted)}
.sum>div>div{min-width:0}
.dlbtn{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--xl);color:#fff;padding:12px 16px;border:1px solid var(--xl)}
.dlbtn:hover{background:#0f5c3b}
.dlbtn .ic{font-size:22px;line-height:1}
.dlbtn b{display:block;font-size:16px;font-weight:600}
.dlbtn small{display:block;font-family:var(--mono);font-size:11.5px;opacity:.9;margin-top:2px}
.toast{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13px;padding:8px 14px;z-index:5}
</style>

<div id="viewport"><div id="stage">
  <div class="top"><span id="topL">MÓDULO 2 · FUNCIONES AVANZADAS DE EXCEL</span><div class="dots" id="dots"></div></div>

    </div>
  </div>
</div></div>

function head(title){ return `<div class="sim-h"><span>${title}</span><span class="live">● en vivo</span></div>`; }
function resBox(label){ return `<div class="res hide" data-res><div><div class="k">${label}</div><div class="val" data-val>—</div></div><span class="rev" data-rev>Clic para revelar</span></div>`; }
function wireRes(box){ const r=box.querySelector("[data-res]"); r.addEventListener("click",()=>{r.classList.toggle("hide"); r.querySelector("[data-rev]").textContent=r.classList.contains("hide")?"Clic para revelar":"Clic para ocultar";}); return v=>{r.querySelector("[data-val]").textContent=v;}; }
function sheet(rows, opt={}){
  const cols = opt.cols || [0,1,3,5,8];
  if(!rows.length) return `<div class="empty">Ninguna fila cumple las condiciones.</div>`;
  return `<table><thead><tr><th class="rn"></th>${cols.map(c=>`<th>${LET[c]}</th>`).join("")}</tr><tr class="hdr"><th class="rn">1</th>${cols.map(c=>`<th>${COLS[c]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>{
    const vals=[r.id,r.af,r.ced,r.ars,r.prov,r.tipo,r.pres,fdate(r.fecha),num(r.monto)];
    return `<tr class="${opt.hit&&opt.hit(r)?"hit":""}${opt.sel===r?" sel":""}"><td class="rn">${rec.indexOf(r)+2}</td>${cols.map(c=>`<td class="${c===8?"num ":""}${opt.key===c?"key":""}${opt.ret===c?"ret":""}">${esc(vals[c])}</td>`).join("")}</tr>`;}).join("")}</tbody></table>`;
}

function critSim(box,isSum){
  const pfx=isSum?"su":"co", ANY="(todas)";
  box.innerHTML = head(isSum?"Simulador · SUMAR.SI.CONJUNTO":"Simulador · CONTAR.SI.CONJUNTO")+`<div class="sim-b">
    <div class="ctrls"><label class="ctrl">criterio1 · ARS (A2)<select id="${pfx}-a">${opts(uniq("ars"),isSum?"MAPFRE Salud ARS":"SeNaSa")}</select></label>
    <label class="ctrl">criterio2 · Tipo de Servicio (B2)<select id="${pfx}-t">${opts([ANY].concat(uniq("tipo")),isSum?"Hospitalización":"Emergencia")}</select></label></div>
    <div class="livef" data-f></div>${resBox(isSum?"Resultado en D2":"Resultado en C2")}<div class="sheet" data-t></div></div>`;
  const out=wireRes(box), a=box.querySelector("#"+pfx+"-a"), t=box.querySelector("#"+pfx+"-t");
  const run=()=>{ const all=t.value===ANY, hit=r=>r.ars===a.value&&(all||r.tipo===t.value), rows=rec.filter(hit);
    const crit=`${T}[ARS]; <span class="v">"${a.value}"</span>${all?"":`; ${T}[Tipo de Servicio]; <span class="v">"${t.value}"</span>`}`;
    box.querySelector("[data-f]").innerHTML = isSum?`=SUMAR.SI.CONJUNTO(${T}[Monto Reclamado]; ${crit})`:`=CONTAR.SI.CONJUNTO(${crit})`;
    out(isSum?money(rows.reduce((s,r)=>s+r.monto,0)):rows.length);
    box.querySelector("[data-t]").innerHTML=sheet(rows,{cols:[0,1,3,5,8],hit:()=>isSum?false:true}); };
  a.onchange=t.onchange=run; run();
}

function copy(txt,btn){
  const done=()=>{btn.textContent="Copiado";setTimeout(()=>btn.textContent="Copiar",1400);};
  try{ navigator.clipboard.writeText(txt).then(done,()=>sel(btn)); }catch(e){ sel(btn); }
}
function sel(btn){ const r=document.createRange(); r.selectNodeContents(btn.previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent="Ctrl+C"; }

/* ---------- Motor ---------- */
const wrap=document.getElementById("slides");
wrap.innerHTML=S.map(s=>s.html).join("");
const els=[...wrap.children];
els.forEach((el,i)=>S[i].init&&S[i].init(el));
wrap.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
const dots=document.getElementById("dots");
dots.innerHTML=TOPICS.map((t,i)=>`<button title="${t.k}" aria-label="Ir a ${t.k}" data-t="${i}"></button>`).join("");
dots.querySelectorAll("button").forEach(b=>b.onclick=()=>go(2+3*b.dataset.t));
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(els.length-1,i));
  els.forEach((e,j)=>e.classList.toggle("on",j===cur));
  const tp=S[cur].topic;
  dots.querySelectorAll("button").forEach((b,j)=>{b.classList.toggle("cur",j===tp);b.classList.toggle("done",tp>j||(tp<0&&cur>1));});
  document.getElementById("count").textContent=String(cur+1).padStart(2,"0")+" / "+els.length;
  document.getElementById("topL").textContent = tp<0?"MÓDULO 2 · FUNCIONES AVANZADAS DE EXCEL":`MÓDULO 2 · TEMA 0${tp+1} DE 07 · ${TOPICS[tp].k.toUpperCase()}`;
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===els.length-1;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("fs").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select") return;
  if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&tag!=="button")){e.preventDefault();go(cur+1);}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home") go(0); else if(e.key==="End") go(els.length-1);
  else if(e.key==="f"||e.key==="F") document.getElementById("fs").click();
});
function fit(){ const st=document.getElementById("stage"); const s=Math.min((innerWidth-16)/1280,(innerHeight-16)/720); st.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",fit); fit(); go(0);
</script>
